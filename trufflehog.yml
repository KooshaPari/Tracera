version: 1
roots:
  - path: .
    scan_depth: 15
    exclude_paths:
      - "*.lock"
      - "**/package-lock.json"
      - "**/yarn.lock"
      - "**/node_modules/**"
      - "**/__pycache__/**"
      - "**/.venv/**"
      - "**/target/**"
      - "**/.git/**"
    detectors:
      - allowlist: false
