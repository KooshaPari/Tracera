# Reviewed dependency policy for the Rust workspace.
# Keep this explicit: new license identifiers must be reviewed, not silently
# accepted by a permissive default.

[advisories]
# flume 0.12.0/sqlx-sqlite currently pins yanked spin 0.9.8; keep visible as
# a warning until upstream publishes a compatible dependency update.
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1+",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
