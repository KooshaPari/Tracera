services:
  # Nginx API Gateway
  nginx:
    image: nginx:alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: tracertm-nginx
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      go-backend:
        condition: service_healthy
      python-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tracertm
    restart: unless-stopped

  # Nginx Prometheus Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.0.0@sha256:36dc92d75ab040f2bda0362c3803165a40bab47a16e1197afd43d5acc96407fa
    container_name: tracertm-nginx-exporter
    command:
      - '-nginx.scrape-uri=http://nginx/metrics'
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - tracertm
    restart: unless-stopped

  # Go Backend Service
  # NOTE: DB_PASSWORD must be set via environment variable - no default fallback for security
  go-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracertm-go-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-tracertm}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-tracertm}
      - REDIS_URL=redis://dragonfly:6379
      - NATS_URL=nats://nats:4222
      - PORT=8080
      - GIN_MODE=release
      - PYTHON_BACKEND_URL=http://python-backend:8000
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tracertm
    restart: unless-stopped

  # Python Backend Service
  python-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracertm-python-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-tracertm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-tracertm}
      - REDIS_URL=redis://dragonfly:6379
      - NATS_URL=nats://nats:4222
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GO_BACKEND_URL=http://go-backend:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tracertm
    restart: unless-stopped

  # PostgreSQL Database
  # NOTE: DB_PASSWORD must be set via environment variable - no default fallback for security
  postgres:
    image: postgres:15-alpine@sha256:09e4f20b14ddb3dfe3a0c825b206032aaf8f28300ba2070c0b60fc1c10c6abc7
    container_name: tracertm-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tracertm}
      POSTGRES_USER: ${DB_USER:-tracertm}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tracertm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracertm
    restart: unless-stopped

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
    container_name: tracertm-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-tracertm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-tracertm}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tracertm
    restart: unless-stopped

  # Redis-compatible cache
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.22.0@sha256:268b2df1e4ba07a0ba08944b2dfe95235c6a8dfce4621e0c39b242498351a9f8
    container_name: tracertm-dragonfly
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracertm
    restart: unless-stopped

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0@sha256:d82625bda93823fb40de881ffbb45b65aca772a39c30141387f92314c258da5d
    container_name: tracertm-redis-exporter
    environment:
      REDIS_ADDR: redis://dragonfly:6379
    ports:
      - "9121:9121"
    depends_on:
      dragonfly:
        condition: service_healthy
    networks:
      - tracertm
    restart: unless-stopped

  # NATS Message Broker
  nats:
    image: nats:2.10.1-alpine@sha256:786d33ad98a8a73aa4f10d909dcb550de62f1552c1d33eb21c9575849
    container_name: tracertm-nats
    ports:
      - "4222:4222"  # Client connections
      - "127.0.0.1:8222:8222"  # HTTP management/metrics — localhost only
      - "6222:6222"  # Cluster connections
    command: ["-js", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracertm
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.52.0@sha256:5c435642ca4d8427ca26f4901c11114023004709037880cd7860d5b7176aa731
    container_name: tracertm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - tracertm
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    container_name: tracertm-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - tracertm
    restart: unless-stopped

volumes:
  postgres_data:
  dragonfly_data:
  nats_data:
  prometheus_data:
  grafana_data:
  nginx_cache:
  nginx_logs:

networks:
  tracertm:
    driver: bridge
