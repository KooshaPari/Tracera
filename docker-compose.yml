services:
  # Nginx API Gateway
  nginx:
    image: nginx:alpine
    container_name: tracertm-nginx
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tracertm
    restart: unless-stopped

  # Nginx Prometheus Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.0.0
    container_name: tracertm-nginx-exporter
    command:
      - "-nginx.scrape-uri=http://nginx/metrics"
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - tracertm
    restart: unless-stopped

  # Python Backend Service
  python-backend:
    build:
      context: ./src/tracertm
    container_name: tracertm-python-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-tracertm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-tracertm}
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tracertm
    restart: unless-stopped

  # PostgreSQL Database
  # NOTE: DB_PASSWORD must be set via environment variable - no default fallback for security
  postgres:
    image: postgres:15-alpine
    container_name: tracertm-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tracertm}
      POSTGRES_USER: ${DB_USER:-tracertm}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tracertm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracertm
    restart: unless-stopped

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: tracertm-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-tracertm}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-tracertm}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tracertm
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: tracertm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracertm
    restart: unless-stopped

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: tracertm-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tracertm
    restart: unless-stopped

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.20-community
    container_name: tracertm-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tracertm_password}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/var/lib/neo4j/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - tracertm
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: tracertm-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracertm
    restart: unless-stopped

  # NATS Message Broker
  nats:
    image: nats:latest
    container_name: tracertm-nats
    ports:
      - "4222:4222" # Client connections
      - "127.0.0.1:8222:8222" # HTTP management/metrics — localhost only
      - "6222:6222" # Cluster connections
    command: ["-js", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8222/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracertm
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: tracertm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - tracertm
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:11.1.0
    container_name: tracertm-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - tracertm
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nats_data:
  prometheus_data:
  grafana_data:
  nginx_cache:
  nginx_logs:
  neo4j_data:
  minio_data:

networks:
  tracertm:
    driver: bridge
