name: impact
endpoint: /api/v1/impact
base_url: http://127.0.0.1:8080
tests:
  happy_path:
    method: POST
    body: {"entity_id": "test_id"}
    expect:
      status: 200
      has_body: true
  empty_input:
    method: POST
    body: {}
    expect:
      status: 200
  malformed_json:
    method: POST
    body: 'not json'
    expect:
      status: 400
