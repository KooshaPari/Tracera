name: sprints-create
endpoint: /sdlc-pm/sprints
base_url: http://127.0.0.1:8080
tests:
  happy_path:
    method: POST
    body: {"name": "Sprint 1", "start_date": "2026-01-01"}
    expect:
      status: 201
      has_body: true
  empty_input:
    method: POST
    body: {}
    expect:
      status: 400
  malformed_json:
    method: POST
    body: 'not json'
    expect:
      status: 400
