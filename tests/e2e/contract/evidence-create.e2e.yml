name: evidence-create
endpoint: /evidence
base_url: http://127.0.0.1:8080
tests:
  happy_path:
    method: POST
    body: { "source": "e2e_test", "payload": {} }
    expect:
      status: 201
      has_body: true
  empty_input:
    method: POST
    body: {}
    expect:
      status: 400
  malformed_json:
    method: POST
    body: "not json"
    expect:
      status: 400
