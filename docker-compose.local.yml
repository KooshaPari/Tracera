services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: tracera
    expose: ["5432"]
    volumes: [pg-data-local:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracera -d tracera"]
      interval: 5s
      timeout: 5s
      retries: 12

  tracera-server:
    build:
      context: .
      dockerfile: Dockerfile.rust
    environment:
      TRACERA_BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://tracera:${POSTGRES_PASSWORD}@postgres:5432/tracera
    expose: ["8080"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    ports:
      - "${TRACERA_LOCAL_PORT:-18081}:80"
    depends_on:
      tracera-server: {condition: service_started}
    restart: unless-stopped

volumes:
  pg-data-local:
