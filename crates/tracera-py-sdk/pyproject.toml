[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "tracera"
version = "0.1.0"
description = "Python SDK for the Tracera REST API. Wraps ingest, graph traversal, AI queries, and item lookup with both sync and async clients."
requires-python = ">=3.12"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "kooshapari" },
]
keywords = ["tracera", "traceability", "sdk", "rest", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
# ``httpx`` is the only runtime dependency, and only required for the async
# client (``AsyncTracera``). The sync client uses ``urllib`` from stdlib so
# zero third-party packages are needed for the most common path.
async = ["httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "respx>=0.21", # mock httpx routes
]

[project.urls]
Homepage = "https://github.com/kooshapari/Tracera"
Issues = "https://github.com/kooshapari/Tracera/issues"
Source = "https://github.com/kooshapari/Tracera/tree/main/crates/tracera-py-sdk"

[tool.hatch.build.targets.wheel]
packages = ["tracera"]

[tool.hatch.build.targets.sdist]
include = ["tracera", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"