[package]
name = "tracera-core"
version = "0.1.0"
edition.workspace = true
rust-version = "1.82"
description = "Core traceability entity model, coverage matrix, and impact analysis for Tracera."
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/Tracera"
documentation = "https://docs.rs/tracera-core"
keywords = ["phenotype", "tracera", "core"]
categories = ["data-structures", "development-tools::profiling"]
authors = ["kooshapari"]

[features]
default = []

[dependencies]
base64.workspace = true
chrono.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# Shared ecosystem crates (phenoShared git source)
phenotype-error-core.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[package.metadata.binstall]
bin-dir = "tracera-core"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin = ["tracera-core"]
