[package]
name = "tracera-core"
version = "0.1.0"
edition.workspace = true
rust-version = "1.82"
license.workspace = true
repository.workspace = true
description = "Thin Tracera service crate on shared traceability-core (Neo4j glue, UI links, ops)."
documentation = "https://docs.rs/tracera-core"
keywords = ["phenotype", "tracera", "core"]
categories = ["data-structures", "development-tools::profiling"]
authors = ["kooshapari"]

[features]
default = []

[dependencies]
traceability-core = { path = "../../../phenotype-pm-core/crates/traceability-core" }
base64.workspace = true
chrono.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# Shared ecosystem crates (extracted to phenoShared 2026-06-14)
phenotype-error-core.workspace = true
phenotype-string.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
phenotype-test-infra.workspace = true

[package.metadata.binstall]
bin-dir = "tracera-core"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin = ["tracera-core"]
