[package]
name = "tracertm-mcp"
version = "0.1.3"
edition = "2021"
description = "Tracera MCP stdio server (native Rust, replaces python -m tracertm.mcp)"
repository = "https://github.com/KooshaPari/Tracera"
license = "MIT"

[[bin]]
name = "tracertm-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util"] }
