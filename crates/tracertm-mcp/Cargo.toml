[package]
name = "tracertm-mcp"
version = "0.2.0"
edition = "2021"
description = "Tracera MCP stdio server (native Rust, replaces python -m tracertm.mcp)"
repository = "https://github.com/KooshhaPari/Tracera"
license = "MIT"

[[bin]]
name = "tracertm-mcp"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "net"] }
