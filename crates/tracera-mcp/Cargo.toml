[package]
name = "tracera-mcp"
version = "0.1.0"
edition = "2021"
description = "Tracera MCP (Model Context Protocol) server over stdio — exposes SWEE graph read/write/navigate/propose tools backed by the tracera-server Store trait"
license = "MIT"

[lib]
name = "tracera_mcp"
path = "src/lib.rs"

[[bin]]
name = "mcp-server"
path = "src/bin/mcp-server.rs"

[dependencies]
# rmcp 3.2 — enable schemars so we can derive JsonSchema on tool args
rmcp = { version = "3.2", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.0"

# Common
tokio = { workspace = true }
async-trait = "0.1"
anyhow = "1"
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_path = "0.7"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
sha2 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Delegation into tracera-server Store trait
tracera-server = { path = "../tracera-server" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
