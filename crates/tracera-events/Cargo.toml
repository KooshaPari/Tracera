[package]
name = "tracera-events"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tracera events/analytics crate — ClickHouse-backed ingest and analytics for agent_runs, decisions, deploys, traces, and llm_calls."
authors = ["Phenotype <kooshapari@gmail.com>"]

[[bin]]
name = "events-ingest"
path = "src/bin/events-ingest.rs"

[lib]
name = "tracera_events"
path = "src/lib.rs"

[dependencies]
# Library deps
chrono = { workspace = true }
clickhouse = { version = "0.15", default-features = false, features = ["chrono", "uuid"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true }
# Binary-only deps (`anyhow` + `tracing-subscriber` are only used by
# `src/bin/events-ingest.rs` but are declared at the crate level so the
# dependency tree is shared and rebuilt once).
anyhow = "1"
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }