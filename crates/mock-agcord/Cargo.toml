[package]
name = "mock-agcord"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Mock AgCord server: returns AgCord-compatible JSON for Tracera's /ingest/agileplus endpoint"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
