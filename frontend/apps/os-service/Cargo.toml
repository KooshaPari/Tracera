[package]
name = "tracera-os-service"
version = "0.1.0"
description = "Cross-platform OS service for Tracera: manages backend + tray lifecycle and exposes a local HTTP control plane on 127.0.0.1:7799."
authors = ["kooshapari"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.82"
repository = "https://github.com/kooshapari/Tracera"
publish = false

# IMPORTANT: this crate intentionally lives outside the Tracera workspace
# at the root. Build standalone via
#   cargo build --manifest-path frontend/apps/os-service/Cargo.toml
# so the central ``cargo build`` of the server stays focused on the
# backend.

[[bin]]
name = "tracera-os-service"
path = "src/main.rs"

[dependencies]
# HTTP server for the local control plane. axum 0.7 supports hyper 1.x and
# is the most common / well-maintained choice.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "sync",
    "time",
    "io-util",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# Process supervision helpers.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# Logging — minimal facade so we can hook up platform-appropriate sinks.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Platform-specific deps are feature-gated so the build only pulls the
# correct crates per OS.
[target.'cfg(target_os = "linux")'.dependencies]
# systemd handles daemonization. ``sd-notify`` is used to signal readiness.
sd-notify = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# launchd plists are written to ~/Library/LaunchAgents/ by the install
# script; no extra crate is required at runtime.

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[features]
# ``service`` enables platform-specific service registration (Linux
# systemd notify, Windows SCM, macOS launchd plist generation). It is
# opt-in so cross-compilation doesn't pull in crates that won't compile
# on the build host.
service = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true