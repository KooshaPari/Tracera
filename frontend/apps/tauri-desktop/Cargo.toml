[package]
name = "tracera-desktop"
version = "0.1.0"
description = "Tauri 2 desktop shell for the Tracera web UI (hosts the Svelte app, system tray, native menu)."
authors = ["kooshapari"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.82"
repository = "https://github.com/kooshapari/Tracera"
publish = false

# IMPORTANT: this crate intentionally lives outside the Tracera workspace at
# the root. It is built standalone via ``cargo build --manifest-path
# frontend/apps/tauri-desktop/Cargo.toml`` so the central ``cargo build`` of
# the server stays focused on the backend.

[[bin]]
name = "tracera-desktop"
path = "src-tauri/src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enable verbose logging when launched with --features=verbose.
verbose = []
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true