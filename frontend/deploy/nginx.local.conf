server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 ipv6=off valid=10s;

  # Keep the local/Tailscale surface aligned with the production self-host policy.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/(health|healthz|ready|readyz|evidence|metrics|api/|trace/|sdlc-pm/|org-intel/) {
    set $tracera_upstream "tracera-server:8080";
    proxy_pass http://$tracera_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
