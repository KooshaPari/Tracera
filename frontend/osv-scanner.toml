# osv-scanner configuration for frontend/bun.lock (npm advisories).
#
# The repository-root ../osv-scanner.toml deliberately does not propagate into
# child directories (it documents this itself), so npm exceptions live here,
# next to the lockfile they apply to. Same convention as the Rust block at the
# root: every entry carries a concrete reason and an expiry that forces a
# revisit when upstream moves.
#
# This file currently contains NO exceptions.
#
# It previously ignored two advisories:
#
#   GHSA-vfj7-8cjw-p6xm  braces 3.0.3 stack-exhaustion DoS
#   GHSA-hp3w-g68c-fv3c  sprintf-js 1.0.3 unbounded-precision DoS
#
# Both were recorded as unfixed upstream. osv-scanner now reports both as
# "unused ignores", i.e. neither advisory matches any package in the current
# lockfile, so they suppress nothing and only serve to hide future findings.
# They are removed rather than left in place: a suppression that no longer
# suppresses anything is just a standing blind spot with a reason attached.
#
# If either advisory starts matching again it must be re-triaged on its merits,
# with a fresh reason and expiry - not reinstated from this comment.
