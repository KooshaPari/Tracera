# Cloudflare Workers — Secrets & Namespace Bindings
# Template: replace IDs with real Cloudflare account values, then run:
#   npx wrangler secret put TRACE_API_KEY
#   npx wrangler secret put CIVIS_PROVIDER_TOKEN
#
# To provision real R2 buckets + KV namespaces:
#   npx wrangler r2 bucket create tracera-assets
#   npx wrangler r2 bucket create tracera-wal
#   npx wrangler kv namespace create SESSIONS
#   npx wrangler kv namespace create RATE_LIMITS
#
# Then paste the IDs back into this file.

# ---------------------- Account ----------------------
account_id = "<paste Cloudflare account_id here>"  # Workers > Account > Workers > Account ID

# ---------------------- Top-level ---------------------
name = "tracera"
compatibility_date = "2026-06-27"
main = "workers/src/index.ts"

# ---------------------- Vars (non-secret config) -------
[vars]
ENVIRONMENT = "production"
PUBLIC_BASE_URL = "https://tracera.workers.dev"
LOG_LEVEL = "info"
# Real keys are managed via `wrangler secret put` (not checked into source)
PROVIDER_PRIMARY = "openai_compatible"
PROVIDER_FALLBACK = "minimax"
# Rate-limit ceiling per IP, per minute (KV-backed)
RATE_LIMIT_PER_MIN = "120"
# KV TTL for ephemeral blobs (seconds)
EPHEMERAL_TTL_SECONDS = "3600"

# ---------------------- KV bindings --------------------
# After running `wrangler kv namespace create SESSIONS`,
# paste the returned id under id, and the preview_id under preview_id.
[[kv_namespaces]]
binding = "SESSIONS"
id = "<paste SESSIONS namespace id>"
preview_id = "<paste SESSIONS preview id>"
# TTL hint (seconds); refreshed on every write
ttl = 3600

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "<paste RATE_LIMITS namespace id>"
preview_id = "<paste RATE_LIMITS preview id>"
ttl = 60

# ---------------------- R2 buckets ---------------------
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "tracera-assets"

[[r2_buckets]]
binding = "WAL"
bucket_name = "tracera-wal"

# ---------------------- Durable Objects ---------------
[[durable_objects.bindings]]
class_name = "TraceAggregator"
name = "AGGREGATOR"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TraceAggregator"]

# ---------------------- Secrets (managed via CLI) -----
# Required secrets — DO NOT commit real values.
#   TRACE_API_KEY            — provider auth (set per env)
#   CIVIS_PROVIDER_TOKEN     — Civis orchestrator shared token
#   PHENOTYPE_REGISTRY_TOKEN — upstream registry auth
#   GITHUB_PAT               — for release attestation hooks
# Optional:
#   SENTRY_DSN               — error tracking
#   OTEL_EXPORTER_OTLP_ENDPOINT — OTLP exporter for traces

# ---------------------- Observability -----------------
[observability.logs]
enabled = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
persist = true

# ---------------------- Routes -----------------------
# (Routes/zone bindings omitted — fill in if deploying under a custom domain.)

# ---------------------- Per-env overrides -------------
[env.staging]
name = "tracera-staging"
vars = { ENVIRONMENT = "staging", PUBLIC_BASE_URL = "https://staging.tracera.workers.dev", LOG_LEVEL = "debug" }

[env.staging.observability.logs]
enabled = true
head_sampling_rate = 0.1

[env.preview]
name = "tracera-preview"
workers_dev = true
