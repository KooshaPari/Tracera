version: "3"

vars:
  CARGO: cargo
  TRACERA_CRATE: tracera-core

tasks:
  default:
    desc: List available tasks
    cmds:
      - just --list
    silent: true

  fmt:
    desc: Format all Rust crates
    cmds:
      - "{{CARGO}} fmt --all"

  lint:
    desc: Run clippy with warnings as errors
    cmds:
      - "{{CARGO}} clippy --all-targets --all-features -- -D warnings"

  test:
    desc: Run tracera-core library tests
    cmds:
      - "{{CARGO}} test -p {{TRACERA_CRATE}} --lib"

  test-workspace:
    desc: Run the full workspace test suite
    cmds:
      - "{{CARGO}} test --workspace"

  build:
    desc: Build release artifacts
    cmds:
      - "{{CARGO}} build --workspace --release"

  deny:
    desc: Run cargo-deny against the manifest
    cmds:
      - "{{CARGO}} deny --manifest-path Cargo.toml --locked check"

  clean:
    desc: Remove build artifacts
    cmds:
      - "{{CARGO}} clean"

  changelog:
    desc: Preview the changelog (git-cliff)
    cmds:
      - git-cliff --config cliff.toml --tag {{default}} --output -

  release:
    desc: Run release-plz release-pr
    cmds:
      - release-plz release-pr --config release-plz.toml

  coverage:
    desc: Measure code coverage (SSOT: see grade.sh for the canonical command).
    cmds:
      - |
        if [[ -f "Cargo.toml" ]]; then
          cargo llvm-cov --workspace --fail-under-lines 85
        elif [[ -f "package.json" ]]; then
          npx jest --coverage --coverageThreshold='{"global":{"branches":85,"functions":85,"lines":85,"statements":85}}'
        elif [[ -f "pyproject.toml" || -f "setup.py" ]]; then
          pytest --cov=src --cov-report=term-missing --cov-fail-under=85
        elif [[ -f "go.mod" ]]; then
          go test -coverprofile=coverage.out -covermode=atomic ./... && go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//' | awk '{exit($1 < 85 ? 1 : 0)}'
        else
          echo "No recognized stack (Cargo.toml / package.json / pyproject.toml / go.mod) found." >&2
          exit 1
        fi
