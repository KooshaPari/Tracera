# Cloudflare Workers configuration for Tracera Edge
# NOTE: account_id is intentionally NOT here — it must be provided via the
# CLOUDFLARE_ACCOUNT_ID environment variable at deploy time.
# Do not commit production account IDs or tokens to this file.
# For local dev, set: CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN.

name = "tracera-edge"
main = "crates/tracera-edge/build/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Top-level (no name override) is no longer the production worker. The
# production custom domain lives on [env.prod] below; without this empty
# `routes` array, env.dev and env.preview would inherit it and reassign the
# prod hostname on every non-prod deploy.
routes = []

[vars]
# Top-level vars are only seen by the dry-run default; production deploys
# use [env.prod]. The values here are placeholders that mirror production
# so `wrangler dev` (no --env) still has something to talk to.
ENVIRONMENT = "production"
# Canonical Tracera URI (Sep-2026): all production traffic goes to
# tracera.pheno.studio.  This worker (tracera-edge) lives at
# tracera-edge.pheno.studio and proxies/aggregates to TRACERA_API.
TRACERA_API = "https://tracera.pheno.studio/api"
# Optional fallback (image-deploy from GHCR) — set only if needed.
# TRACERA_FALLBACK = "https://tracera-server.onrender.com"

[[kv_namespaces]]
binding = "TRACERA_KV"
# Replace with your real KV namespace IDs allocated via:
#   wrangler kv namespace create TRACERA_KV
# DO NOT COMMIT the real IDs here if they are sensitive; the deploy workflow
# injects them via secrets/environment.
id = "placeholder-kv-id"
preview_id = "placeholder-kv-preview-id"

[[r2_buckets]]
binding = "TRACERA_R2"
bucket_name = "tracera-artifacts"

[observability]
enabled = true
head_sampling_rate = 0.5

# ---------------------------------------------------------------------------
# Non-production workers.
#
# The top-level configuration above is production (`tracera-edge`, served at
# tracera-edge.pheno.studio). These environments give dev and preview their own
# worker names and API targets so a main-branch or pull-request deploy can never
# promote itself over the production worker.
#
# See docs/04-guides/ENVIRONMENTS.md for the trigger and hostname matrix.
# ---------------------------------------------------------------------------

[env.dev]
name = "tracera-edge-dev"
# Empty routes block prevents inheritance from the (now-empty) top-level
# routes. Without it, env.dev inherits whatever the top-level routes array
# contains, which used to include the production custom domain.
routes = []

# KV and R2 are not inherited by wrangler environments, so they are restated
# here. They currently resolve to the same namespace/bucket as production
# because the deploy workflow resolves a single KV id; give dev its own once
# that workflow can resolve a second one.
[[env.dev.kv_namespaces]]
binding = "TRACERA_KV"
id = "placeholder-kv-id"
preview_id = "placeholder-kv-preview-id"

[[env.dev.r2_buckets]]
binding = "TRACERA_R2"
bucket_name = "tracera-artifacts"

[env.dev.vars]
ENVIRONMENT = "dev"
TRACERA_API = "https://tracera-server-dev.onrender.com/api"

[env.preview]
name = "tracera-edge-preview"
# Empty routes block prevents inheritance from the (now-empty) top-level routes.
routes = []

[[env.preview.kv_namespaces]]
binding = "TRACERA_KV"
id = "placeholder-kv-id"
preview_id = "placeholder-kv-preview-id"

[[env.preview.r2_buckets]]
binding = "TRACERA_R2"
bucket_name = "tracera-artifacts"

[env.preview.vars]
ENVIRONMENT = "preview"
TRACERA_API = "https://tracera-server-dev.onrender.com/api"

# ---------------------------------------------------------------------------
# Production environment.
#
# This block owns the production custom domain. The deploy workflow selects
# it via `--env prod` for v* tags (see .github/workflows/deploy-cloudflare.yml).
# KV and R2 are restated because wrangler does not inherit bindings across
# env blocks.
# ---------------------------------------------------------------------------
[env.prod]
name = "tracera-edge"
routes = [
  { pattern = "tracera-edge.pheno.studio", custom_domain = true }
]

[[env.prod.kv_namespaces]]
binding = "TRACERA_KV"
id = "placeholder-kv-id"
preview_id = "placeholder-kv-preview-id"

[[env.prod.r2_buckets]]
binding = "TRACERA_R2"
bucket_name = "tracera-artifacts"

[env.prod.vars]
ENVIRONMENT = "production"
TRACERA_API = "https://tracera.pheno.studio/api"
