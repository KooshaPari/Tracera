services:
  - type: web
    name: tracera-server
    runtime: rust
    build:
      dockerfilePath: Dockerfile.rust
      buildTarget: production
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tracera-postgres
          property: connectionString
      - key: TRACERA_AUTH_TOKEN
        generateValue: true
      - key: TRACERA_BIND_ADDR
        value: "0.0.0.0:8080"
      - key: TRACERA_PUBLIC_BIND_MODE
        value: "loopback-published"
    ports:
      - type: http
        port: 8080
        name: http1
    autoDeploy: true

databases:
  - name: tracera-postgres
    region: omaha
    plan: free
    postgresVersion: "17"