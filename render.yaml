services:
  - type: web
    name: tracera-server
    runtime: rust
    build:
      dockerfilePath: Dockerfile.rust
      buildTarget: production
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tracera-postgres
          property: connectionString
      - key: TRACERA_AUTH_TOKEN
        generateValue: true
      - key: TRACERA_BIND_ADDR
        value: "0.0.0.0:8080"
      - key: TRACERA_PUBLIC_BIND_MODE
        value: "loopback-published"
    ports:
      - type: http
        port: 8080
        name: http1
    autoDeploy: true
    # GitHub OIDC keyless auth — Render auto-mints a short-lived OIDC token
    # for each deploy via the GitHub Actions workflow that calls
    # POST /v1/services/{id}/deploys with the OIDC JWT.
    # Removes the need for RENDER_API_KEY as a long-lived repo secret.
    oauth: github

databases:
  - name: tracera-postgres
    region: omaha
    plan: free
    postgresVersion: "17"
