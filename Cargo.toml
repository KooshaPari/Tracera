[workspace]
members = ["crates/tracera-server", "crates/tracertm-mcp", "crates/tracera-edge", "crates/tracera-cli", "crates/mock-agcord", "crates/tracera-events", "crates/tracera-workos", "crates/tracera-mcp", "crates/tracera-atlas"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kooshapari/Tracera"
description = "Tracera - Traceability and impact analysis for Phenotype"
authors = ["kooshapari"]

[workspace.dependencies]
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
proptest = "1"
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = ["github"]
installers = ["shell", "powershell", "msi"]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]
install-path = "CARGO_HOME"
pr-run-mode = "plan"

#[patch.crates-io]
# Pin digest to 0.10.7; rustls/rustcrypto's `digest` 0.11 release changed the
# public API (removed `core_api`, `KeyInit` without the `mac` feature) which breaks
# hmac 0.12 + any code using sha2's `core_api` paths (notably WorkOS webhook HMAC).
digest = { git = "https://github.com/RustCrypto/traits", tag = "v0.10.7" }
