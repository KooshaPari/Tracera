# SonarCloud Automatic Analysis reads this file for repository-side settings.
# The OpenAPI schema is deterministic generator output that is compiled and
# contract-tested; repeated shapes in it are not authored duplication debt.
# E2E specs and Storybook stories follow Playwright/Cortex conventions where
# step sequences are intentionally similar across scenarios; the harness
# already enforces coverage and contract parity, so excluding them from CPD
# matches the source-of-truth intent of the duplication metric.
sonar.cpd.exclusions=\
  frontend/apps/web/src/api/schema.ts,\
  frontend/apps/web/e2e/**,\
  frontend/apps/web/src/__tests__/**,\
  frontend/apps/web/**/*.stories.ts,\
  frontend/apps/web/**/*.stories.tsx,\
  frontend/apps/web/src/mocks/**,\
  frontend/apps/web/src/test-utils/**


# Two kinds of captured artifact are excluded from analysis:
#
# docs/state holds observation corpora: recorded scripts, receipts and
# responses, byte-attested by their own SHA256SUMS / EVIDENCE-SHA256.json /
# input-manifest.json manifests. They are not maintained source and cannot be
# edited without invalidating the attestation. Their integrity is enforced by
# scripts/verify_evidence_hashes.py.
#
# docs/sessions holds session working documents, not shipped product code.
# Two findings were raised there and neither is an exploitable defect:
#   pythonsecurity:S2083 render_status.py (BLOCKER) is a false positive: the
#     tainted value is STATUS.json *content*, which only becomes the text
#     written to a fixed path (Path(__file__).parent / "STATUS.md"). It never
#     influences the path.
#   pythonsecurity:S8707 extract_codex_digest.py (MAJOR) is an intentional
#     local CLI: reading the file the operator names on the command line is
#     the documented behaviour.
#
# Both paths are excluded from ruff, mypy and prettier on the same grounds.
# Listed explicitly so the exclusion is auditable.
sonar.exclusions=\
  docs/state/**,\
  docs/sessions/**
