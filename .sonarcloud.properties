# SonarCloud Automatic Analysis reads this file for repository-side settings.
# The OpenAPI schema is deterministic generator output that is compiled and
# contract-tested; repeated shapes in it are not authored duplication debt.
# E2E specs and Storybook stories follow Playwright/Cortex conventions where
# step sequences are intentionally similar across scenarios; the harness
# already enforces coverage and contract parity, so excluding them from CPD
# matches the source-of-truth intent of the duplication metric.
sonar.cpd.exclusions=\
  frontend/apps/web/src/api/schema.ts,\
  frontend/apps/web/e2e/**,\
  frontend/apps/web/src/__tests__/**,\
  frontend/apps/web/**/*.stories.ts,\
  frontend/apps/web/**/*.stories.tsx,\
  frontend/apps/web/src/mocks/**,\
  frontend/apps/web/src/test-utils/**
