[project.scripts]
rtm = "tracertm.cli:app"
tracertm = "tracertm.cli:app"
tracertm-mcp = "tracertm.mcp:run_server"
rtm-mcp = "tracertm.mcp:run_server"

[tool.setuptools.packages.find]
where = [
    "src",
]
include = [
    "tracertm*",
]

[tool.pytest.ini_options]
testpaths = [
    "src/tracertm",
]
pythonpath = [
    "src",
]
python_files = [
    "test_*.py",
]
python_classes = [
]
python_functions = [
    "test_*",
]
addopts = [
    "-ra",
    "-vv",
    "--strict-markers",
    "--tb=short",
    "-p",
    "asyncio",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (database, file system)",
    "e2e: End-to-end tests (full CLI workflows)",
    "cli: CLI command tests",
    "slow: Slow tests (>1s execution time)",
    "agent: Agent coordination tests (concurrent operations)",
    "asyncio: Async tests (mark for async tests)",
    "performance: Performance and load tests",
    "property: Property-based tests using Hypothesis",
    "benchmark: Benchmark tests for performance measurement",
    "smoke: Minimal critical-path checks",
    "chaos: Chaos/resilience tests (connection failures, resource exhaustion)",
    "live_neo4j: Tests that require a live Neo4j instance (NEO4J_URI env var)",
]
filterwarnings = [
    "error",
    "ignore::pytest_benchmark.logger.PytestBenchmarkWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::pytest.PytestAssertRewriteWarning",
    "ignore::RuntimeWarning",
]

[tool.pytest_asyncio]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = [
    "src/tracertm",
]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "except (ImportError|Exception|ModuleNotFoundError).*:",
    "except ImportError:",
    "except Exception:.*# (test )?fallback",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.interrogate]
fail-under = 85
path = [
    "src/",
]
exclude = [
    "tests",
    "build",
    "dist",
    ".venv",
]
ignore-init-module = true
ignore-init-method = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "build",
    "dist",
    ".venv",
    "ARCHIVE",
]
skips = [
    "B101",
]
severity = "medium"
confidence = "medium"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
    "R",    # flake8-return
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
]
ignore = [
    "E501",  # line-too-long — handled by formatter / line-length config
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # asserts allowed in tests
    "S105",  # hardcoded passwords OK in test fixtures
    "S106",  # hardcoded passwords OK in test fixtures
    "S107",  # hardcoded passwords OK in test fixtures
    "S108",  # /tmp usage OK in tests
    "S110",  # try/except pass acceptable in test skips
    "S301",  # pickle usage OK in test fixtures
    "S311",  # pseudo-random generators OK in tests
    "S603",  # subprocess calls OK in tests
    "S607",  # partial path OK in tests
    "S404",  # subprocess module OK in tests
    "S608",  # partial path OK in tests
    "N802",  # function name casing relaxed in tests
    "N803",  # argument name casing relaxed in tests
    "N806",  # variable casing relaxed in tests
    "B008",  # function call in default argument OK in test factories
    "B011",  # assert False OK in tests
    "B017",  # pytest.raises(Exception) OK in tests
    "SIM117",# combined with-statements OK in tests
    "RUF012",# mutable class attributes OK in test classes
]
"**/conftest.py" = [
    "S101",
    "S102",
    "S106",
    "F401",
    "F811",
    "E402",
    "B011",
]
"**/test_*.py" = [
    "S101",
    "S105",
    "S106",
    "S108",
    "S110",
    "S311",
    "S603",
    "S607",
    "S404",
    "S608",
    "B011",
    "B017",
]
"**/*_test.py" = [
    "S101",
    "S105",
    "S106",
    "S108",
    "S110",
    "S311",
    "S603",
    "S607",
    "S404",
    "S608",
    "B011",
    "B017",
]
"scripts/**/*.py" = [
    "S101",
    "S108",
    "S110",
    "S603",
    "S607",
    "S404",
    "S608",
    "T201",  # print OK in scripts
    "INP001",# implicit namespace packages OK in scripts
    "E402",  # import order OK in scripts
    "B008",  # function call in default OK in scripts
]
"docs/**/*.py" = [
    "INP001",
    "E402",
    "B011",
]
"alembic/**/*.py" = [
    "INP001",
    "E402",
    "ERA001",
    "S301",
    "N806",
]

[tool.ruff.lint.isort]
known-first-party = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.ty.src]
include = [
    "src",
