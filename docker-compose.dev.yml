services:
  postgres17:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracera
      POSTGRES_USER: tracera
      POSTGRES_PASSWORD: tracera_dev
    ports: ["5432:5432"]
    volumes: [postgres17_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracera -d tracera"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tracera-net]
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 1g}
        reservations: {memory: 256M}

  redis7:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis7_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.35", memory: 512M}, reservations: {memory: 128M}}}

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: ["dragonfly", "--requirepass=tracera_dev", "--appendonly", "no"]
    ports: ["6380:6379"]
    volumes: [dragonfly_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a tracera_dev ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.75", memory: 1g}, reservations: {memory: 256M}}}

  nats-jetstream:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports: ["4222:4222", "8223:8222"]
    volumes: [nats_data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.35", memory: 512M}, reservations: {memory: 128M}}}

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment: {MINIO_ROOT_USER: minio_dev, MINIO_ROOT_PASSWORD: tracera_minio_dev}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.5", memory: 768M}, reservations: {memory: 192M}}}

  rabbitmq3-management:
    image: rabbitmq:3.13-management-alpine
    environment: {RABBITMQ_DEFAULT_USER: tracera, RABBITMQ_DEFAULT_PASS: tracera_dev}
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq3_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.5", memory: 768M}, reservations: {memory: 192M}}}

  meilisearch:
    image: getmeili/meilisearch:v1.8
    environment: {MEILI_MASTER_KEY: tracera_meili_dev, MEILI_ENV: development}
    ports: ["7700:7700"]
    volumes: [meili_data:/meili_data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.5", memory: 768M}, reservations: {memory: 192M}}}

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    ports: ["8123:8123", "9000:9000"]
    volumes: [clickhouse_data:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.75", memory: 1g}, reservations: {memory: 256M}}}

  qdrant:
    image: qdrant/qdrant:v1.9.4
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:6333/readyz | grep true"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.5", memory: 1g}, reservations: {memory: 256M}}}

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment: {discovery.type: single-node, plugins.security.disabled: "true", bootstrap.memory_lock: "true", OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m}
    ports: ["9200:9200"]
    volumes: [opensearch_data:/usr/share/opensearch/data]
    ulimits: {memlock: {soft: -1, hard: -1}, nofile: {soft: 65536, hard: 65536}}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 15
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.75", memory: 1.2g}, reservations: {memory: 512M}}}

  neo4j5:
    image: neo4j:5-community
    environment: {NEO4J_AUTH: neo4j/tracera_dev, NEO4J_server_memory_heap_initial__size: 256m, NEO4J_server_memory_heap_max__size: 512m, NEO4J_server_memory_pagecache_size: 512m}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j5_data:/data, neo4j5_logs:/logs]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7474 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 15
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.75", memory: 1g}, reservations: {memory: 512M}}}

  temporal:
    image: temporalio/auto-setup:1.22
    environment: {TEMPORAL_ADDRESS: temporal:7233}
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD", "tctl", "workflow", "list", "--address", "temporal:7233"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.5", memory: 768M}, reservations: {memory: 256M}}}

  kafka-zookeeper:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_BROKER_ID: 1
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-zookeeper:9093
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]
    volumes: [kafka_data:/bitnami/kafka]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.75", memory: 1.5g}, reservations: {memory: 512M}}}

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment: {ALLOW_ANONYMOUS_LOGIN: "yes"}
    ports: ["2181:2181"]
    volumes: [zookeeper_data:/bitnami/zookeeper]
    healthcheck: {test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"], interval: 15s, timeout: 5s, retries: 20}
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.35", memory: 512M}, reservations: {memory: 128M}}}

  vault:
    image: hashicorp/vault:1.15
    environment: {VAULT_DEV_ROOT_TOKEN_ID: tracera_vault_dev, VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200}
    command: ["server", "-dev"]
    ports: ["8200:8200"]
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD", "vault", "status", "-format=json"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.25", memory: 384M}, reservations: {memory: 128M}}}

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686"]
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:16686/"], interval: 10s, timeout: 3s, retries: 10}
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.25", memory: 384M}, reservations: {memory: 128M}}}

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes: [loki_data:/loki]
    healthcheck: {test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3100/ready | grep -Eq 'ready|OK'"], interval: 10s, timeout: 3s, retries: 10}
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.35", memory: 512M}, reservations: {memory: 128M}}}

  prometheus:
    image: prom/prometheus:v2.51.2
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["9090:9090"]
    volumes: [prometheus_data:/prometheus]
    healthcheck: {test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/ready | grep -Eq 'ready|OK'"], interval: 10s, timeout: 3s, retries: 10}
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.35", memory: 768M}, reservations: {memory: 192M}}}

  grafana:
    image: grafana/grafana:10.3.1
    environment: {GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: tracera_grafana_dev}
    ports: ["3000:3000"]
    volumes: [grafana_data:/var/lib/grafana]
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"], interval: 10s, timeout: 3s, retries: 10}
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.35", memory: 512M}, reservations: {memory: 128M}}}

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    environment: {KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: tracera_keycloak_dev}
    ports: ["8080:8080"]
    volumes: [keycloak_data:/opt/keycloak/data]
    healthcheck: {test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"], interval: 15s, timeout: 5s, retries: 20}
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.75", memory: 1g}, reservations: {memory: 384M}}}

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8025/api/v2/messages"], interval: 10s, timeout: 3s, retries: 10}
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.1", memory: 128M}, reservations: {memory: 64M}}}

  traefik:
    image: traefik:v2.10
    command: ["--api.insecure=true", "--providers.docker=true", "--providers.docker.exposedbydefault=false", "--entrypoints.web.address=:80", "--entrypoints.websecure.address=:443"]
    ports: ["80:80", "443:443"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    healthcheck: {test: ["CMD", "traefik", "healthcheck"], interval: 15s, timeout: 3s, retries: 10}
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.2", memory: 256M}, reservations: {memory: 64M}}}

  rabbitmq-streams:
    image: rabbitmq:3.13-management-alpine
    command: ["rabbitmq-server"]
    environment: {RABBITMQ_DEFAULT_USER: tracera, RABBITMQ_DEFAULT_PASS: tracera_dev}
    ports: ["5552:5552"]
    volumes: [rabbitmq_streams_data:/var/lib/rabbitmq]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 10}
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.5", memory: 768M}, reservations: {memory: 192M}}}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment: {discovery.type: single-node, xpack.security.enabled: "false", bootstrap.memory_lock: "true", ES_JAVA_OPTS: -Xms512m -Xmx512m}
    ports: ["9201:9200"]
    volumes: [elasticsearch_data:/usr/share/elasticsearch/data]
    ulimits: {memlock: {soft: -1, hard: -1}, nofile: {soft: 65536, hard: 65536}}
    healthcheck: {test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"], interval: 15s, timeout: 5s, retries: 20}
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.75", memory: 1.2g}, reservations: {memory: 512M}}}

  mongodb7:
    image: mongo:7
    environment: {MONGO_INITDB_ROOT_USERNAME: tracera, MONGO_INITDB_ROOT_PASSWORD: tracera_dev}
    ports: ["27017:27017"]
    volumes: [mongodb7_data:/data/db]
    healthcheck: {test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"], interval: 10s, timeout: 5s, retries: 10}
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.5", memory: 1g}, reservations: {memory: 256M}}}

  atlassian-statuspage-mock:
    image: nginx:1.25-alpine
    ports: ["8090:80"]
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"], interval: 10s, timeout: 3s, retries: 10}
    networks: [tracera-net]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.1", memory: 128M}, reservations: {memory: 64M}}}

networks:
  tracera-net:
    name: tracera-net
    driver: bridge

volumes:
  postgres17_data:
  redis7_data:
  dragonfly_data:
  nats_data:
  minio_data:
  rabbitmq3_data:
  meili_data:
  clickhouse_data:
  qdrant_data:
  opensearch_data:
  neo4j5_data:
  neo4j5_logs:
  kafka_data:
  zookeeper_data:
  loki_data:
  prometheus_data:
  grafana_data:
  keycloak_data:
  rabbitmq_streams_data:
  elasticsearch_data:
  mongodb7_data:
