# =============================================================================
# Tracera routes on the shared "tracera-local" Cloudflare Tunnel
# =============================================================================
#
# Reconciled against the live Cloudflare tunnel configuration on 2026-10-13.
# This file records the Tracera-owned routes currently carried by the shared
# tunnel. The live tunnel also carries routes owned by other Phenotype products;
# those routes are intentionally not declared here and belong in shared infra IaC.
#
# IMPORTANT:
# - tracera.pheno.studio is Access-protected and fronts the Tracera web/auth path.
# - t.tracera.pheno.studio is the direct Access-protected Tracera backend route.
# - api.tracera.pheno.studio and mcp.tracera.pheno.studio are NOT live DNS routes
#   as of this reconciliation and must not be treated as production endpoints.
# - This repo must not claim to be the SSOT for the entire shared tunnel.
#
# Private tailnet access remains a separate path and does not depend on this file.
# =============================================================================

tunnel: e66542c9-fa12-41a1-b8eb-291f95368fba
credentials-file: .cloudflared/e66542c9-fa12-41a1-b8eb-291f95368fba.json

ingress:
  # AuthKit/auth-session endpoints observed on the live parent hostname.
  - hostname: tracera.pheno.studio
    path: ^/api/v1/auth/(authkit/.*|me|logout)$
    service: http://localhost:8090

  # Remaining Tracera web/API traffic on the parent hostname.
  - hostname: tracera.pheno.studio
    service: http://localhost:8091

  # Direct Tracera backend route used for authenticated machine health checks.
  - hostname: t.tracera.pheno.studio
    service: http://localhost:8080

  # This file is a Tracera route fragment. Do not silently add shared-tunnel
  # routes owned by AgilePlus, Gate, Trace, or other products here.
  - service: http_status:404

logfile: .cloudflared/tunnel.log
loglevel: info
