[env]
_.file = ".env.example"

[tools]
rust = "1.82"
node = "22"
python = "3.12"
bun = "latest"
uv = "latest"
just = "latest"
git-cliff = "latest"
release-plz = "latest"
cargo-deny = "latest"

[tasks]
fmt = "cargo fmt --all"
lint = "cargo clippy --all-targets --all-features -- -D warnings"
test = "cargo test -p tracera-core --lib"
build = "cargo build --workspace --release"
deny = "cargo deny --manifest-path Cargo.toml --locked check"
