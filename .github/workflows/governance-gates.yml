name: Governance Gates

on:
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-artifact-gate:
    name: qa-artifact-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run QA artifact gate
        run: scripts/qa-gates/qa-artifact-gate.sh

  qa-assurance-gate:
    name: qa-assurance-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run QA assurance gate
        run: scripts/qa-gates/qa-assurance-gate.sh

  antipattern-detect:
    name: antipattern-detect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run antipattern detection gate
        run: scripts/qa-gates/antipattern-detect.sh
