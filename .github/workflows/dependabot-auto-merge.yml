name: Dependabot Auto-Merge
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: write
  actions: read
jobs:
  verify-tests:
    name: Verify Tests Pass
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    outputs:
      should-merge: ${{ steps.check.outputs.should-merge }}
      update-type: ${{ steps.metadata.outputs.update-type }}
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
    - name: Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Check update type
      id: check
      run: "echo \"Update type: ${{ steps.metadata.outputs.update-type }}\"\necho\
        \ \"Dependency names: ${{ steps.metadata.outputs.dependency-names }}\"\n\n\
        # Auto-merge patch and minor updates\nif [[ \"${{ steps.metadata.outputs.update-type\
        \ }}\" == \"version-update:semver-patch\" ]] || \\\n   [[ \"${{ steps.metadata.outputs.update-type\
        \ }}\" == \"version-update:semver-minor\" ]]; then\n  echo \"should-merge=true\"\
        \ >> $GITHUB_OUTPUT\nelse\n  echo \"should-merge=false\" >> $GITHUB_OUTPUT\n\
        fi\n"
    - name: Set up Node.js
      if: contains(steps.metadata.outputs.dependency-names, 'npm') || contains(steps.metadata.outputs.dependency-names,
        'node')
      uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65
      with:
        node-version: '20'
    - name: Set up Python
      if: contains(steps.metadata.outputs.dependency-names, 'python')
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
        cache: pip
    - name: Set up Go
      if: contains(steps.metadata.outputs.dependency-names, 'go')
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: '1.23'
        cache: true
    - name: Install dependencies
      run: "if [ -f \"frontend/package.json\" ]; then\n  cd frontend && bun install\n\
        fi\nif [ -f \"pyproject.toml\" ]; then\n  uv pip install --system -e .\nfi\nif [ -f \"\
        backend/go.mod\" ]; then\n  cd backend && go mod download\nfi\n"
    - name: Run linting
      run: "if [ -f \"frontend/package.json\" ]; then\n  cd frontend && bun run lint\
        \ || true\nfi\n"
    - name: Run tests
      run: "# Run frontend tests\nif [ -f \"frontend/package.json\" ]; then\n  cd\
        \ frontend && bun run test || exit 1\nfi\n\n# Run Go tests\nif [ -f \"backend/go.mod\"\
        \ ]; then\n  cd backend && go test ./... -short || exit 1\nfi\n\n# Run Python\
        \ tests\nif [ -f \"pyproject.toml\" ]; then\n  pytest tests/ -v || exit 1\n\
        fi\n"
    timeout-minutes: 10
  auto-merge:
    name: Auto-Merge PR
    runs-on: ubuntu-latest
    needs: verify-tests
    if: needs.verify-tests.outputs.should-merge == 'true'
    steps:
    - name: Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a
    - name: Approve PR
      run: 'gh pr review "$PR_URL" --approve -b "Auto-approving ${{ steps.metadata.outputs.update-type
        }} update"

        '
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Enable auto-merge
      run: 'gh pr merge "$PR_URL" --auto --squash

        '
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
  comment-major-update:
    name: Comment on Major Update
    runs-on: ubuntu-latest
    needs: verify-tests
    if: needs.verify-tests.outputs.update-type == 'version-update:semver-major'
    steps:
    - name: Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a
    - name: Comment on PR
      run: 'gh pr comment "$PR_URL" --body "⚠️ **Major version update detected**


        This PR contains a major version update and requires manual review before
        merging.


        **Dependency**: ${{ steps.metadata.outputs.dependency-names }}

        **Update type**: ${{ steps.metadata.outputs.update-type }}


        Please review the changelog and breaking changes before approving this PR."

        '
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
