name: Frontend contract checks

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-contract-checks.yml'
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRACERA_API_BASE: ${{ vars.TRACERA_API_BASE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: latest

      - name: Install frontend deps
        run: bun install
        working-directory: frontend

      - name: Build web bundle
        run: npm run build
        working-directory: frontend

      - name: Enforce frontend bundle budget
        run: node scripts/check-bundle-budget.mjs
        working-directory: frontend

      - name: Workspace typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Tracera client contract + dashboard state tests
        run: npm run test:unit
        working-directory: frontend

      - name: Generate and verify release manifest
        run: npm run release:manifest && npm run verify:release-manifest
        working-directory: frontend

      - name: Verify reproducible release manifest
        run: npm run test:release-manifest
        working-directory: frontend

      - name: Frontend parity smoke (optional, if TRACERA_API_BASE set)
        run: |
          if [ -n "${TRACERA_API_BASE}" ]; then
            VITE_API_BASE="${TRACERA_API_BASE}" npm run smoke:parity
          else
            echo "Skipping parity smoke: TRACERA_API_BASE not set"
          fi
        working-directory: frontend

      - name: Frontend POST parity smoke (optional, if TRACERA_API_BASE set)
        run: |
          if [ -n "${TRACERA_API_BASE}" ]; then
            VITE_API_BASE="${TRACERA_API_BASE}" npm run smoke:post
          else
            echo "Skipping POST smoke: TRACERA_API_BASE not set"
          fi
        working-directory: frontend
