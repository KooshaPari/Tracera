name: Chromatic Visual Regression Testing
on:
  push:
    branches:
    - main
    - develop
    - feature/**
    paths:
    - frontend/apps/web/src/components/**
    - frontend/apps/web/.storybook/**
    - frontend/apps/web/package.json
    - .github/workflows/chromatic.yml
  pull_request:
    branches:
    - main
    - develop
    paths:
    - frontend/apps/web/src/components/**
    - frontend/apps/web/.storybook/**
    - frontend/apps/web/package.json
    - .github/workflows/chromatic.yml
permissions:
  contents: read
concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromatic:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      with:
        fetch-depth: 1
        sparse-checkout: 'frontend/apps/web

          '
        sparse-checkout-cone-mode: true
        lfs: false
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: "1.1.38"
    - name: Cache Bun dependencies
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v-latest
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-1.1.38-${{ hashFiles('frontend/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-1.1.38-
    - name: Install dependencies
      working-directory: frontend
      run: bun install --frozen-lockfile
    - name: Build Storybook
      working-directory: frontend/apps/web
      run: bun run storybook:build
    - name: Run Chromatic
      working-directory: frontend/apps/web
      env:
        CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      run: bun run chromatic:ci
    - name: Upload chromatic report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: chromatic-report
        path: frontend/apps/web/junit-report.xml
        retention-days: 30
    - name: Comment PR with results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v-latest
      with:
        script: "const fs = require('fs');\nconst reportPath = 'frontend/apps/web/junit-report.xml';\n\
          \nif (fs.existsSync(reportPath)) {\n  const report = fs.readFileSync(reportPath,\
          \ 'utf8');\n  const passMatch = report.match(/tests=\"(\\d+)\"/);\n  const\
          \ failureMatch = report.match(/failures=\"(\\d+)\"/);\n\n  const tests =\
          \ passMatch ? passMatch[1] : 'unknown';\n  const failures = failureMatch\
          \ ? failureMatch[1] : '0';\n\n  github.rest.issues.createComment({\n   \
          \ issue_number: context.issue.number,\n    owner: context.repo.owner,\n\
          \    repo: context.repo.repo,\n    body: `## Visual Regression Test Results\\\
          n\\n- **Total Snapshots**: ${tests}\\n- **Regressions Found**: ${failures}\\\
          n\\n[View full Chromatic report](${process.env.CHROMATIC_URL})`\n  });\n\
          }\n"
  visual-test-status:
    name: Visual Test Status Check
    runs-on: ubuntu-latest
    if: always()
    needs: chromatic
    steps:
    - name: Check visual test results
      if: needs.chromatic.result == 'failure'
      run: 'echo "Visual regression tests failed"

        exit 1

        '
    - name: Visual tests passed
      if: needs.chromatic.result == 'success'
      run: echo "All visual regression tests passed"
    timeout-minutes: 20
