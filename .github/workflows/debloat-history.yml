name: debloat-history
on:
  workflow_dispatch:
    inputs:
      confirm: { description: 'Type DEBLOAT', required: true }
      dry_run: { description: 'true=report,false=push', required: true, default: 'true' }
permissions:
  contents: write
jobs:
  debloat:
    if: ${{ github.event.inputs.confirm == 'DEBLOAT' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install git-filter-repo
        run: pipx install git-filter-repo || pip install git-filter-repo
      - name: Mirror clone
        run: |
          git clone --mirror https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo.git
          echo "BEFORE: $(du -sh repo.git | cut -f1)"
      - name: Strip bloat
        run: |
          cd repo.git
          git filter-repo --force --strip-blobs-bigger-than 5M --path-glob '*app-builder*' --invert-paths --path-glob '*/node_modules/*' --invert-paths --path-glob '*basedpyright-errors*' --invert-paths
          git reflog expire --expire=now --all || true
          git gc --prune=now --aggressive || true
          echo "AFTER: $(du -sh . | cut -f1)"
      - name: Push main only (not --mirror, avoids protected releases/* refs)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          cd repo.git
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main:main
          echo "PUSHED main"
      - name: Dry note
        if: ${{ github.event.inputs.dry_run != 'false' }}
        run: echo "DRY RUN - no push"
