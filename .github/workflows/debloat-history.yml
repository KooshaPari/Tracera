name: debloat-history
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEBLOAT to confirm'
        required: true
      dry_run:
        description: 'true = report only, false = force-push'
        required: true
        default: 'true'
permissions:
  contents: write
jobs:
  debloat:
    if: ${{ github.event.inputs.confirm == 'DEBLOAT' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install git-filter-repo
        run: pipx install git-filter-repo || pip install git-filter-repo
      - name: Mirror clone
        run: |
          git clone --mirror https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo.git
          echo "BEFORE: $(du -sh repo.git | cut -f1)"
      - name: Strip bloat
        run: |
          cd repo.git
          git filter-repo --force --strip-blobs-bigger-than 5M --path-glob '*app-builder*' --invert-paths --path-glob '*/node_modules/*' --invert-paths
          echo "AFTER: $(du -sh . | cut -f1)"
          git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' 2>/dev/null | awk '/^blob/ {print $3, $4}' | sort -rn | head -15
      - name: Force-push
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          cd repo.git
          git push --force --mirror https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          echo "PUSHED. Restore via tag pre-debloat-backup."
      - name: Dry note
        if: ${{ github.event.inputs.dry_run != 'false' }}
        run: echo "DRY RUN — no push."
