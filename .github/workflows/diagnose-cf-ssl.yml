name: Diagnose CF SSL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check SSL cert status for t.tracera.pheno.studio
        run: |
          echo "=== Zone info ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=pheno.studio" | python3 -m json.tool
          
          echo ""
          echo "=== DNS records for tracera.pheno.studio ==="
          ZONE_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=pheno.studio" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'])" 2>/dev/null)
          
          if [ -n "$ZONE_ID" ]; then
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=t.tracera.pheno.studio" | python3 -m json.tool
            
            echo ""
            echo "=== SSL/TLS settings ==="
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" | python3 -m json.tool
            
            echo ""
            echo "=== Universal SSL status ==="
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/ssl/universal_certificates" | python3 -m json.tool
          else
            echo "ERROR: Could not find zone pheno.studio"
          fi
