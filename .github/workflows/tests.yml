name: Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
permissions:
  contents: read
jobs:
  test-matrix:
    name: Tests (${{ matrix.test-type }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.13'
        - '3.14'
        test-type:
        - unit
        - integration
        - e2e
        include:
        - python-version: '3.13'
          test-type: property
        - python-version: '3.14'
          test-type: property
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tracertm_test
          POSTGRES_USER: tracertm
          POSTGRES_PASSWORD: test_password
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
        - 5432:5432
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout
          5s --health-retries 5
        ports:
        - 6379:6379
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
    - name: Detect changed Python test scope
      id: python-scope
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\"\nchanged=\"$(git diff --name-only \"$base\"...HEAD | grep -Ev\
        \ '^tests/contracts/' || true)\"\nif echo \"$changed\" | grep -Eq '^(src/|tests/|conftest\\\
        .py)'; then\n  echo \"run=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"run=false\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"No Python test-scope changes; skipping Python\
        \ ${{ matrix.test-type }} tests.\"\nfi\n"
    - name: Install UV
      if: steps.python-scope.outputs.run == 'true'
      uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06
      with:
        version: latest
    - name: Set up Python
      if: steps.python-scope.outputs.run == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache uv dependencies
      if: steps.python-scope.outputs.run == 'true'
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
        restore-keys: '${{ runner.os }}-uv-

          '
    - name: Install dependencies
      if: steps.python-scope.outputs.run == 'true'
      run: uv sync --all-groups
    - name: Run ${{ matrix.test-type }} tests (fast first)
      if: steps.python-scope.outputs.run == 'true'
      id: test-run
      env:
        DATABASE_URL: postgresql+asyncpg://tracertm:test_password@localhost:5432/tracertm_test
        REDIS_URL: redis://localhost:6379
        PYTHONPATH: ${{ github.workspace }}/src
      shell: bash
      run: |
        set -euo pipefail
        if ! uv run python -c "import tracertm.cli" 2>/dev/null; then
          if [ "${{ matrix.test-type }}" != "unit" ] && [ "${{ matrix.test-type }}" != "property" ]; then
            echo "tracertm.cli not installed; skipping ${{ matrix.test-type }} tests." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
        fi
        if [ "${{ matrix.test-type }}" = "unit" ]; then
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t unit_targets < <(bash .github/scripts/pr_unit_test_targets.sh "${{ github.event.pull_request.base.sha }}")
          else
            unit_targets=(tests/unit)
          fi
          uv run pytest "${unit_targets[@]}" -m "not slow" -v --cov=src/tracertm --cov-report=xml \
            --cov-report=html --cov-report=term-missing --cov-fail-under=0 \
            --junitxml=junit-${{ matrix.test-type }}.xml
          set +e
          uv run pytest "${unit_targets[@]}" -m "slow" -v --cov=src/tracertm --cov-append \
            --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=0 \
            --junitxml=junit-${{ matrix.test-type }}-slow.xml
          slow_code=$?
          set -e
          if [ "$slow_code" -eq 5 ]; then
            echo "No slow unit tests in PR scope; skipping slow pass." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$slow_code" -ne 0 ]; then
            exit "$slow_code"
          fi
        elif [ "${{ matrix.test-type }}" = "integration" ]; then
          uv run pytest tests/integration -m "integration and not slow" -v --junitxml=junit-${{ matrix.test-type }}.xml
          uv run pytest tests/integration -m "integration and slow" -v --junitxml=junit-${{ matrix.test-type }}-slow.xml
        elif [ "${{ matrix.test-type }}" = "e2e" ]; then
          uv run pytest tests/e2e -m "e2e" -v --junitxml=junit-${{ matrix.test-type }}.xml
        elif [ "${{ matrix.test-type }}" = "property" ]; then
          set +e
          uv run pytest tests/property tests/unit -m property -v --junitxml=junit-${{ matrix.test-type }}.xml
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No property tests collected for this change set; skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
        fi
    - name: Generate test summary
      if: always()
      run: "echo \"## Test Summary: ${{ matrix.test-type }} (Python ${{ matrix.python-version\
        \ }})\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\n\nif [\
        \ -f junit-${{ matrix.test-type }}.xml ]; then\n  # Extract test counts from\
        \ JUnit XML\n  TOTAL=$(grep -oP 'tests=\"\\K[0-9]+' junit-${{ matrix.test-type\
        \ }}.xml | head -1 || echo \"0\")\n  FAILURES=$(grep -oP 'failures=\"\\K[0-9]+'\
        \ junit-${{ matrix.test-type }}.xml | head -1 || echo \"0\")\n  ERRORS=$(grep\
        \ -oP 'errors=\"\\K[0-9]+' junit-${{ matrix.test-type }}.xml | head -1 ||\
        \ echo \"0\")\n  SKIPPED=$(grep -oP 'skipped=\"\\K[0-9]+' junit-${{ matrix.test-type\
        \ }}.xml | head -1 || echo \"0\")\n  PASSED=$((TOTAL - FAILURES - ERRORS -\
        \ SKIPPED))\n\n  echo \"| Metric | Count |\" >> $GITHUB_STEP_SUMMARY\n  echo\
        \ \"|--------|-------|\" >> $GITHUB_STEP_SUMMARY\n  echo \"| Total Tests |\
        \ $TOTAL |\" >> $GITHUB_STEP_SUMMARY\n  echo \"| ✅ Passed | $PASSED |\" >>\
        \ $GITHUB_STEP_SUMMARY\n  echo \"| ❌ Failed | $FAILURES |\" >> $GITHUB_STEP_SUMMARY\n\
        \  echo \"| ⚠️ Errors | $ERRORS |\" >> $GITHUB_STEP_SUMMARY\n  echo \"| ⏭️\
        \ Skipped | $SKIPPED |\" >> $GITHUB_STEP_SUMMARY\n\nfi\n"
    - name: Upload coverage
      if: steps.python-scope.outputs.run == 'true' && matrix.test-type == 'unit'
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457
      with:
        files: ./coverage.xml
        flags: ${{ matrix.test-type }}-python${{ matrix.python-version }}
        name: codecov-${{ matrix.test-type }}-${{ matrix.python-version }}
        fail_ci_if_error: false
    - name: Archive test results
      if: always() && steps.python-scope.outputs.run == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: test-results-${{ matrix.test-type }}-py${{ matrix.python-version }}
        path: '.pytest_cache/

          htmlcov/

          coverage.xml

          junit-*.xml

          '
        retention-days: 30
    timeout-minutes: 30
  test-parallel:
    name: All Tests (Parallel)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tracertm_test
          POSTGRES_USER: tracertm
          POSTGRES_PASSWORD: test_password
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
        - 5432:5432
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout
          5s --health-retries 5
        ports:
        - 6379:6379
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
    - name: Detect changed Python test scope
      id: python-scope
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\"\nchanged=\"$(git diff --name-only \"$base\"...HEAD | grep -Ev\
        \ '^tests/contracts/' || true)\"\nif echo \"$changed\" | grep -Eq '^(src/|tests/|conftest\\\
        .py)'; then\n  echo \"run=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"run=false\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"No Python test-scope changes; skipping all-tests\
        \ matrix.\"\nfi\n"
    - name: Install UV
      if: steps.python-scope.outputs.run == 'true'
      uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06
      with:
        version: latest
    - name: Set up Python
      if: steps.python-scope.outputs.run == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Cache uv dependencies
      if: steps.python-scope.outputs.run == 'true'
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
        restore-keys: '${{ runner.os }}-uv-

          '
    - name: Install dependencies
      if: steps.python-scope.outputs.run == 'true'
      run: uv sync --all-groups
    - name: Run all tests in parallel
      if: steps.python-scope.outputs.run == 'true'
      env:
        DATABASE_URL: postgresql+asyncpg://tracertm:test_password@localhost:5432/tracertm_test
        REDIS_URL: redis://localhost:6379
        PYTHONPATH: ${{ github.workspace }}/src
      shell: bash
      run: |
        set -euo pipefail
        if ! uv run python -c "import tracertm.cli" 2>/dev/null; then
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t targets < <(bash .github/scripts/pr_unit_test_targets.sh "${{ github.event.pull_request.base.sha }}")
            mapfile -t prop_targets < <(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- 'tests/property/**/test_*.py' || true)
            if ((${#prop_targets[@]} > 0)); then
              targets+=("${prop_targets[@]}")
            fi
          else
            targets=(tests/unit tests/property)
          fi
        else
          targets=(tests/)
        fi
        uv run pytest "${targets[@]}" -n auto -v \
          --cov=src/tracertm \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=0 \
          --junitxml=junit-parallel.xml \
          --maxfail=10
    - name: Generate comprehensive test summary
      if: always()
      run: "echo \"## Comprehensive Test Summary (Parallel Execution)\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\n\nif [ -f junit-parallel.xml ]; then\n\
        \  TOTAL=$(grep -oP 'tests=\"\\K[0-9]+' junit-parallel.xml | head -1 || echo\
        \ \"0\")\n  FAILURES=$(grep -oP 'failures=\"\\K[0-9]+' junit-parallel.xml\
        \ | head -1 || echo \"0\")\n  ERRORS=$(grep -oP 'errors=\"\\K[0-9]+' junit-parallel.xml\
        \ | head -1 || echo \"0\")\n  SKIPPED=$(grep -oP 'skipped=\"\\K[0-9]+' junit-parallel.xml\
        \ | head -1 || echo \"0\")\n  PASSED=$((TOTAL - FAILURES - ERRORS - SKIPPED))\n\
        \  TIME=$(grep -oP 'time=\"\\K[0-9.]+' junit-parallel.xml | head -1 || echo\
        \ \"0\")\n\n  echo \"| Metric | Value |\" >> $GITHUB_STEP_SUMMARY\n  echo\
        \ \"|--------|-------|\" >> $GITHUB_STEP_SUMMARY\n  echo \"| Total Tests |\
        \ $TOTAL |\" >> $GITHUB_STEP_SUMMARY\n  echo \"| ✅ Passed | $PASSED |\" >>\
        \ $GITHUB_STEP_SUMMARY\n  echo \"| ❌ Failed | $FAILURES |\" >> $GITHUB_STEP_SUMMARY\n\
        \  echo \"| ⚠️ Errors | $ERRORS |\" >> $GITHUB_STEP_SUMMARY\n  echo \"| ⏭️\
        \ Skipped | $SKIPPED |\" >> $GITHUB_STEP_SUMMARY\n  echo \"| ⏱️ Duration |\
        \ ${TIME}s |\" >> $GITHUB_STEP_SUMMARY\n\n  if [ \"$FAILURES\" -gt 0 ] ||\
        \ [ \"$ERRORS\" -gt 0 ]; then\n    echo \"\" >> $GITHUB_STEP_SUMMARY\n   \
        \ echo \"### Failed Tests\" >> $GITHUB_STEP_SUMMARY\n    echo \"\\`\\`\\`\"\
        \ >> $GITHUB_STEP_SUMMARY\n    grep -A 5 'failure\\|error' junit-parallel.xml\
        \ | head -50 >> $GITHUB_STEP_SUMMARY || true\n    echo \"\\`\\`\\`\" >> $GITHUB_STEP_SUMMARY\n\
        \  fi\nfi\n"
    - name: Upload coverage
      if: steps.python-scope.outputs.run == 'true'
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457
      with:
        files: ./coverage.xml
        flags: parallel-all
        name: codecov-parallel
        fail_ci_if_error: false
    - name: Archive test results
      if: always() && steps.python-scope.outputs.run == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: test-results-parallel-all
        path: '.pytest_cache/

          htmlcov/

          coverage.xml

          junit-parallel.xml

          '
        retention-days: 30
    timeout-minutes: 30
