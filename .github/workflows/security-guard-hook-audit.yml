name: Security Guard (Hooks)
"on":
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
  push:
    branches:
    - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  guard:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Verify private ingress boundary
      run: ./scripts/verify-deployment-security.sh --mode private
    - name: Verify public deployment fails closed without auth
      run: ./scripts/test-deployment-security.sh
    - name: Verify workflow trust boundaries
      run: ./scripts/verify-workflow-security.sh
