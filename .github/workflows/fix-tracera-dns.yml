name: Fix t.tracera TLS - Add Single-Level Subdomain
on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Add tracera.pheno.studio DNS record
        run: |
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          ZONE_ID="bb6b23ca3dd0db9bd764a869b61a5278"
          TUNNEL_ID="e66542c9-fa12-41a1-b8eb-291f95368fba"
          
          echo "=== Adding tracera.pheno.studio CNAME to tunnel ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"CNAME\",\"name\":\"tracera.pheno.studio\",\"content\":\"${TUNNEL_ID}.cfargotunnel.com\",\"proxied\":true}" \
            | jq '{name: .result.name, content: .result.content, proxied: .result.proxied}'
          
          echo ""
          echo "=== Updating tunnel ingress to also serve tracera.pheno.studio ==="
          echo "(ingress is configured locally in config.yml, not via API)"
          
          echo ""
          echo "=== Testing new endpoint ==="
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://tracera.pheno.studio/" 2>/dev/null)
          echo "tracera.pheno.studio: HTTP ${HTTP_CODE}"
          
          HTTP_CODE2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://t.tracera.pheno.studio/" 2>/dev/null)
          echo "t.tracera.pheno.studio: HTTP ${HTTP_CODE2} (expected 000 - TLS fails on nested subdomain)"

      - name: Update config.yml ingress
        run: |
          cat > tunnel-ingress.yml << 'EOF'
          Ingress rules for C:\Users\koosh\.cloudflared\config.yml:
          
          ingress:
            - hostname: tracera.pheno.studio
              service: http://localhost:8080
            - hostname: t.tracera.pheno.studio
              service: http://localhost:8080
            - hostname: api.pheno.studio
              service: http://localhost:3000
            - hostname: trace.pheno.studio
              service: http://localhost:8080
            - hostname: gate.pheno.studio
              service: http://localhost:18000
            - hostname: agileplus-classic.pheno.studio
              service: http://localhost:3002
            - service: http_status:404
          EOF
          cat tunnel-ingress.yml
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### TLS Fix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Root cause:** \`t.tracera.pheno.studio\` is a nested subdomain (2 levels)." >> $GITHUB_STEP_SUMMARY
          echo "Cloudflare Universal SSL only covers \`*.pheno.studio\` (1-level wildcards)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fix:** Added \`tracera.pheno.studio\` (single-level) CNAME to the tunnel." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Use \`https://tracera.pheno.studio\` instead of \`https://t.tracera.pheno.studio\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To use the nested subdomain**, you'd need a custom certificate covering" >> $GITHUB_STEP_SUMMARY
          echo "\`*.tracera.pheno.studio\` (requires Advanced Certificate Manager or upload)." >> $GITHUB_STEP_SUMMARY
