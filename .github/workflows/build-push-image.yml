name: Build & Push tracera-server Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "Dockerfile.rust.slim"
      - ".github/workflows/build-push-image.yml"

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kooshapari/tracera-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rust.slim
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Our slim Dockerfile already pins CARGO_BUILD_JOBS=1; the runner has
          # plenty of RAM so this finishes well before hitting any limit.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure the GHCR package is publicly pullable
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          # GITHUB_TOKEN cannot change package visibility for a user-owned
          # package (this repository is owned by a user, not an org, and both the
          # /user/ and /orgs/ endpoints returned 404 for it). A PAT with package
          # admin can, so use one when it is configured.
          PACKAGE_ADMIN_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          PACKAGE_NAME=tracera-server
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          TAGS_URL="https://ghcr.io/v2/${OWNER_LC}/${PACKAGE_NAME}/tags/list"

          # An anonymous tag listing only succeeds for a public package, so this
          # is both the precondition check and the success check - which makes
          # the step idempotent instead of retrying a no-op PATCH.
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$TAGS_URL")" = "200" ]; then
            echo "${PACKAGE_NAME} is already publicly pullable."
            exit 0
          fi

          if [ -z "${PACKAGE_ADMIN_TOKEN}" ]; then
            echo "::warning title='GHCR package is private'::${PACKAGE_NAME} is not publicly pullable and no GHCR_ADMIN_TOKEN secret is set, so CI cannot change its visibility. A private image also cannot be pulled by Render without a configured registry credential. Flip it once at https://github.com/users/${OWNER}/packages/container/${PACKAGE_NAME}/settings, or add GHCR_ADMIN_TOKEN (a PAT with package admin)."
            exit 0
          fi

          for endpoint in "user" "orgs/${OWNER}"; do
            for attempt in 1 2 3; do
              CODE=$(curl -sS -o /tmp/package-visibility.json -w '%{http_code}' -X PATCH \
                -H "Authorization: Bearer ${PACKAGE_ADMIN_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                "https://api.github.com/${endpoint}/packages/container/${PACKAGE_NAME}" \
                -d '{"visibility":"public"}')
              echo "${endpoint} attempt ${attempt}: HTTP ${CODE}"
              if [ "$CODE" = "200" ]; then
                echo "${PACKAGE_NAME} is now public."
                exit 0
              fi
              sleep 3
            done
          done

          echo "::warning title='Could not flip GHCR visibility'::Set it at https://github.com/users/${OWNER}/packages/container/${PACKAGE_NAME}/settings"
          exit 0

      - name: Exchange GitHub OIDC token for Render JWT (keyless)
        if: github.ref == 'refs/heads/main'
        id: render_oidc
        shell: bash
        run: |
          # Render's OIDC audience is the literal string "render.com"
          AUD="render.com"
          if [ -n "$RENDER_OIDC_AUDIENCE" ]; then
            AUD="$RENDER_OIDC_AUDIENCE"
          fi
          # Mint a GitHub OIDC token bound to the configured audience
          GH_TOKEN_JSON=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "https://api.github.com/oidc-gateway/exchange/audience/${AUD}" 2>/dev/null || true)
          # Fallback: use the GITHUB_TOKEN-style fetch via id-token action
          if [ -z "$GH_TOKEN_JSON" ] || ! echo "$GH_TOKEN_JSON" | grep -q '"value"'; then
            echo "::warning::OIDC gateway exchange not available; falling back to per-run API call"
            GH_TOKEN_JSON=$(curl -sS \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/oidc-custom-token?audience=${AUD}")
          fi
          GH_TOKEN=$(echo "$GH_TOKEN_JSON" | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('value', d.get('token','')))" 2>/dev/null || echo "")
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Failed to obtain GitHub OIDC token; RENDER_API_KEY fallback will be used if set"
            echo "render_oidc_token=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Exchange GitHub OIDC token for a Render-issued short-lived JWT
          RESP=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${GH_TOKEN}\"}" \
            "https://api.render.com/v1/auth/github" 2>/dev/null || true)
          RENDER_JWT=$(echo "$RESP" | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('token',''))" 2>/dev/null || echo "")
          if [ -z "$RENDER_JWT" ]; then
            echo "::warning::Render OIDC exchange returned no JWT — response was: $RESP"
            echo "render_oidc_token=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Mask the token in logs
          echo "::add-mask::$RENDER_JWT"
          echo "render_oidc_token=$RENDER_JWT" >> "$GITHUB_OUTPUT"
          echo "✅ Render OIDC JWT obtained (keyless — no long-lived API key needed)"

      - name: Trigger Render redeploy
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          RENDER_OIDC_TOKEN: ${{ steps.render_oidc.outputs.render_oidc_token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          # Prefer the OIDC-issued short-lived JWT; fall back to legacy API key if set
          if [ -n "$RENDER_OIDC_TOKEN" ]; then
            AUTH_HEADER="Authorization: Bearer ${RENDER_OIDC_TOKEN}"
            AUTH_SOURCE="OIDC"
          elif [ -n "$RENDER_API_KEY" ]; then
            AUTH_HEADER="Authorization: Bearer ${RENDER_API_KEY}"
            AUTH_SOURCE="RENDER_API_KEY (fallback)"
          else
            echo "⏭️  No RENDER_OIDC_TOKEN and no RENDER_API_KEY — skipping deploy trigger"
            exit 0
          fi
          echo "Triggering Render redeploy via ${AUTH_SOURCE}..."
          HTTP_CODE=$(curl -sS -o /tmp/render_resp.json -w "%{http_code}" \
            -X POST \
            -H "$AUTH_HEADER" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")
          echo "Render trigger HTTP ${HTTP_CODE}"
          cat /tmp/render_resp.json | head -c 400
          echo ""
          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Render redeploy triggered (keyless via ${AUTH_SOURCE})"
          else
            echo "⚠️  Render trigger returned HTTP ${HTTP_CODE} (manual deploy may be needed)"
          fi
