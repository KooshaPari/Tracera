name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: frontend/apps/web

      - name: Build frontend
        env:
          VITE_BASE: /Tracera/
          TRACERA_API_BASE: ${{ vars.TRACERA_API_BASE }}
        run: |
          test -n "$TRACERA_API_BASE"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VITE_API_URL="$TRACERA_API_BASE" PRODUCTION_DEPLOY=1 npm run test:api-base
          fi
          VITE_BASE="$VITE_BASE" VITE_API_URL="$TRACERA_API_BASE" bun run vite build
        working-directory: frontend/apps/web

      - name: Verify canonical Tracera artifact
        env:
          EXPECTED_API_ORIGIN: ${{ vars.TRACERA_API_BASE }}
        run: node frontend/scripts/test-deployment-artifact.mjs frontend/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
