name: Deploy Render Backend

# Environment delineation: docs/04-guides/ENVIRONMENTS.md
#
# main deploys the `tracera-server-dev` service; only a v* tag, or an explicit
# workflow_dispatch with environment: prod, deploys the production fallback.

on:
  push:
    branches: [main, ci/infisical-deploys]
    tags: ["v*"]
    paths:
      - "crates/tracera-server/**"
      - "Dockerfile.rust"
      - "render.yaml"
      - ".github/workflows/deploy-render.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: dev
        options: [dev, preview, prod]
      force_deploy:
        description: "Force redeploy even without code changes"
        required: false
        default: "false"
        type: boolean
  workflow_call:
    inputs:
      environment:
        description: "Target environment; empty derives it from the caller's event"
        required: false
        type: string
        default: ""
permissions:
  contents: read
  # Listing the image-build run for this commit uses the Actions runs API, which
  # needs actions:read. Without it `gh run list` fails, the discovery loop finds
  # nothing, and the wait silently no-ops - reinstating the race it exists to fix.
  actions: read
jobs:
  # Single derivation point for the target environment.
  plan:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      env: ${{ steps.derive.outputs.env }}
    steps:
      - id: derive
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            target=preview
          elif [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            # A release tag is always production; an input must not downgrade it.
            target=prod
          elif [ -n "${{ inputs.environment }}" ]; then
            target="${{ inputs.environment }}"
          else
            target=dev
          fi
          case "$target" in
            dev|preview|prod) ;;
            *) echo "::error::unsupported environment '$target'"; exit 1 ;;
          esac
          echo "env=$target" >> "$GITHUB_OUTPUT"
          echo "Target environment: $target"

  deploy:
    name: Deploy to Render
    needs: plan
    runs-on: ubuntu-latest
    # Long enough for the image-build wait (up to ~11 minutes) plus the Render
    # deploy and its health verification.
    timeout-minutes: 30
    environment:
      name: render-${{ needs.plan.outputs.env }}
    env:
      DEPLOY_ENV: ${{ needs.plan.outputs.env }}
      # The repository holds these directly. It also carries an Infisical
      # indirection, but that project contains no Render credentials (see
      # docs/04-guides/ENVIRONMENTS.md), so reading only from it meant every run
      # skipped while still reporting success. Prefer the direct secret and keep
      # Infisical as the fallback for whenever it is the configured source.
      REPO_RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      # Pick the service that matches the target. A single shared id meant a dev
      # deploy would have triggered the production fallback service.
      REPO_RENDER_SERVICE_ID: ${{ needs.plan.outputs.env == 'prod' && vars.RENDER_SERVICE_ID || vars.RENDER_SERVICE_ID_DEV || vars.RENDER_SERVICE_ID }}
      # Testing only vars.RENDER_SERVICE_ID meant a workspace with just the dev
      # service id configured was treated as having no repo credentials and fell
      # back to Infisical, which does not hold the Render key.
      HAS_REPO_CREDS: ${{ secrets.RENDER_API_KEY != '' && (vars.RENDER_SERVICE_ID != '' || vars.RENDER_SERVICE_ID_DEV != '') }}
      INFISICAL_ENV: ${{ needs.plan.outputs.env == 'prod' && 'prod' || 'dev' }}
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for image build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The image workflow is triggered independently, so allow time for
          # GitHub to register its run before deciding that this commit has no
          # image build (for example, a render.yaml-only change).
          BUILD_RUN_ID=""
          for attempt in $(seq 1 6); do
            RUNS=$(gh run list \
              --workflow build-push-image.yml \
              --commit "$GITHUB_SHA" \
              --limit 20 \
              --json databaseId,status,conclusion \
              2>/dev/null || true)
            BUILD_RUN_ID=$(echo "$RUNS" | jq -r '
              sort_by(.databaseId) | last | .databaseId // empty
            ')
            if [ -n "$BUILD_RUN_ID" ]; then
              break
            fi
            echo "No image build run is registered yet for $GITHUB_SHA (discovery attempt $attempt/6)."
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done

          if [ -z "$BUILD_RUN_ID" ]; then
            echo "No image build was triggered for $GITHUB_SHA; continuing without waiting."
            exit 0
          fi

          echo "Waiting for image build run $BUILD_RUN_ID for commit $GITHUB_SHA."
          for attempt in $(seq 1 60); do
            RUN=$(gh run view "$BUILD_RUN_ID" --json status,conclusion)
            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // empty')

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Image build run $BUILD_RUN_ID succeeded; continuing to Render deploy."
                exit 0
              fi
              echo "::error::Image build run $BUILD_RUN_ID concluded with '$CONCLUSION'; refusing to deploy."
              exit 1
            fi

            echo "[$attempt/60] Image build run $BUILD_RUN_ID is $STATUS."
            if [ "$attempt" -lt 60 ]; then
              sleep 10
            fi
          done

          echo "::error::Timed out waiting for image build run $BUILD_RUN_ID after 10 minutes."
          exit 1

      - name: Install Infisical CLI (fallback credential source)
        if: env.HAS_REPO_CREDS != 'true'
        # The Cloudsmith repository this used to point at
        # (dl.cloudsmith.io/public/infisical/infisical-cli) now returns 404, so
        # `curl -f` failed and the job died before it could pull any credential.
        # Infisical moved its package repository to artifacts-cli.infisical.com.
        run: |
          curl -1sLf "https://artifacts-cli.infisical.com/setup.deb.sh" | sudo -E bash
          sudo apt-get install -y infisical

      - name: Resolve Render credentials
        id: pull_creds
        # Prefers the repository's own secret and variable; falls back to
        # Infisical. continue-on-error so a bad credential doesn't abort the
        # workflow before the pre-flight check, which decides whether to deploy
        # or to stop with instructions.
        continue-on-error: true
        run: |
          set +e
          RENDER_API_KEY="$REPO_RENDER_API_KEY"
          RENDER_SERVICE_ID="$REPO_RENDER_SERVICE_ID"

          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Repo secret/variable absent; falling back to Infisical env '$INFISICAL_ENV'."
            RENDER_API_KEY=$(infisical secrets get RENDER_API_KEY \
              --projectId "$INFISICAL_PROJECT_ID" --env "$INFISICAL_ENV" \
              --token "$INFISICAL_TOKEN" --plain)
            RENDER_SERVICE_ID=$(infisical secrets get RENDER_SERVICE_ID \
              --projectId "$INFISICAL_PROJECT_ID" --env "$INFISICAL_ENV" \
              --token "$INFISICAL_TOKEN" --plain)
          fi

          echo "RENDER_API_KEY=$RENDER_API_KEY" >> "$GITHUB_ENV"
          echo "RENDER_SERVICE_ID=$RENDER_SERVICE_ID" >> "$GITHUB_ENV"
          exit 0

      - name: Pre-flight - verify Render credentials
        id: render_scope_check
        continue-on-error: true
        run: |
          set +e
          if [ -z "$RENDER_API_KEY" ]; then
            echo "render_creds_ok=false" >> "$GITHUB_OUTPUT"
            # An error annotation, not a notice: this run did NOT deploy, and a
            # green job that quietly skipped is how the Render path stayed inert
            # without anyone noticing.
            echo "::error title='Render deploy skipped'::RENDER_API_KEY is unavailable from Infisical env '$INFISICAL_ENV' (or INFISICAL_TOKEN was rejected), so this run did not deploy. Fix the credential and re-run."
            echo "::notice::If INFISICAL_TOKEN is set, verify it has 'read' scope on env '$INFISICAL_ENV'."
            echo "::notice::If INFISICAL_TOKEN is a Universal Auth Client ID, see DEPLOY_CREDENTIALS.md."
          elif [[ "$RENDER_API_KEY" != rnd_* ]]; then
            echo "render_creds_ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENDER_API_KEY does not start with 'rnd_' (got prefix '${RENDER_API_KEY:0:4}')."
            echo "::notice::Generate a Render API key at https://dashboard.render.com/api-keys"
          elif [ -z "$RENDER_SERVICE_ID" ]; then
            echo "render_creds_ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENDER_SERVICE_ID missing from Infisical prod env."
            echo "::notice::Connect the Render Blueprint first: https://render.com -> New -> Blueprint"
            echo "::notice::then copy the service ID (srv-XXXX) into Infisical prod as RENDER_SERVICE_ID."
          else
            # Probe the Render API with the key to confirm it actually works
            PROBE=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" 2>/tmp/render_err.txt)
            if [ "$PROBE" = "200" ]; then
              echo "render_creds_ok=true" >> "$GITHUB_OUTPUT"
              echo "Render API key + service ID validated."
            else
              echo "render_creds_ok=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Render API probe returned HTTP $PROBE for service $RENDER_SERVICE_ID."
              echo "::notice::Check that the API key has access to that service in Render Dashboard."
            fi
          fi
          exit 0

      - name: Fail production deployment when Render credentials are unavailable
        if: ${{ needs.plan.outputs.env == 'prod' && steps.render_scope_check.outputs.render_creds_ok != 'true' }}
        run: |
          # Mirrors the Vercel production gate: asking for a production deploy and
          # doing nothing must not look like success. The pre-flight already
          # annotates the specific reason; this step makes the run actually fail so
          # the missing deploy is visible in the checks list instead of only in a
          # notice nobody reads.
          echo "::error title='Render production deploy blocked'::The credential pre-flight did not validate the prod Render service, so this dispatch deployed nothing."
          echo "RENDER_SERVICE_ID was '$RENDER_SERVICE_ID'."
          echo "Confirm that RENDER_API_KEY can read that service (https://api.render.com/v1/services/$RENDER_SERVICE_ID) and that the id names the service currently serving the public hostname."
          exit 1

      - name: Trigger Render deploy
        if: steps.render_scope_check.outputs.render_creds_ok == 'true'
        run: |
          echo "Triggering deploy for service: $RENDER_SERVICE_ID"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clear_cache": false}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            DEPLOY_ID=$(echo "$BODY" | jq -r '.id // "unknown"')
            echo "Deploy triggered: $DEPLOY_ID"
            echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          else
            echo "::error::Render deploy failed (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi

      - name: Wait for deployment
        if: steps.render_scope_check.outputs.render_creds_ok == 'true'
        run: |
          echo "Waiting for deploy to complete..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
            
            case "$STATUS" in
              live)
                echo "Deploy completed successfully"
                break
                ;;
              failed|canceled)
                echo "::error::Deploy status: $STATUS"
                exit 1
                ;;
              *)
                echo "[$i/60] Status: $STATUS"
                sleep 10
                ;;
            esac
          done

      - name: Verify backend health
        if: steps.render_scope_check.outputs.render_creds_ok == 'true'
        continue-on-error: true
        run: |
          set +e
          # Render's public URL is <service-name>.onrender.com, NOT
          # <service-id>.onrender.com. Building it from the id made this poll a
          # host that does not exist, so it reported failure on every deploy
          # while being non-fatal. Ask Render for the real URL instead.
          svc=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID")
          SERVICE_URL=$(echo "$svc" | jq -r '.serviceDetails.url // empty')
          if [ -z "$SERVICE_URL" ]; then
            SERVICE_URL="https://$(echo "$svc" | jq -r '.service.name').onrender.com"
          fi
          echo "Checking $SERVICE_URL/healthz"

          for i in $(seq 1 10); do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$SERVICE_URL/healthz" 2>/dev/null)
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy: $SERVICE_URL/healthz -> 200"
              curl -s "$SERVICE_URL/readyz" | jq . 2>/dev/null || echo "(jq not available)"
              exit 0
            fi
            echo "[$i/10] Waiting... (HTTP $STATUS)"
            sleep 10
          done
          echo "::warning::Backend not yet healthy after 100s (may still be starting)"
          echo "::warning::Skipping verification - this is non-fatal."
          exit 0

      - name: Update Vercel API URL
        if: steps.render_scope_check.outputs.render_creds_ok == 'true' && success()
        continue-on-error: true
        run: |
          # Same correction as the health check: the public host uses the
          # service name, not its id.
          svc=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID")
          RENDER_URL=$(echo "$svc" | jq -r '.serviceDetails.url // empty')
          if [ -z "$RENDER_URL" ]; then
            RENDER_URL="https://$(echo "$svc" | jq -r '.service.name').onrender.com"
          fi
          echo "Backend deployed at: $RENDER_URL"
          echo "Next: Update Vercel env var VITE_API_URL to $RENDER_URL"
          echo "Run: vercel env add VITE_API_URL production --value $RENDER_URL"
          echo "Or set the repo variable: TRACERA_API_BASE = $RENDER_URL"
