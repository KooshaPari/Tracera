name: Deploy Render Backend
on:
  push:
    branches: [main, ci/infisical-deploys]
    paths:
      - "crates/tracera-server/**"
      - "Dockerfile.rust"
      - "render.yaml"
      - ".github/workflows/deploy-render.yml"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force redeploy even without code changes"
        required: false
        default: "false"
        type: boolean
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: render-production
    env:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Infisical CLI
        run: |
          curl -1sLf "https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh" | sudo -E bash
          sudo apt-get install -y infisical

      - name: Pull Render credentials from Infisical
        id: pull_creds
        # Uses service token via INFISICAL_TOKEN. continue-on-error so a bad
        # token doesn't abort the workflow before the pre-flight check.
        # The pre-flight step below reads $RENDER_API_KEY from the env and
        # decides whether to actually deploy or skip with instructions.
        continue-on-error: true
        run: |
          set +e
          RENDER_API_KEY=$(infisical secrets get RENDER_API_KEY \
            --projectId "$INFISICAL_PROJECT_ID" --env prod \
            --token "$INFISICAL_TOKEN" --plain)
          RENDER_SERVICE_ID=$(infisical secrets get RENDER_SERVICE_ID \
            --projectId "$INFISICAL_PROJECT_ID" --env prod \
            --token "$INFISICAL_TOKEN" --plain)
          echo "RENDER_API_KEY=$RENDER_API_KEY" >> $GITHUB_ENV
          echo "RENDER_SERVICE_ID=$RENDER_SERVICE_ID" >> $GITHUB_ENV
          exit 0

      - name: Pre-flight - verify Render credentials
        id: render_scope_check
        continue-on-error: true
        run: |
          set +e
          if [ -z "$RENDER_API_KEY" ]; then
            echo "render_creds_ok=false" >> $GITHUB_OUTPUT
            echo "::notice::RENDER_API_KEY missing from Infisical prod env (or INFISICAL_TOKEN rejected)."
            echo "::notice::If INFISICAL_TOKEN is set, verify it has 'read' scope on env=prod."
            echo "::notice::If INFISICAL_TOKEN is a Universal Auth Client ID, see DEPLOY_CREDENTIALS.md."
          elif [[ "$RENDER_API_KEY" != rnd_* ]]; then
            echo "render_creds_ok=false" >> $GITHUB_OUTPUT
            echo "::notice::RENDER_API_KEY does not start with 'rnd_' (got prefix '${RENDER_API_KEY:0:4}')."
            echo "::notice::Generate a Render API key at https://dashboard.render.com/api-keys"
          elif [ -z "$RENDER_SERVICE_ID" ]; then
            echo "render_creds_ok=false" >> $GITHUB_OUTPUT
            echo "::notice::RENDER_SERVICE_ID missing from Infisical prod env."
            echo "::notice::Connect the Render Blueprint first: https://render.com -> New -> Blueprint"
            echo "::notice::then copy the service ID (srv-XXXX) into Infisical prod as RENDER_SERVICE_ID."
          else
            # Probe the Render API with the key to confirm it actually works
            PROBE=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" 2>/tmp/render_err.txt)
            if [ "$PROBE" = "200" ]; then
              echo "render_creds_ok=true" >> $GITHUB_OUTPUT
              echo "Render API key + service ID validated."
            else
              echo "render_creds_ok=false" >> $GITHUB_OUTPUT
              echo "::notice::Render API probe returned HTTP $PROBE for service $RENDER_SERVICE_ID."
              echo "::notice::Check that the API key has access to that service in Render Dashboard."
            fi
          fi
          exit 0

      - name: Trigger Render deploy
        if: steps.render_scope_check.outputs.render_creds_ok == 'true'
        run: |
          echo "Triggering deploy for service: $RENDER_SERVICE_ID"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clear_cache": false}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            DEPLOY_ID=$(echo "$BODY" | jq -r '.id // "unknown"')
            echo "Deploy triggered: $DEPLOY_ID"
            echo "DEPLOY_ID=$DEPLOY_ID" >> $GITHUB_ENV
          else
            echo "::error::Render deploy failed (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi

      - name: Wait for deployment
        if: steps.render_scope_check.outputs.render_creds_ok == 'true'
        run: |
          echo "Waiting for deploy to complete..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
            
            case "$STATUS" in
              live)
                echo "Deploy completed successfully"
                break
                ;;
              failed|canceled)
                echo "::error::Deploy status: $STATUS"
                exit 1
                ;;
              *)
                echo "[$i/60] Status: $STATUS"
                sleep 10
                ;;
            esac
          done

      - name: Verify backend health
        if: steps.render_scope_check.outputs.render_creds_ok == 'true'
        continue-on-error: true
        run: |
          set +e
          SERVICE_URL="https://${RENDER_SERVICE_ID}.onrender.com"
          echo "Checking $SERVICE_URL/healthz"

          for i in $(seq 1 10); do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$SERVICE_URL/healthz" 2>/dev/null)
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy: $SERVICE_URL/healthz -> 200"
              curl -s "$SERVICE_URL/readyz" | jq . 2>/dev/null || echo "(jq not available)"
              exit 0
            fi
            echo "[$i/10] Waiting... (HTTP $STATUS)"
            sleep 10
          done
          echo "::warning::Backend not yet healthy after 100s (may still be starting)"
          echo "::warning::Skipping verification - this is non-fatal."
          exit 0

      - name: Update Vercel API URL
        if: steps.render_scope_check.outputs.render_creds_ok == 'true' && success()
        continue-on-error: true
        run: |
          RENDER_URL="https://${RENDER_SERVICE_ID}.onrender.com"
          echo "Backend deployed at: $RENDER_URL"
          echo "Next: Update Vercel env var VITE_API_URL to $RENDER_URL"
          echo "Run: vercel env add VITE_API_URL production --value $RENDER_URL"
          echo "Or update Infisical: TRACERA_API_BASE (prod) = $RENDER_URL"
