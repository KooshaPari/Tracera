name: release-crates

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "crates/tracera-server/**"
      - "crates/tracertm-mcp/**"
      - ".github/workflows/release-crates.yml"

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish tracera-server
        run: |
          CRATE_VERSION=$(grep '^version' crates/tracera-server/Cargo.toml | head -1 | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CRATE_VERSION" = "$TAG_VERSION" ]; then
            cargo publish -p tracera-server --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          else
            echo "tracera-server version $CRATE_VERSION does not match release tag $TAG_VERSION" >&2
            exit 1
          fi
      - name: Publish tracertm-mcp
        run: |
          CRATE_VERSION=$(grep '^version' crates/tracertm-mcp/Cargo.toml | head -1 | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CRATE_VERSION" = "$TAG_VERSION" ]; then
            cargo publish -p tracertm-mcp --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          else
            echo "tracertm-mcp version $CRATE_VERSION does not match release tag $TAG_VERSION" >&2
            exit 1
          fi

  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dry-run tracera-server
        working-directory: crates/tracera-server
        run: cargo publish --dry-run
      - name: Dry-run tracertm-mcp
        working-directory: crates/tracertm-mcp
        run: cargo publish --dry-run
