name: release-crates

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "crates/tracera-server/**"
      - "crates/tracertm-mcp/**"
      - ".github/workflows/release-crates.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable toolchain action
        with:
          toolchain: stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Run strict workspace clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Validate publish packages
        run: |
          cargo publish --dry-run --locked -p tracera-server
          cargo publish --dry-run --locked -p tracertm-mcp

  publish:
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable toolchain action
        with:
          toolchain: stable
      - name: Publish tracera-server
        run: |
          CRATE_VERSION=$(grep '^version' crates/tracera-server/Cargo.toml | head -1 | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CRATE_VERSION" = "$TAG_VERSION" ]; then
            cargo publish --locked -p tracera-server --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          else
            echo "tracera-server version $CRATE_VERSION does not match release tag $TAG_VERSION" >&2
            exit 1
          fi
      - name: Publish tracertm-mcp
        run: |
          CRATE_VERSION=$(grep '^version' crates/tracertm-mcp/Cargo.toml | head -1 | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CRATE_VERSION" = "$TAG_VERSION" ]; then
            cargo publish --locked -p tracertm-mcp --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          else
            echo "tracertm-mcp version $CRATE_VERSION does not match release tag $TAG_VERSION" >&2
            exit 1
          fi

  dry-run:
    if: github.event_name == 'pull_request'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable toolchain action
        with:
          toolchain: stable
      - name: Dry-run tracera-server
        working-directory: crates/tracera-server
        run: cargo publish --dry-run --locked
      - name: Dry-run tracertm-mcp
        working-directory: crates/tracertm-mcp
        run: cargo publish --dry-run --locked
