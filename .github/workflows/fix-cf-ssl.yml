name: Fix CF SSL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check account-level SSL certs and try to fix
        run: |
          set -euo pipefail
          ZONE_ID="bb6b23ca3dd0db9bd764a869b61a5278"
          
          echo "=== Account-level custom certificates ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/custom_certificates?zone_id=$ZONE_ID" | python3 -m json.tool || true
          
          echo ""
          echo "=== SSL Universal via account endpoint ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/certificates?zone_id=$ZONE_ID" | python3 -m json.tool || true
          
          echo ""
          echo "=== Edge certificates for zone ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/ssl/tls13" | python3 -m json.tool || true
          
          echo ""
          echo "=== Always Use HTTPS setting ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/always_use_https" | python3 -m json.tool || true
          
          echo ""
          echo "=== Min TLS version ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/min_tls_version" | python3 -m json.tool || true
          
          echo ""
          echo "=== Enable Universal SSL (may already be active) ==="
          curl -s -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"value":"enabled"}' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/ssl/universal_certificates" | python3 -m json.tool || true
          
          echo ""
          echo "=== Test HTTPS connectivity to t.tracera.pheno.studio ==="
          curl -sI https://t.tracera.pheno.studio/ 2>&1 | head -20 || echo "HTTPS connection failed"
          
          echo ""
          echo "=== Test HTTP connectivity ==="
          curl -sI http://t.tracera.pheno.studio/ 2>&1 | head -20 || echo "HTTP connection failed"
