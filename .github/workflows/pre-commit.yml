name: Pre-commit Hooks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Install pre-commit
      run: python -m pip install pre-commit==4.2.0==4.2.0
    - name: Run pre-commit
      shell: bash
      env:
        SKIP: loc-guard,routes-entrypoints,security-guard-pre-commit-pre-push
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\"\npre-commit run --show-diff-on-failure --color=always --from-ref\
        \ \"$base\" --to-ref HEAD\n"
    - name: Upload pre-commit results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pre-commit-results
        path: '.pre-commit-cache/

          .ruff_cache/'
    timeout-minutes: 30
