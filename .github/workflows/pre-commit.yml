name: Pre-commit Hooks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48 # v-latest
      with:
        python-version: '3.13'
    - name: Install pre-commit
      run: python -m pip install pre-commit
    - name: Run pre-commit
      shell: bash
      env:
        SKIP: loc-guard,routes-entrypoints,security-guard-pre-commit-pre-push,oxlint-frontend,oxfmt-frontend,oxlint-desktop,vitest-changed
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\"\npre-commit run --show-diff-on-failure --color=always --from-ref\
        \ \"$base\" --to-ref HEAD\n"
    - name: Upload pre-commit results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pre-commit-results
        path: '.pre-commit-cache/

          .ruff_cache/'
    timeout-minutes: 30
