name: Pre-commit Hooks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit
        shell: bash
        env:
          SKIP: loc-guard,routes-entrypoints,security-guard-pre-commit-pre-push
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before }}" ]]; then
            base="${{ github.event.before }}"
          else
            base="HEAD~1"
          fi
          git fetch --no-tags --depth=1 origin "$base"
          pre-commit run --show-diff-on-failure --color=always --from-ref "$base" --to-ref HEAD

      - name: Upload pre-commit results
        if: always()
        uses: actions/upload-artifact@v4@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pre-commit-results
          path: |
            .pre-commit-cache/
            .ruff_cache/