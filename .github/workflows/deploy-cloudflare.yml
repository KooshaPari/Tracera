name: Deploy Cloudflare Worker (tracera-edge)
on:
  push:
    branches: [main, ci/infisical-deploys]
    paths:
      - "crates/tracera-edge/**"
      - ".github/workflows/deploy-cloudflare.yml"
      - "wrangler.toml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: production
        type: choice
        options: [production, staging]
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment || 'cloudflare-production' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set in repository secrets"
          echo "Set via: gh secret set CLOUDFLARE_API_TOKEN / gh secret set CLOUDFLARE_ACCOUNT_ID"
          exit 1

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install worker-build
        run: cargo install -q worker-build

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/tracera-edge/target
          key: cf-worker-${{ runner.os }}-${{ hashFiles('crates/tracera-edge/Cargo.toml') }}

      - name: Resolve KV namespace (create if missing)
        run: |
          # Try to read existing namespace binding from vars; otherwise create it.
          if [ -z "${{ vars.CF_KV_ID }}" ]; then
            OUT=$(npx wrangler kv namespace create TRACERA_KV 2>/dev/null || true)
            KV_ID=$(echo "$OUT" | grep -oE '"id": "[a-z0-9]+"' | head -1 | cut -d'"' -f4)
            echo "Created KV namespace id=$KV_ID"
            echo "KV_ID=$KV_ID" >> $GITHUB_ENV
          else
            echo "Using existing KV id from repo vars"
            echo "KV_ID=${{ vars.CF_KV_ID }}" >> $GITHUB_ENV
          fi

      - name: Build WASM worker
        working-directory: crates/tracera-edge
        run: worker-build --release

      - name: Generate wrangler.toml with resolved IDs
        run: |
          sed "s/placeholder-kv-id/$KV_ID/g; s/placeholder-kv-preview-id/$KV_ID/g" wrangler.toml > wrangler.deploy.toml

      - name: Deploy to Cloudflare
        run: |
          npx wrangler deploy \
            --config wrangler.deploy.toml \
            --compatibility-date 2025-04-01 \
            --minify

      - name: Verify deployment
        run: |
          sleep 10
          BASE="${CF_ZONE:-tracera-edge.workers.dev}"
          curl -sf "https://$BASE/healthz" || echo "::warning::Worker health check failed (may take time to propagate)"

      - name: Create R2 bucket (idempotent)
        run: |
          npx wrangler r2 bucket create tracera-artifacts 2>/dev/null || echo "R2 bucket already exists"
