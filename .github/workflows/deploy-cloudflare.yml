name: Deploy Cloudflare Worker (tracera-edge)

# Environment delineation: docs/04-guides/ENVIRONMENTS.md
#
# main deploys the `dev` worker (tracera-edge-dev); only a v* tag, or an explicit
# workflow_dispatch with environment: prod, deploys the production worker.

on:
  push:
    branches: [main, ci/infisical-deploys]
    tags: ["v*"]
    paths:
      - "crates/tracera-edge/**"
      - ".github/workflows/deploy-cloudflare.yml"
      - "wrangler.toml"
  # Without this the preview branch in the plan step below was unreachable, so
  # cloudflare-preview could never be produced despite ENVIRONMENTS.md describing
  # it. Fork PRs simply have no credentials and are skipped by the guard.
  pull_request:
    branches: [main]
    paths:
      - "crates/tracera-edge/**"
      - ".github/workflows/deploy-cloudflare.yml"
      - "wrangler.toml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: dev
        options: [dev, preview, prod]
  workflow_call:
    inputs:
      environment:
        description: "Target environment; empty derives it from the caller's event"
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  # Single derivation point for the target environment, shared by the job that
  # needs it for its GitHub environment name and for the wrangler --env flag.
  plan:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      env: ${{ steps.derive.outputs.env }}
    steps:
      - id: derive
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            target=preview
          elif [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            # A release tag is always production; an input must not downgrade it.
            target=prod
          elif [ -n "${{ inputs.environment }}" ]; then
            target="${{ inputs.environment }}"
          else
            target=dev
          fi
          case "$target" in
            dev|preview|prod) ;;
            *) echo "::error::unsupported environment '$target'"; exit 1 ;;
          esac
          echo "env=$target" >> "$GITHUB_OUTPUT"
          echo "Target environment: $target"

  deploy:
    name: Deploy to Cloudflare Workers
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-${{ needs.plan.outputs.env }}
    env:
      DEPLOY_ENV: ${{ needs.plan.outputs.env }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Pre-flight - verify CF token is set
        id: cf_creds_set
        # Continue-on-error so an empty token doesn't abort before the
        # KV probe (which is the real scope check below).
        continue-on-error: true
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cf_creds_ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set in repo secrets."
            exit 0
          fi
          echo "cf_creds_ok=pending" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install worker-build
        run: cargo install -q worker-build

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/tracera-edge/target
          key: cf-worker-${{ runner.os }}-${{ hashFiles('crates/tracera-edge/Cargo.toml') }}

      - name: Verify CF token can deploy (PUT to workers scripts endpoint)
        id: cf_scope_check
        continue-on-error: true
        env:
          CF_API_BASE: https://api.cloudflare.com/client/v4
        run: |
          set +e
          # Test the actual deploy path: PUT to the workers scripts endpoint.
          # PUT requires Account.Workers Scripts:Edit (the permission we need).
          # Zone-scoped tokens return 403/401; Account-scoped tokens return 400
          # (bad metadata since we send a fake script). 400 = permission OK, just
          # bad payload. 200/202 = actually deployed. 401/403 = no permission.
          HTTP_CODE=$(curl -sS -o /tmp/cf_probe.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/javascript" \
            --data "addEventListener('fetch',e=>e.respondWith(new Response('',{status:200})))" \
            "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/__tracera_probe__")
          echo "Probe status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "cf_creds_ok=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare token can deploy workers (HTTP $HTTP_CODE)."
            # Clean up the probe script
            curl -sS -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/__tracera_probe__" 2>/dev/null
          elif [ "$HTTP_CODE" = "400" ]; then
            # 400 = token has permission, but request body was rejected.
            # This is still a valid Account-scoped token.
            echo "cf_creds_ok=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare token has Account-scope (400 = permission OK, bad probe payload)."
          else
            echo "cf_creds_ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare token lacks Account.Workers Scripts:Edit (HTTP $HTTP_CODE on worker PUT)."
            echo "::notice::To enable CF deploys, create a token at https://dash.cloudflare.com/profile/api-tokens"
            echo "::notice::using the 'Edit Cloudflare Workers' template (Account scope):"
            echo "::notice::  Account -> Workers Scripts: Edit"
            echo "::notice::  Account -> Workers KV Storage: Edit"
            echo "::notice::  Account -> Workers R2 Storage: Edit"
            echo "::notice::  Account -> Account Settings: Read"
            echo "::notice::Then set it as the CLOUDFLARE_API_TOKEN repo secret."
          fi
          exit 0
      - name: Resolve KV namespace (create if missing)
        if: steps.cf_scope_check.outputs.cf_creds_ok == 'true'
        # First try the repo var (manually set after first create). If absent,
        # list existing namespaces and pick the one named TRACERA_KV; only create
        # if none exists. This avoids wrangler's interactive prompts and works
        # with the free Workers tier.
        env:
          CF_API_BASE: https://api.cloudflare.com/client/v4
        run: |
          set -e
          if [ -n "${{ vars.CF_KV_ID }}" ]; then
            echo "Using CF_KV_ID from repo vars"
            echo "KV_ID=${{ vars.CF_KV_ID }}" >> "$GITHUB_ENV"
            exit 0
          fi
          # List existing KV namespaces via REST API
          EXISTING=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((n['id'] for n in d.get('result',[]) if n.get('title')=='TRACERA_KV'),''))" 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Found existing TRACERA_KV namespace id=$EXISTING"
            echo "KV_ID=$EXISTING" >> "$GITHUB_ENV"
            echo "Set CF_KV_ID=$EXISTING as a repo var to skip future list calls."
            exit 0
          fi
          # Create via REST API (non-interactive)
          CREATED=$(curl -sf -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"title":"TRACERA_KV"}' \
            "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('result',{}).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$CREATED" ]; then
            echo "::error::Failed to resolve or create TRACERA_KV namespace"
            exit 1
          fi
          echo "Created TRACERA_KV namespace id=$CREATED"
          echo "Set CF_KV_ID=$CREATED as a repo var to skip future create calls."
          echo "KV_ID=$CREATED" >> "$GITHUB_ENV"

      - name: Build WASM worker
        if: steps.cf_scope_check.outputs.cf_creds_ok == 'true'
        working-directory: crates/tracera-edge
        run: worker-build --release

      - name: Generate wrangler.toml with resolved IDs
        if: steps.cf_scope_check.outputs.cf_creds_ok == 'true'
        run: |
          sed "s/placeholder-kv-id/$KV_ID/g; s/placeholder-kv-preview-id/$KV_ID/g" wrangler.toml > wrangler.deploy.toml

      - name: Deploy to Cloudflare
        if: steps.cf_scope_check.outputs.cf_creds_ok == 'true'
        # No continue-on-error here: a real deploy failure must surface as a
        # red CI run, not a silent skip. The pre-flight probe above is the
        # only place that may exit gracefully on missing scope.
        run: |
          set -euo pipefail
          # Production is the top-level worker (tracera-edge). dev and preview
          # deploy their own named workers from the [env.*] blocks in
          # wrangler.toml, so a main-branch deploy cannot overwrite production.
          if [ "$DEPLOY_ENV" = "prod" ]; then
            env_flag=""
          else
            env_flag="--env $DEPLOY_ENV"
          fi
          # shellcheck disable=SC2086  # deliberate word splitting: empty or --env <name>
          npx wrangler deploy $env_flag \
            --config wrangler.deploy.toml \
            --compatibility-date 2025-04-01 \
            --minify

      - name: Verify deployment
        if: steps.cf_scope_check.outputs.cf_creds_ok == 'true'
        continue-on-error: true
        run: |
          set +e
          sleep 10
          BASE="${CF_ZONE:-tracera-edge.workers.dev}"
          # dev and preview publish their own worker names, so probe that one.
          if [ "$DEPLOY_ENV" != "prod" ]; then
            BASE="tracera-edge-$DEPLOY_ENV.workers.dev"
          fi
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "https://$BASE/healthz" 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Worker health check passed: $BASE/healthz -> 200"
          else
            echo "::warning::Worker health check returned $STATUS (may take time to propagate)"
          fi
          exit 0

      - name: Create R2 bucket (idempotent)
        if: steps.cf_scope_check.outputs.cf_creds_ok == 'true'
        continue-on-error: true
        run: |
          set +e
          npx wrangler r2 bucket create tracera-artifacts 2>&1 || echo "R2 bucket already exists (or create failed)"
          exit 0
