name: Deploy Cloudflare Worker (tracera-edge)
on:
  push:
    branches: [main, ci/infisical-deploys]
    paths:
      - "crates/tracera-edge/**"
      - ".github/workflows/deploy-cloudflare.yml"
      - "wrangler.toml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: production
        type: choice
        options: [production, staging]
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment || 'cloudflare-production' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Pre-flight - verify CF token is set
        id: cf_creds_set
        # Continue-on-error so an empty token doesn't abort before the
        # KV probe (which is the real scope check below).
        continue-on-error: true
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cf_creds_ok=false" >> $GITHUB_OUTPUT
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set in repo secrets."
            exit 0
          fi
          echo "cf_creds_ok=pending" >> $GITHUB_OUTPUT
          exit 0

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install worker-build
        run: cargo install -q worker-build

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/tracera-edge/target
          key: cf-worker-${{ runner.os }}-${{ hashFiles('crates/tracera-edge/Cargo.toml') }}

      - name: Pre-flight - verify token has Account-scoped permissions
        id: cf_scope_check
        continue-on-error: true
        env:
          CF_API_BASE: https://api.cloudflare.com/client/v4
        run: |
          set +e
          STATUS=$(curl -sS -o /tmp/cf_resp.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "${CF_API_BASE}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" 2>/tmp/cf_err.txt)
          echo "Probe status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "cf_creds_ok=true" >> $GITHUB_OUTPUT
            echo "Cloudflare token has Account-scoped KV Storage permissions."
          else
            echo "cf_creds_ok=false" >> $GITHUB_OUTPUT
            echo "::notice::Cloudflare token lacks Account-scoped permissions (HTTP $STATUS)."
            echo "::notice::To enable CF deploys, create a token at https://dash.cloudflare.com/profile/api-tokens"
            echo "::notice::using the 'Edit Cloudflare Workers' template with:"
            echo "::notice::  Account -> Workers Scripts: Edit"
            echo "::notice::  Account -> Workers KV Storage: Edit"
            echo "::notice::  Account -> Workers R2 Storage: Edit"
            echo "::notice::  Account -> Account Settings: Read"
            echo "::notice::Then set it as the CLOUDFLARE_API_TOKEN repo secret."
          fi
          exit 0

      - name: Resolve KV namespace (create if missing)
        if: steps.cf_scope_check.outputs.cf_creds_ok == 'true'
        # First try the repo var (manually set after first create). If absent,
        # list existing namespaces and pick the one named TRACERA_KV; only create
        # if none exists. This avoids wrangler's interactive prompts and works
        # with the free Workers tier.
        env:
          CF_API_BASE: https://api.cloudflare.com/client/v4
        run: |
          set -e
          if [ -n "${{ vars.CF_KV_ID }}" ]; then
            echo "Using CF_KV_ID from repo vars"
            echo "KV_ID=${{ vars.CF_KV_ID }}" >> $GITHUB_ENV
            exit 0
          fi
          # List existing KV namespaces via REST API
          EXISTING=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((n['id'] for n in d.get('result',[]) if n.get('title')=='TRACERA_KV'),''))" 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Found existing TRACERA_KV namespace id=$EXISTING"
            echo "KV_ID=$EXISTING" >> $GITHUB_ENV
            echo "Set CF_KV_ID=$EXISTING as a repo var to skip future list calls."
            exit 0
          fi
          # Create via REST API (non-interactive)
          CREATED=$(curl -sf -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"title":"TRACERA_KV"}' \
            "$CF_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('result',{}).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$CREATED" ]; then
            echo "::error::Failed to resolve or create TRACERA_KV namespace"
            exit 1
          fi
          echo "Created TRACERA_KV namespace id=$CREATED"
          echo "Set CF_KV_ID=$CREATED as a repo var to skip future create calls."
          echo "KV_ID=$CREATED" >> $GITHUB_ENV

      - name: Build WASM worker
        if: steps.cf_scope_check.outputs.cf_creds_ok == 'true'
        working-directory: crates/tracera-edge
        run: worker-build --release

      - name: Generate wrangler.toml with resolved IDs
        if: steps.cf_scope_check.outputs.cf_creds_ok == 'true'
        run: |
          sed "s/placeholder-kv-id/$KV_ID/g; s/placeholder-kv-preview-id/$KV_ID/g" wrangler.toml > wrangler.deploy.toml

      - name: Deploy to Cloudflare
        if: steps.cf_scope_check.outputs.cf_creds_ok == 'true'
        run: |
          npx wrangler deploy \
            --config wrangler.deploy.toml \
            --compatibility-date 2025-04-01 \
            --minify

      - name: Verify deployment
        run: |
          sleep 10
          BASE="${CF_ZONE:-tracera-edge.workers.dev}"
          curl -sf "https://$BASE/healthz" || echo "::warning::Worker health check failed (may take time to propagate)"

      - name: Create R2 bucket (idempotent)
        run: |
          npx wrangler r2 bucket create tracera-artifacts 2>/dev/null || echo "R2 bucket already exists"
