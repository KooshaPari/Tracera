name: Test Pyramid Verification
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  pyramid-verification:
    name: Verify Test Pyramid Structure
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
    - name: Set up Go
      uses: actions/setup-go@78961f6f84d799cd858575bb931c3e51d3b13290 # v-latest
      with:
        go-version: 1.25.7
    - name: Set up Node.js
      uses: actions/setup-node@0355742c943ddb13ca8a6b700f824231caa91e75 # v-latest
      with:
        node-version: '20'
    - name: Set up Python
      uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48 # v-latest
      with:
        python-version: '3.13'
    - name: Run test pyramid verification
      id: pyramid
      run: 'bash backend/scripts/verify-test-pyramid.sh > /tmp/pyramid-output.txt
        2>&1

        EXIT_CODE=$?

        cat /tmp/pyramid-output.txt

        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

        exit $EXIT_CODE

        '
    - name: Generate pyramid summary for PR
      if: always()
      run: 'echo "## Test Pyramid Verification" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        bash backend/scripts/verify-test-pyramid.sh >> $GITHUB_STEP_SUMMARY 2>&1 ||
        true

        '
    - name: Comment on PR with results
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v-latest
      with:
        script: "const fs = require('fs');\nconst output = fs.readFileSync('/tmp/pyramid-output.txt',\
          \ 'utf8');\n\nawait github.rest.issues.createComment({\n  issue_number:\
          \ context.issue.number,\n  owner: context.repo.owner,\n  repo: context.repo.repo,\n\
          \  body: '## Test Pyramid Verification\\n\\n```\\n' + output + '\\n```'\n\
          });\n"
    - name: Fail if pyramid violated
      if: failure()
      run: 'echo "❌ Test pyramid constraints violated!"

        echo "Required: unit >= 70%, E2E <= 10%"

        exit 1

        '
    timeout-minutes: 20
