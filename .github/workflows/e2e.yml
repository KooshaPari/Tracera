name: e2e
on:
  push:
    branches: [main]
    paths:
      - "crates/tracera-server/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "crates/tracera-server/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Live deploy URL to test against (blank = build+run locally)"
        required: false
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The server refuses to boot when DATABASE_URL is unset. Use the in-memory
      # SQLite store so this job needs no external database service. db::connect_sqlite
      # pins the pool to a single connection for ":memory:" URLs, so the migrated
      # schema is shared by every query.
      DATABASE_URL: "sqlite::memory:"
      # This job exercises the API only and never builds the frontend bundle, so the
      # server must treat a missing frontend/dist/index.html as API-only instead of
      # exiting fatally at startup.
      TRACERA_ALLOW_MISSING_FRONTEND: "1"
      TRACERA_BIND_ADDR: "127.0.0.1:8080"
      RUST_LOG: tracera_server=info
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve target (local build or live URL)
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          set -euo pipefail
          if [ -n "${TARGET_URL}" ]; then
            echo "BASE=${TARGET_URL}" >> "$GITHUB_ENV"
          else
            cargo build --locked --release -p tracera-server
            ./target/release/tracera-server >/tmp/tracera-e2e.log 2>&1 &
            SRV=$!
            echo "SRV_PID=${SRV}" >> "$GITHUB_ENV"
            BASE="http://127.0.0.1:8080"
            ready=0
            for _ in $(seq 1 150); do
              if ! kill -0 "${SRV}" 2>/dev/null; then
                echo "::error::tracera-server exited during startup"
                cat /tmp/tracera-e2e.log
                exit 1
              fi
              if curl --silent --fail "${BASE}/health" >/dev/null; then
                ready=1
                break
              fi
              sleep 0.2
            done
            if [ "${ready}" -ne 1 ]; then
              echo "::error::tracera-server did not become healthy"
              cat /tmp/tracera-e2e.log
              exit 1
            fi
            echo "BASE=${BASE}" >> "$GITHUB_ENV"
          fi
      - name: E2E endpoint contracts
        run: |
          set -euo pipefail
          if [ -n "${SRV_PID:-}" ]; then
            trap 'kill "${SRV_PID}" 2>/dev/null || true' EXIT
          fi

          health="$(curl -fsS "${BASE}/health")"
          grep -q '"status":"ok"' <<<"${health}"

          ready="$(curl -fsS "${BASE}/ready")"
          grep -q '"status":"ready"' <<<"${ready}"

          # State-mutating routes sit behind the CSRF middleware: they require the
          # canonical browser origin and a token issued by this same process.
          csrf="$(curl -fsS "${BASE}/api/v1/csrf-token")"
          CSRF_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<<"${csrf}")"
          if [ -z "${CSRF_TOKEN}" ]; then
            echo "::error::could not obtain a CSRF token from ${BASE}/api/v1/csrf-token"
            exit 1
          fi

          coverage="$(curl -fsS -X POST "${BASE}/api/v1/coverage-matrix" \
            -H "Origin: http://127.0.0.1:18000" \
            -H "x-csrf-token: ${CSRF_TOKEN}" \
            -H "content-type: application/json" \
            -d '{"links":[{"source_id":"FR-1","target_id":"T-1","relationship":"verifies","confidence":0.95}]}')"
          grep -q '"covered"' <<<"${coverage}"

          spec="$(curl -fsS -X POST "${BASE}/api/v1/governance/spec-check" \
            -H "Origin: http://127.0.0.1:18000" \
            -H "x-csrf-token: ${CSRF_TOKEN}" \
            -H "content-type: application/json" \
            -d '{"specs":[{"spec_id":"S1","status":"draft"}]}')"
          grep -q '"not_approved"' <<<"${spec}"

          echo "E2E PASS"
