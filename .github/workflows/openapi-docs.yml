name: Generate OpenAPI Documentation
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
    - main
    - develop
    paths:
    - backend/**/*.go
    - backend/main.go
    - backend/internal/handlers/**
    - .github/workflows/openapi-docs.yml
  pull_request:
    branches:
    - main
    - develop
    paths:
    - backend/**/*.go
    - backend/main.go
    - backend/internal/handlers/**
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  generate-and-validate:
    name: Generate and Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: '1.23'
        cache: true
        cache-dependency-path: backend/go.sum
    - name: Install swag
      run: go install github.com/swaggo/swag/cmd/swag@latest
    - name: Install validation tools
      run: 'npm install -g @apidevtools/swagger-cli

        npm install -g @stoplight/spectral-cli

        '
    - name: Verify swag installation
      run: swag --version
    - name: Generate OpenAPI documentation
      working-directory: backend
      run: "swag init \\\n  --generalInfo main.go \\\n  --dir ./ \\\n  --output ./docs\
        \ \\\n  --parseDependency \\\n  --parseInternal \\\n  --parseDepth 2 \\\n\
        \  --instanceName \"tracertm\"\n"
    - name: Validate generated spec
      working-directory: backend
      run: '# Validate with swagger-cli

        swagger-cli validate docs/tracertm_swagger.json


        # Lint with spectral

        spectral lint docs/tracertm_swagger.json --format stylish --fail-severity
        warn || true

        '
    - name: Check for required fields
      working-directory: backend
      run: "# Check that all endpoints have tags\nmissing_tags=$(jq '[.paths[][].tags]\
        \ | map(select(. == null or length == 0)) | length' docs/tracertm_swagger.json)\n\
        if [ \"$missing_tags\" -gt 0 ]; then\n  echo \"Warning: $missing_tags endpoints\
        \ are missing tags\"\nfi\n\n# Check that all endpoints have descriptions\n\
        missing_desc=$(jq '[.paths[][].description] | map(select(. == null or . ==\
        \ \"\")) | length' docs/tracertm_swagger.json)\nif [ \"$missing_desc\" -gt\
        \ 0 ]; then\n  echo \"Warning: $missing_desc endpoints are missing descriptions\"\
        \nfi\n"
    - name: Generate coverage report
      working-directory: backend
      run: 'echo "# OpenAPI Documentation Coverage" > ../openapi-coverage.md

        echo "" >> ../openapi-coverage.md

        echo "## Statistics" >> ../openapi-coverage.md

        echo "" >> ../openapi-coverage.md

        echo "- **Total Paths**: $(jq ''.paths | length'' docs/tracertm_swagger.json)"
        >> ../openapi-coverage.md

        echo "- **GET Endpoints**: $(jq ''[.paths[].get] | map(select(. != null))
        | length'' docs/tracertm_swagger.json)" >> ../openapi-coverage.md

        echo "- **POST Endpoints**: $(jq ''[.paths[].post] | map(select(. != null))
        | length'' docs/tracertm_swagger.json)" >> ../openapi-coverage.md

        echo "- **PUT Endpoints**: $(jq ''[.paths[].put] | map(select(. != null))
        | length'' docs/tracertm_swagger.json)" >> ../openapi-coverage.md

        echo "- **DELETE Endpoints**: $(jq ''[.paths[].delete] | map(select(. != null))
        | length'' docs/tracertm_swagger.json)" >> ../openapi-coverage.md

        echo "- **Tags**: $(jq ''[.tags[]?.name] | length'' docs/tracertm_swagger.json)"
        >> ../openapi-coverage.md

        echo "- **Schemas**: $(jq ''[.components.schemas | keys[]] | length'' docs/tracertm_swagger.json
        2>/dev/null || echo 0)" >> ../openapi-coverage.md

        '
    - name: Upload OpenAPI spec as artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: openapi-spec
        path: 'backend/docs/tracertm_swagger.json

          backend/docs/tracertm_swagger.yaml

          openapi-coverage.md

          '
        retention-days: 30
    - name: Comment PR with stats
      if: github.event_name == 'pull_request'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: "const fs = require('fs');\nconst coverage = fs.readFileSync('openapi-coverage.md',\
          \ 'utf8');\n\ngithub.rest.issues.createComment({\n  issue_number: context.issue.number,\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  body: coverage\n\
          });\n"
    timeout-minutes: 30
  deploy-to-docs-site:
    name: Deploy to Docs Site
    runs-on: ubuntu-latest
    needs: generate-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: main
        persist-credentials: true
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Download OpenAPI spec
      uses: actions/download-artifact@v4
      with:
        name: openapi-spec
        path: .
    - name: Create docs-site directory if needed
      run: mkdir -p docs/public
    - name: Copy spec to docs-site
      run: 'cp backend/docs/tracertm_swagger.json docs/public/openapi.json

        cp backend/docs/tracertm_swagger.yaml docs/public/openapi.yaml

        '
    - name: Commit and push if changed
      run: "git config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\
        git add docs/public/openapi.json docs/public/openapi.yaml\nif [ -n \"$(git\
        \ status --porcelain docs/public/openapi.json docs/public/openapi.yaml)\"\
        \ ]; then\n  git commit -m \"chore(openapi): regenerate spec artifact [skip\
        \ ci]\"\n  git push origin HEAD:main\nelse\n  echo \"No OpenAPI spec changes\
        \ to commit.\"\nfi\n"
    timeout-minutes: 30
  generate-clients:
    name: Generate Client SDKs
    runs-on: ubuntu-latest
    needs: generate-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        language:
        - typescript-fetch
        - python
        - go
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Download OpenAPI spec
      uses: actions/download-artifact@v4
      with:
        name: openapi-spec
        path: .
    - name: Install OpenAPI Generator
      run: npm install -g @openapitools/openapi-generator-cli
    - name: Generate ${{ matrix.language }} client
      run: "openapi-generator-cli generate \\\n  -i backend/docs/tracertm_swagger.json\
        \ \\\n  -g ${{ matrix.language }} \\\n  -o clients/${{ matrix.language }}\
        \ \\\n  --additional-properties=packageName=tracertm-client\n"
    - name: Upload client as artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: client-${{ matrix.language }}
        path: clients/${{ matrix.language }}
        retention-days: 30
    timeout-minutes: 30
