name: VitePress Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/vitepress-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trace-vitepress-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4@11bd71901bbe5b1630ceea73d27597364c9af683@v4

      - name: Setup Node
        uses: actions/setup-node@v4@8f152de45cc393bb48ce5d89d36b731f54556e65
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package.json

      - name: Setup Pages
        uses: actions/configure-pages@v5@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: true

      - name: Install docs dependencies
        working-directory: docs
        run: npm install

      - name: Build VitePress site
        working-directory: docs
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
