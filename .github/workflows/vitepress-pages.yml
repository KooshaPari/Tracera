name: VitePress Pages
on:
  push:
    branches:
    - main
    paths:
    - docs/**
    - .github/workflows/vitepress-pages.yml
  workflow_dispatch: null
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: trace-vitepress-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
    - name: Setup Node
      uses: actions/setup-node@0355742c943ddb13ca8a6b700f824231caa91e75 # v-latest
      with:
        node-version: '20'
    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      with:
        enablement: true
    - name: Install docs dependencies
      working-directory: docs
      run: npm install
    - name: Build VitePress site
      working-directory: docs
      run: npm run docs:build
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # v-latest
      with:
        path: docs/.vitepress/dist
    timeout-minutes: 30
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
    timeout-minutes: 30
