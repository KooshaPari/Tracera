name: Architecture Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install UV
        uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check architecture
        run: uv run --extra dev tach check

      - name: Generate architecture diagram
        run: uv run --extra dev tach show --mermaid > architecture.md

      - name: Upload architecture diagram
        uses: actions/upload-artifact@v4@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-diagram
          path: architecture.md

      - name: Comment architecture on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const diagram = fs.readFileSync('architecture.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Architecture Diagram\n\n' + diagram
            });
