name: Architecture Check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
    - name: Install UV
      uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06
      with:
        version: latest
    - name: Set up Python
      uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48 # v-latest
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Check architecture
      run: uv run --extra dev tach check
    - name: Generate architecture diagram
      run: uv run --extra dev tach show --mermaid > architecture.md
    - name: Upload architecture diagram
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: architecture-diagram
        path: architecture.md
    - name: Comment architecture on PR
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v-latest
      with:
        script: "const fs = require('fs');\nconst diagram = fs.readFileSync('architecture.md',\
          \ 'utf8');\ngithub.rest.issues.createComment({\n  issue_number: context.issue.number,\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  body: '## Architecture\
          \ Diagram\\n\\n' + diagram\n});\n"
    timeout-minutes: 30
