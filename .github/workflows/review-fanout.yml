name: Review Fanout

# Proactive PR review: triggered on every PR open/synchronize, dispatches to
# the smart-provider queue (CodeRabbit -> Copilot -> Cursor -> Forge) with
# health-aware fallback. Requires the review-surface service to be reachable
# (set REVIEW_SURFACE_URL to its deployed endpoint). When the variable is unset
# or its URL is not reachable from the runner, the dispatch step is skipped
# with a ::warning:: instead of failing on unresolvable DNS.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "PR number (when triggered manually)"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

concurrency:
  group: review-fanout-${{ github.event.pull_request.number || github.event.inputs.pull_request_number }}
  cancel-in-progress: true

env:
  REVIEW_SURFACE_URL: ${{ vars.REVIEW_SURFACE_URL || 'https://review.phenotype.internal' }}
  REVIEW_SURFACE_TOKEN: ${{ secrets.REVIEW_SURFACE_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  enqueue:
    name: Dispatch to smart queue
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Build fanout payload
        id: payload
        env:
          EVENT: ${{ toJson(github.event) }}
        run: |
          cat > /tmp/payload.json <<'EOF'
          {"event": "pull_request",
           "action": "${{ github.event.action }}",
           "pull_request": ${{ toJson(github.event.pull_request) }},
           "repository": ${{ toJson(github.event.repository) }}
          }
          EOF
          echo "payload_file=/tmp/payload.json" >> "$GITHUB_OUTPUT"

      - name: Gate dispatch on a reachable surface
        id: gate
        env:
          # RAW repository variable, before the `|| fallback` in the env block:
          # single-sources the fallback (it lives only there) and keeps this
          # empty-check live whenever the variable is unset.
          REVIEW_URL: ${{ vars.REVIEW_SURFACE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${REVIEW_URL:-}" ]; then
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Review fanout dispatch skipped: REVIEW_SURFACE_URL repository variable is not configured, so the smart queue is inactive. Set it to a reachable endpoint to enable dispatch."
            exit 0
          fi
          # Probe the actual property (reachability) instead of string-matching
          # URL spellings: any HTTP response (2xx/3xx/4xx/5xx) means the host
          # answers and dispatch may proceed; 000 means DNS/connect/TLS/timeout
          # failed, so dispatching would only reproduce the URLError failure.
          http_code=$(curl -sI --max-time 5 -o /dev/null -w '%{http_code}' "$REVIEW_URL" 2>/dev/null || true)
          if [ "$http_code" != "000" ]; then
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Review fanout dispatch skipped: REVIEW_SURFACE_URL ($REVIEW_URL) is set but unreachable from this runner; no dispatch was attempted. Fix the repository variable to enable the smart queue."
          fi

      - name: Dispatch via smart queue
        id: dispatch
        if: steps.gate.outputs.should_dispatch == 'true'
        env:
          REVIEW_URL: ${{ env.REVIEW_SURFACE_URL }}
          REVIEW_TOKEN: ${{ env.REVIEW_SURFACE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pull_request_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - "$REVIEW_URL" "$REVIEW_TOKEN" "$PR_NUMBER" "$REPO" <<'PY'
          import os, sys, json, urllib.request, urllib.error

          url, token, pr_number, repo = sys.argv[1:5]
          endpoint = f"{url.rstrip('/')}/api/dispatch"
          payload = {
              "provider_priority": ["coderabbit", "copilot", "cursor", "forge"],
              "pr_key": f"{repo}#{pr_number}",
              "action": "opened",
          }
          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {token}" if token else "",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = json.loads(r.read())
                  print(f"DISPATCH_OK: provider={body.get('chosen_provider')} reason={body.get('reason')}")
                  sys.exit(0)
          except urllib.error.HTTPError as e:
              print(f"DISPATCH_HTTP_ERROR: {e.code} {e.reason}")
              # 429 means dispatcher fell back but exhausted — surface as warning, not fail
              if e.code == 429:
                  print("Rate limit exhausted across all providers; skipping proactively.")
                  sys.exit(0)
              sys.exit(1)
          except Exception as e:
              print(f"DISPATCH_FAIL: {type(e).__name__}: {e}")
              sys.exit(1)
          PY

      - name: Annotate with provider used
        if: steps.dispatch.outcome == 'success' && env.REVIEW_SURFACE_URL != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const body = `🤖 Review dispatched via smart queue.\n\n- Trigger: \`${{ github.event.action }}\`\n- PR: #${{ github.event.pull_request.number || github.event.inputs.pull_request_number }}\n- HEAD: \`${pr.head?.sha?.slice(0, 7) ?? 'manual'}\`\n\n> Provider priority at dispatch: coderabbit → copilot → cursor → forge. Rate-limited providers automatically cooldown for 5 min.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
