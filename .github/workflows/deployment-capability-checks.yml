name: Deployment capability checks

on:
  push:
    paths:
      - 'deploy/kubernetes/**'
      - 'scripts/test-deployment-capability-report.sh'
      - '.github/workflows/deployment-capability-checks.yml'
  pull_request:
    paths:
      - 'deploy/kubernetes/**'
      - 'scripts/test-deployment-capability-report.sh'
      - '.github/workflows/deployment-capability-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run read-only capability report (JSON contract)
        run: ./scripts/test-deployment-capability-report.sh

      - name: Verify deployment manifests
        run: ./scripts/verify-deployment-manifests.sh

      - name: Upload capability evidence
        run: ./deploy/kubernetes/capability-report.sh --json | tee deployment-capability.json

      - name: Publish capability evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-capability
          path: deployment-capability.json
