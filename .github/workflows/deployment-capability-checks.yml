name: Deployment capability checks

on:
  push:
    paths:
      - 'deploy/kubernetes/**'
      - 'scripts/test-deployment-capability-report.sh'
      - 'frontend/scripts/validate-capability-manifest.mjs'
      - 'deploy/oracle-isolated/**'
      - 'scripts/validate-oracle-compose.py'
      - 'scripts/test-oracle-routing-policy.sh'
      - 'scripts/test-local-compose-contract.sh'
      - 'docs/sessions/20260722-rich-dashboard-recovery/capability-manifest.json'
      - '.github/workflows/deployment-capability-checks.yml'
  pull_request:
    paths:
      - 'deploy/kubernetes/**'
      - 'scripts/test-deployment-capability-report.sh'
      - 'frontend/scripts/validate-capability-manifest.mjs'
      - 'deploy/oracle-isolated/**'
      - 'scripts/validate-oracle-compose.py'
      - 'scripts/test-oracle-routing-policy.sh'
      - 'scripts/test-local-compose-contract.sh'
      - 'docs/sessions/20260722-rich-dashboard-recovery/capability-manifest.json'
      - '.github/workflows/deployment-capability-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install manifest scanner
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Validate rich dashboard capability manifest
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'

      - name: Run rich capability manifest validator
        run: bun frontend/scripts/validate-capability-manifest.mjs

      - name: Run read-only capability report (JSON contract)
        run: ./scripts/test-deployment-capability-report.sh

      - name: Verify deployment manifests
        run: ./scripts/verify-deployment-manifests.sh

      - name: Validate isolated oracle safety overlay
        run: >-
          python3 scripts/validate-oracle-compose.py .
          --project-root .
          --compose deploy/oracle-isolated/docker-compose.override.yml
          --nginx-config deploy/oracle-isolated/nginx.conf
          --http-only
          --require-internal-network

      - name: Verify fail-closed oracle routing policy
        run: ./scripts/test-oracle-routing-policy.sh

      - name: Verify authoritative local Compose readiness contract
        run: ./scripts/test-local-compose-contract.sh

      - name: Upload capability evidence
        run: ./deploy/kubernetes/capability-report.sh --json | tee deployment-capability.json

      - name: Publish capability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-capability
          path: deployment-capability.json
