name: Fix SSL for t.tracera
on:
  workflow_dispatch: {}

jobs:
  fix-ssl:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and fix SSL
        run: |
          set +e
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          ZONE_ID="bb6b23ca3dd0db9bd764a869b61a5278"
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          
          echo "=== Custom certificates ==="
          CERTS=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/custom_certificates" \
            -H "Authorization: Bearer $TOKEN")
          echo "$CERTS" | jq '.result // [] | length' | xargs -I{} echo "Count: {}"
          
          echo ""
          echo "=== SSL/TLS mode ==="
          TLS_MODE=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/settings/tls" \
            -H "Authorization: Bearer $TOKEN")
          echo "$TLS_MODE" | jq -r '.result.value // "unknown"'
          
          echo ""
          echo "=== Setting TLS to full (strict) ==="
          curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/settings/tls" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"value":"full_strict"}' | jq -r '.result.value // .errors[0].message'
          
          echo ""
          echo "=== Enabling Always Use HTTPS ==="
          curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/settings/always_use_https" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"value":"on"}' | jq -r '.result.value // .errors[0].message'
          
          echo ""
          echo "=== Purging cache ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | jq -r '.success'
          
          echo ""
          echo "=== Testing endpoints ==="
          sleep 5
          for HOST in t.tracera.pheno.studio gate.pheno.studio trace.pheno.studio; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://${HOST}/" 2>/dev/null)
            echo "${HOST}: HTTP ${HTTP_CODE}"
          done

      - name: Summary
        run: |
          echo "### SSL Fix Applied" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- TLS mode set to full (strict)" >> $GITHUB_STEP_SUMMARY
          echo "- Always Use HTTPS enabled" >> $GITHUB_STEP_SUMMARY
          echo "- Cache purged" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If t.tracera still fails TLS, the issue may be at Cloudflare edge" >> $GITHUB_STEP_SUMMARY
          echo "and requires waiting for certificate propagation (5-15 min)." >> $GITHUB_STEP_SUMMARY
