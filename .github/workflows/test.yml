name: Test Suite
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
permissions:
  contents: read
  actions: read
jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      cli: ${{ steps.filter.outputs.cli }}
      frontend: ${{ steps.filter.outputs.frontend }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
    - id: filter
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\" || true\nchanged=\"$(git diff --name-only \"$base\"...HEAD ||\
        \ true)\"\n\nif echo \"$changed\" | grep -Eq '^(backend/|go\\.mod$|go\\.sum$)';\
        \ then\n  echo \"backend=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"backend=false\"\
        \ >> \"$GITHUB_OUTPUT\"\nfi\n\nif echo \"$changed\" | grep -Eq '^(cli/)';\
        \ then\n  echo \"cli=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"cli=false\"\
        \ >> \"$GITHUB_OUTPUT\"\nfi\n\nif echo \"$changed\" | grep -Eq '^(frontend/|package\\\
        .json$|bun\\.lockb?$)'; then\n  echo \"frontend=true\" >> \"$GITHUB_OUTPUT\"\
        \nelse\n  echo \"frontend=false\" >> \"$GITHUB_OUTPUT\"\nfi\n\nif echo \"\
        $changed\" | grep -Eq '^(backend/|frontend/|docker-compose.*\\.yml$)'; then\n\
        \  echo \"integration=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"integration=false\"\
        \ >> \"$GITHUB_OUTPUT\"\nfi\n"
    timeout-minutes: 30
  backend-tests:
    name: Backend Tests (Go)
    needs:
    - changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: 1.25.7
    - name: Install dependencies
      run: 'cd backend

        go mod download

        '
    - name: Run tests
      run: 'cd backend/tests

        go test -v -race -coverprofile=coverage.out ./...

        '
    - name: Generate coverage report
      run: 'cd backend/tests

        go tool cover -html=coverage.out -o coverage.html

        '
    - name: Upload coverage
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
      with:
        files: ./backend/tests/coverage.out
        flags: backend
        name: backend-coverage
    timeout-minutes: 30
  cli-tests:
    name: CLI Tests (Python)
    runs-on: ubuntu-latest
    needs:
    - changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      matrix:
        python-version:
        - '3.13'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Check CLI package exists
      id: cli
      shell: bash
      run: "if [ -f cli/pyproject.toml ]; then\n  echo \"exists=true\" >> \"$GITHUB_OUTPUT\"\
        \nelse\n  echo \"exists=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"No cli/ package\
        \ found; skipping CLI tests.\"\nfi\n"
    - name: Set up Python ${{ matrix.python-version }}
      if: steps.cli.outputs.exists == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      if: steps.cli.outputs.exists == 'true'
      run: 'cd cli

        python -m pip install --upgrade pip==25.0

        pip install -e ".[dev]"

        '
    - name: Run tests
      if: steps.cli.outputs.exists == 'true'
      run: 'cd cli

        pytest

        '
    - name: Upload coverage
      if: steps.cli.outputs.exists == 'true'
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
      with:
        files: ./cli/coverage.xml
        flags: cli
        name: cli-coverage-${{ matrix.python-version }}
    timeout-minutes: 30
  frontend-tests:
    name: Frontend Tests (TypeScript)
    needs:
    - changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Set up Bun
      uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
      with:
        bun-version: 1.2.5
    - name: Install dependencies
      working-directory: frontend
      run: bun install --frozen-lockfile
    - name: Run tests
      working-directory: frontend/apps/web
      run: bun run test
    - name: Upload coverage
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
      with:
        files: ./frontend/apps/web/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage
    timeout-minutes: 30
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs:
    - changes
    - backend-tests
    - frontend-tests
    if: always() && needs.changes.outputs.integration == 'true' && needs.backend-tests.result
      != 'failure' && needs.frontend-tests.result != 'failure'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Start services
      run: 'docker-compose up -d

        sleep 10

        '
    - name: Run integration tests
      run: '# Add integration test commands here

        echo "Integration tests would run here"

        '
    - name: Stop services
      if: always()
      run: docker-compose down
    timeout-minutes: 30

