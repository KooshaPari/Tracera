name: Fix t.tracera SSL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Diagnose and fix t.tracera SSL
        run: |
          set -euo pipefail
          ZONE_ID="bb6b23ca3dd0db9bd764a869b61a5278"
          
          echo "=== List all tunnels ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" | python3 -m json.tool
          
          echo ""
          echo "=== Current t.tracera DNS ==="
          DNS_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=t.tracera.pheno.studio" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")
          echo "DNS record ID: $DNS_ID"
          
          echo ""
          echo "=== Check if local tunnel 6daf5b3d has t.tracera ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/6daf5b3d-127e-43a7-8af1-67559de3aa60" | python3 -c "
          import sys,json
          d = json.load(sys.stdin)
          if d.get('success'):
            t = d['result']
            print(f'Tunnel: {t[\"name\"]}')
            print(f'ID: {t[\"id\"]}')
            print(f'Status: {t.get(\"status\",\"unknown\")}')
            print(f'Created: {t.get(\"created_at\",\"?\")}')
          else:
            print(f'Error: {d}')
          "
          
          echo ""
          echo "=== Check tunnel config for 6daf5b3d ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/6daf5b3d-127e-43a7-8af1-67559de3aa60/configurations" | python3 -m json.tool || true
          
          echo ""
          echo "=== Add t.tracera.pheno.studio to tunnel ingress ==="
          # Update the tunnel configuration to include t.tracera
          curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{
              "config": {
                "ingress": [
                  {"hostname": "api.pheno.studio", "service": "http://localhost:3000"},
                  {"hostname": "trace.pheno.studio", "service": "http://localhost:8080"},
                  {"hostname": "agileplus-classic.pheno.studio", "service": "http://localhost:3002"},
                  {"hostname": "t.tracera.pheno.studio", "service": "http://localhost:8080"},
                  {"service": "http_status:404"}
                ]
              }
            }' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/6daf5b3d-127e-43a7-8af1-67559de3aa60/configurations" | python3 -m json.tool
          
          echo ""
          echo "=== Update DNS: point t.tracera to working tunnel ==="
          curl -s -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"type":"CNAME","name":"t.tracera","content":"6daf5b3d-127e-43a7-8af1-67559de3aa60.cfargotunnel.com","proxied":true}' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$DNS_ID" | python3 -m json.tool
          
          echo ""
          echo "=== Verify HTTPS after fix (wait 10s for propagation) ==="
          sleep 10
          curl -sI --connect-timeout 15 https://t.tracera.pheno.studio/ 2>&1 | head -10 || echo "HTTPS still failing"
          
          echo ""
          echo "=== Verify HTTP ==="
          curl -sI --connect-timeout 10 http://t.tracera.pheno.studio/ 2>&1 | head -10 || echo "HTTP failing"
