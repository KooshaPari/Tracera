name: CI/CD Pipeline
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
true:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
    - id: filter
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelse\n \
        \ base=\"${{ github.event.before }}\"\nfi\nchanged=\"$(git diff --name-only\
        \ \"$base\"...HEAD || true)\"\ncode_changed=\"$(echo \"$changed\" | grep -Ev\
        \ '^(tests/contracts/|frontend/apps/web/vitest\\.contract\\.config\\.ts$|backend/)'\
        \ || true)\"\nif echo \"$code_changed\" | grep -Eq '^(src/|tests/|frontend/|Dockerfile|docker-compose)';\
        \ then\n  echo \"code=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"code=false\"\
        \ >> \"$GITHUB_OUTPUT\"\nfi\n"
    timeout-minutes: 60
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tracertm_test
          POSTGRES_USER: tracertm
          POSTGRES_PASSWORD: tracertm_password
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
        - 5432:5432
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip==25.0

        pip install uv==0.6.14

        uv sync --all-groups

        '
    - name: Run tests
      env:
        DATABASE_URL: postgresql://tracertm:tracertm_password@localhost:5432/tracertm_test
      run: 'uv run pytest tests/ -v --cov=src/tracertm --cov-report=xml

        '
    - name: Upload coverage
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457
      with:
        files: ./coverage.xml
    timeout-minutes: 60
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip==25.0

        pip install uv==0.6.14

        uv sync --all-groups

        '
    - name: Ruff format check
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\"\nmapfile -t python_files < <(git diff --name-only \"$base\"...HEAD\
        \ -- '*.py')\nif (( ${#python_files[@]} == 0 )); then\n  echo \"No changed\
        \ Python files to format-check\"\n  exit 0\nfi\nuv run ruff format --check\
        \ \"${python_files[@]}\"\n"
    - name: Ruff lint
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\"\nmapfile -t python_files < <(git diff --name-only \"$base\"...HEAD\
        \ -- '*.py')\nif (( ${#python_files[@]} == 0 )); then\n  echo \"No changed\
        \ Python files to lint\"\n  exit 0\nfi\nuv run ruff check \"${python_files[@]}\"\
        \ --output-format=grouped\n"
    - name: Type check (ty)
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\"\nif ! git diff --name-only \"$base\"...HEAD -- 'src/**/*.py' |\
        \ grep -q .; then\n  echo \"No changed Python source files to type-check\"\
        \n  exit 0\nfi\nuv run ty check src/ --error-on-warning\n"
    timeout-minutes: 60
  build:
    needs:
    - test
    - lint
    if: needs.test.result == 'success' && needs.lint.result == 'success'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55
    - name: Build Docker image
      uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9
      with:
        context: .
        push: false
        tags: tracertm:latest
    timeout-minutes: 60
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Deploy to production
      run: 'echo "Deploying to production..."

        # Add deployment commands here'
    timeout-minutes: 60
