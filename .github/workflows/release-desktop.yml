name: Release Tracera Desktop

# Builds cross-platform installers for the Tracera Electrobun desktop app.
# Triggered on v* tags (release) or manual dispatch (test build).
#
# Output per platform:
#   - macOS:   tracera-desktop-<ver>-macos-<arch>.zip  (zipped .app bundle)
#   - Windows: tracera-desktop-<ver>-windows-<arch>.zip
#   - Linux:   tracera-desktop-<ver>-linux-<arch>.tar.gz
#
# Code signing: not configured — produces unsigned binaries. Personal
# installation works without signing; distribution requires notarization
# (out of scope for v0.1).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin the Apple runner; macos-latest may switch to a beta Xcode and
          # produce proc-macro dylibs with LINKEDIT layouts rejected by dyld.
          - os: macos-14
            platform: macos
            arch: arm64
            artifact_subdir: dev-macos-arm64
            package_ext: app
            archive_format: zip
          - os: windows-latest
            platform: windows
            arch: x64
            artifact_subdir: dev-windows-x64
            package_ext: exe
            archive_format: zip
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact_subdir: dev-linux-x64
            package_ext: AppImage
            archive_format: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Record Apple toolchain
        if: startsWith(matrix.os, 'macos-')
        run: xcodebuild -version

      - name: Install dependencies
        working-directory: frontend/apps/desktop
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify packaged CLI, compose, and manifest inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f crates/tracera-cli/Cargo.toml
          test -f docker-compose.yml
          test -f frontend/scripts/release-manifest.mjs
          test -f frontend/scripts/verify-release-manifest.mjs
          test "$(node -p "require('./frontend/apps/desktop/package.json').name")" = "tracera-desktop"

      - name: Build native CLI for desktop bundle
        run: cargo build --locked --release -p tracera-cli

      - name: Build with Electrobun
        working-directory: frontend/apps/desktop
        run: bun run build

      - name: Locate built artifact
        id: locate
        working-directory: frontend/apps/desktop
        shell: bash
        run: |
          set -e
          case "${{ matrix.platform }}:${{ matrix.arch }}:${{ matrix.package_ext }}:${{ matrix.archive_format }}:${{ matrix.artifact_subdir }}" in
            macos:arm64:app:zip:dev-macos-arm64|windows:x64:exe:zip:dev-windows-x64|linux:x64:AppImage:tar.gz:dev-linux-x64) ;;
            *) echo "::error::Unsupported desktop packaging tuple"; exit 1 ;;
          esac
          SUB="${{ matrix.artifact_subdir }}"
          EXT="${{ matrix.package_ext }}"
          if [ "$EXT" = "app" ]; then
            ARTIFACT="build/${SUB}/Tracera.app"
            if [ ! -d "$ARTIFACT" ]; then
              ARTIFACT="build/${SUB}/Tracera-dev.app"
            fi
          else
            ARTIFACT=$(find "build/${SUB}" -maxdepth 2 -type f -name "*.${EXT}" | head -1)
          fi
          if [ -z "$ARTIFACT" ] || [ ! -e "$ARTIFACT" ]; then
            echo "::error::Built artifact not found (looked for build/${SUB}/Tracera-dev.${EXT})"
            ls -la "build/${SUB}/" || true
            exit 1
          fi
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "Built artifact: ${ARTIFACT}"

      - name: Archive artifact
        id: archive
        working-directory: frontend/apps/desktop
        shell: bash
        run: |
          set -e
          ARTIFACT="${{ steps.locate.outputs.artifact }}"
          FMT="${{ matrix.archive_format }}"
          APP_NAME=$(node -p "require('./package.json').name")
          APP_VERSION=$(node -p "require('./package.json').version")
          OUT="${APP_NAME}-${APP_VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.${FMT}"
          case "$FMT" in
            zip)
              if [ -d "$ARTIFACT" ]; then
                (cd "$(dirname "$ARTIFACT")" && zip -r "$OLDPWD/$OUT" "$(basename "$ARTIFACT")")
              else
                zip "$OUT" "$ARTIFACT"
              fi
              ;;
            tar.gz)
              tar -czf "$OUT" -C "$(dirname "$ARTIFACT")" "$(basename "$ARTIFACT")"
              ;;
          esac
          echo "Archived to: ${OUT}"
          ls -la "${OUT}"
          echo "archive=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Attest desktop artifact provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: frontend/apps/desktop/${{ steps.archive.outputs.archive }}

      - name: Generate and verify release manifest
        shell: bash
        env:
          TRACERA_RELEASE_ARTIFACTS: frontend/apps/desktop/${{ steps.archive.outputs.archive }}
          SOURCE_DATE_EPOCH: '0'
        run: |
          set -euo pipefail
          node frontend/scripts/release-manifest.mjs release-manifest.json
          node frontend/scripts/verify-release-manifest.mjs release-manifest.json
          test -s release-manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracera-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            frontend/apps/desktop/tracera-desktop-*-${{ matrix.platform }}-${{ matrix.arch }}.{{ matrix.archive_format }}
            release-manifest.json
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/*/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
