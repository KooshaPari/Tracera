name: Release Tracera Desktop

# Builds cross-platform installers for the Tracera Electrobun desktop app.
# Triggered on v* tags (release) or manual dispatch (test build).
#
# Output per platform. Each archive contains the app bundle (a .app on macOS,
# an unpacked directory on Windows and Linux) with the built SPA and the native
# `tracera` CLI embedded under Resources/tracera-bundle/ by
# frontend/apps/desktop/scripts/postbundle.ts:
#   - macOS:   tracera-desktop-<ver>-macos-<arch>.zip  (zipped .app bundle)
#   - Windows: tracera-desktop-<ver>-windows-<arch>.zip
#   - Linux:   tracera-desktop-<ver>-linux-<arch>.tar.gz
#
# Code signing: not configured — produces unsigned binaries. Personal
# installation works without signing; distribution requires notarization
# (out of scope for v0.1).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin the Apple runner; macos-latest may switch to a beta Xcode and
          # produce proc-macro dylibs with LINKEDIT layouts rejected by dyld.
          #
          # artifact_subdir mirrors electrobun's own output naming:
          # dev-macos-<arch>, dev-win-<arch>, dev-linux-<arch> (note "win", not
          # "windows"). app_dir/app_dir_alt name the produced bundle: a .app on
          # macOS, an unpacked directory on Windows and Linux.
          - os: macos-14
            platform: macos
            arch: arm64
            artifact_subdir: dev-macos-arm64
            app_dir: Tracera.app
            app_dir_alt: Tracera-dev.app
            archive_format: zip
          - os: windows-latest
            platform: windows
            arch: x64
            artifact_subdir: dev-win-x64
            app_dir: Tracera-dev
            app_dir_alt: Tracera
            archive_format: zip
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact_subdir: dev-linux-x64
            app_dir: Tracera-dev
            app_dir_alt: Tracera
            archive_format: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Record Apple toolchain
        if: startsWith(matrix.os, 'macos-')
        run: xcodebuild -version

      - name: Install dependencies
        working-directory: frontend/apps/desktop
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify packaged CLI, compose, and manifest inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f crates/tracera-cli/Cargo.toml
          test -f docker-compose.yml
          test -f frontend/scripts/release-manifest.mjs
          test -f frontend/scripts/verify-release-manifest.mjs
          test "$(node -p "require('./frontend/apps/desktop/package.json').name")" = "tracera-desktop"

      - name: Build native CLI for desktop bundle
        run: cargo build --locked --release -p tracera-cli

      - name: Build web bundle
        # The desktop shell embeds the built SPA. scripts/postbundle.ts copies
        # frontend/dist into the .app and exits non-zero when it is absent
        # ("frontend build missing at .../frontend/dist; run the web build
        # first"). The web workspace builds into exactly that path
        # (apps/web/vite.config.mjs sets outDir: "../../dist"), but no step ran
        # it, so every platform's postbundle failed on every tag.
        working-directory: frontend
        run: bun run build

      - name: Build with Electrobun
        working-directory: frontend/apps/desktop
        run: bun run build

      - name: Locate built artifact
        id: locate
        working-directory: frontend/apps/desktop
        shell: bash
        run: |
          set -e
          SUB="${{ matrix.artifact_subdir }}"
          # macOS gets a .app bundle; Windows and Linux get an unpacked directory.
          # Both are directories, so this only ever looks for directories - the
          # previous file glob for *.exe/*.AppImage never matched anything on
          # Windows or Linux, where electrobun produces a directory instead.
          ARTIFACT=""
          for name in "${{ matrix.app_dir }}" "${{ matrix.app_dir_alt }}"; do
            if [ -d "build/${SUB}/${name}" ]; then
              ARTIFACT="build/${SUB}/${name}"
              break
            fi
          done
          if [ -z "$ARTIFACT" ]; then
            echo "::error::Built artifact not found under build/${SUB} (looked for ${{ matrix.app_dir }} or ${{ matrix.app_dir_alt }})"
            ls -la "build/${SUB}/" || true
            exit 1
          fi
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "Built artifact: ${ARTIFACT}"

      - name: Archive artifact
        id: archive
        working-directory: frontend/apps/desktop
        shell: bash
        run: |
          set -e
          ARTIFACT="${{ steps.locate.outputs.artifact }}"
          FMT="${{ matrix.archive_format }}"
          APP_NAME=$(node -p "require('./package.json').name")
          APP_VERSION=$(node -p "require('./package.json').version")
          OUT="${APP_NAME}-${APP_VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.${FMT}"
          OUT_ABS="$(pwd)/${OUT}"
          rm -f "$OUT"
          BASE="$(basename "$ARTIFACT")"
          DIR="$(dirname "$ARTIFACT")"
          case "$FMT" in
            zip)
              # macOS ships zip(1); the Git-for-Windows bash that runs this step
              # on windows-latest does not, but the runner image has 7-Zip,
              # which also writes standards-compliant (forward-slash) entries.
              if command -v zip >/dev/null 2>&1; then
                (cd "$DIR" && zip -qr "$OUT_ABS" "$BASE")
              else
                SEVENZ="/c/Program Files/7-Zip/7z.exe"
                if [ ! -x "$SEVENZ" ]; then
                  echo "::error::neither zip(1) nor 7-Zip ($SEVENZ) is available to archive the bundle"
                  exit 1
                fi
                (cd "$DIR" && "$SEVENZ" a -tzip -mx1 "$OUT_ABS" "$BASE" > /dev/null)
              fi
              ;;
            tar.gz)
              tar -czf "$OUT" -C "$DIR" "$BASE"
              ;;
          esac
          echo "Archived to: ${OUT}"
          ls -la "${OUT}"
          echo "archive=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Attest desktop artifact provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: frontend/apps/desktop/${{ steps.archive.outputs.archive }}

      - name: Generate and verify release manifest
        shell: bash
        env:
          TRACERA_RELEASE_ARTIFACTS: frontend/apps/desktop/${{ steps.archive.outputs.archive }}
          SOURCE_DATE_EPOCH: '0'
        run: |
          set -euo pipefail
          node frontend/scripts/release-manifest.mjs release-manifest.json
          node frontend/scripts/verify-release-manifest.mjs release-manifest.json
          test -s release-manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracera-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            frontend/apps/desktop/tracera-desktop-*-${{ matrix.platform }}-${{ matrix.arch }}.{{ matrix.archive_format }}
            release-manifest.json
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/*/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
