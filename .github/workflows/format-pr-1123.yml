name: Format PR 1123 once

on:
  push:
    branches:
      - fix/access-tunnel-qualification-20261013

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/access-tunnel-qualification-20261013
          fetch-depth: 0

      - name: Install exact formatter
        run: npm install --global --ignore-scripts prettier@3.6.2

      - name: Format exact allowlist
        run: |
          set -euo pipefail
          files=(
            DEPLOYMENT_CHECKLIST.md
            DEPLOY_CREDENTIALS.md
            Taskfile.yml
            deploy/selfhost/docker-compose.selfhost.yml
            docs/04-guides/ENVIRONMENTS.md
            docs/ARCHITECTURE.md
            docs/CONTRIBUTING.md
            lefthook.yml
          )
          prettier --write "${files[@]}"

          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Already formatted."
            exit 0
          fi

          for f in "${changed[@]}"; do
            allowed=0
            for candidate in "${files[@]}"; do
              if [ "$f" = "$candidate" ]; then
                allowed=1
                break
              fi
            done
            if [ "$allowed" -ne 1 ]; then
              echo "::error::formatter changed unexpected path: $f"
              git diff -- "$f"
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style: apply Prettier 3.6.2 to ingress repair files"
          git push origin HEAD:fix/access-tunnel-qualification-20261013
