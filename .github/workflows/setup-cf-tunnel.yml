name: Setup CF Tunnel
on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: List existing tunnels
        run: |
          echo "=== Existing tunnels ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/cfd_tunnel" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq '.result[] | {id, name, created_at}'

      - name: Create new tunnel
        id: create
        run: |
          TUNNEL_SECRET=$(openssl rand -base64 32)
          RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/cfd_tunnel" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"tracera-local\", \"tunnel_secret\": \"${TUNNEL_SECRET}\"}")
          
          echo "$RESPONSE" | jq .
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Failed to create tunnel"
            exit 1
          fi
          
          TUNNEL_ID=$(echo "$RESPONSE" | jq -r '.result.id')
          echo "tunnel_id=$TUNNEL_ID" >> $GITHUB_OUTPUT
          echo "Created tunnel: $TUNNEL_ID"
          
          # Create credentials file for cloudflared
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          cat > "${TUNNEL_ID}.json" << CREDEOF
          {"AccountTag":"${ACCOUNT_ID}","TunnelID":"${TUNNEL_ID}","TunnelSecret":"${TUNNEL_SECRET}"}
          CREDEOF

      - name: Setup DNS records
        run: |
          TUNNEL_ID="${{ steps.create.outputs.tunnel_id }}"
          ZONE_ID="bb6b23ca3dd0db9bd764a869b61a5278"
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          
          for HOST in t.tracera api trace gate agileplus-classic; do
            echo "Setting up ${HOST}.pheno.studio..."
            
            # Check if record exists
            EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=${HOST}.pheno.studio&type=CNAME" \
              -H "Authorization: Bearer $TOKEN")
            REC_COUNT=$(echo "$EXISTING" | jq '.result | length')
            
            if [ "$REC_COUNT" = "0" ]; then
              # Create new
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"CNAME\",\"name\":\"${HOST}.pheno.studio\",\"content\":\"${TUNNEL_ID}.cfargotunnel.com\",\"proxied\":true}" \
                | jq '{name: .result.name, content: .result.content}'
            else
              # Update existing
              REC_ID=$(echo "$EXISTING" | jq -r '.result[0].id')
              curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${REC_ID}" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"content\":\"${TUNNEL_ID}.cfargotunnel.com\",\"proxied\":true}" \
                | jq '{name: .result.name, content: .result.content}'
            fi
          done

      - name: Upload tunnel credentials
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-creds
          path: "*.json"
          retention-days: 1

      - name: Print config
        run: |
          TUNNEL_ID="${{ steps.create.outputs.tunnel_id }}"
          echo "### Tunnel Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tunnel ID:** \`${TUNNEL_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### config.yml for C:\\Users\\koosh\\.cloudflared\\config.yml" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo "tunnel: ${TUNNEL_ID}" >> $GITHUB_STEP_SUMMARY
          echo "credentials-file: C:\\Users\\koosh\\.cloudflared\\${TUNNEL_ID}.json" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ingress:" >> $GITHUB_STEP_SUMMARY
          echo "  - hostname: t.tracera.pheno.studio" >> $GITHUB_STEP_SUMMARY
          echo "    service: http://localhost:8080" >> $GITHUB_STEP_SUMMARY
          echo "  - hostname: api.pheno.studio" >> $GITHUB_STEP_SUMMARY
          echo "    service: http://localhost:3000" >> $GITHUB_STEP_SUMMARY
          echo "  - hostname: trace.pheno.studio" >> $GITHUB_STEP_SUMMARY
          echo "    service: http://localhost:8080" >> $GITHUB_STEP_SUMMARY
          echo "  - hostname: gate.pheno.studio" >> $GITHUB_STEP_SUMMARY
          echo "    service: http://localhost:18000" >> $GITHUB_STEP_SUMMARY
          echo "  - hostname: agileplus-classic.pheno.studio" >> $GITHUB_STEP_SUMMARY
          echo "    service: http://localhost:3002" >> $GITHUB_STEP_SUMMARY
          echo "  - service: http_status:404" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
