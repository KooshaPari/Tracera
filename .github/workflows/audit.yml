name: cargo audit

# Tier-0 supply-chain gate: scan Rust dependencies for known security advisories.
# Runs nightly + on Rust-related changes; uploads SARIF to the Security tab.

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - 'deny.toml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - 'deny.toml'
  schedule:
    # Weekly on Mondays at 06:17 UTC
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Cancel in-flight runs for the same ref; serialize across refs to avoid lock contention.
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # id-token is intentionally NOT granted; this job does not need OIDC.
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & advisory DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Run cargo audit
        uses: rustsec/audit-check@5d0480e1f9f9f7727e4b7d8e7a8b2b8e0b0a3c5d # v1.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore-source-unused: false
