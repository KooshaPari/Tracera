name: Quality Checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
    - name: Install UV
      uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06
      with:
        version: latest
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache uv dependencies
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
        restore-keys: '${{ runner.os }}-uv-

          '
    - name: Install dependencies
      run: uv sync --all-groups
    - name: Install pytest-xdist for parallelization
      run: uv pip install pytest-xdist
    - name: Detect changed Python files
      id: changed-python
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\"\nmapfile -t python_files < <(git diff --name-only \"$base\"...HEAD\
        \ -- '*.py')\nif (( ${#python_files[@]} == 0 )); then\n  echo \"has_python=false\"\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"has_python=true\" >> \"$GITHUB_OUTPUT\"\
        \nfi\n"
    - name: Ruff format check
      if: steps.changed-python.outputs.has_python == 'true'
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\"\nmapfile -t python_files < <(git diff --name-only \"$base\"...HEAD\
        \ -- '*.py')\nif (( ${#python_files[@]} == 0 )); then\n  echo \"No changed\
        \ Python files to format-check\" >> $GITHUB_STEP_SUMMARY\n  exit 0\nfi\nuv\
        \ run ruff format --check \"${python_files[@]}\"\necho \"✅ Format check passed\"\
        \ >> $GITHUB_STEP_SUMMARY\n"
    - name: Ruff lint (strict complexity enforcement)
      if: steps.changed-python.outputs.has_python == 'true'
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\"\nmapfile -t python_files < <(git diff --name-only \"$base\"...HEAD\
        \ -- '*.py')\nif (( ${#python_files[@]} == 0 )); then\n  echo \"No changed\
        \ Python files to lint\" >> $GITHUB_STEP_SUMMARY\n  exit 0\nfi\n# Use grouped\
        \ output format for file-based processing (easier for agents to fix)\nuv run\
        \ ruff check \"${python_files[@]}\" --output-format=grouped > /tmp/quality-ruff-results-grouped.txt\
        \ || true\n# Also output JSON for CI parsing\nuv run ruff check \"${python_files[@]}\"\
        \ --output-format=json > /tmp/quality-ruff-results.json || true\nVIOLATION_COUNT=$(jq\
        \ '[.[] // []] | length' /tmp/quality-ruff-results.json || echo \"0\")\necho\
        \ \"## Quality Check - Ruff Violations\" >> $GITHUB_STEP_SUMMARY\necho \"\
        Total violations: $VIOLATION_COUNT\" >> $GITHUB_STEP_SUMMARY\necho \"Complexity\
        \ threshold: max-complexity=7 (pyproject.toml)\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"Format: grouped (grouped by file)\" >> $GITHUB_STEP_SUMMARY\n# Show\
        \ grouped output for developer reference\ncat /tmp/quality-ruff-results-grouped.txt\
        \ || uv run ruff check \"${python_files[@]}\"\n"
    - name: Check for unused imports (pycln)
      if: steps.changed-python.outputs.has_python == 'true'
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\"\nmapfile -t python_files < <(git diff --name-only \"$base\"...HEAD\
        \ -- '*.py')\nif (( ${#python_files[@]} == 0 )); then\n  echo \"No changed\
        \ Python files for pycln\" >> $GITHUB_STEP_SUMMARY\n  exit 0\nfi\nuv run pycln\
        \ --check \"${python_files[@]}\"\necho \"✅ Unused import check passed\" >>\
        \ $GITHUB_STEP_SUMMARY\n"
    - name: Type check (ty - strict mode)
      if: steps.changed-python.outputs.has_python == 'true'
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\ngit fetch --no-tags --depth=1 origin\
        \ \"$base\"\nmapfile -t python_files < <(git diff --name-only \"$base\"...HEAD\
        \ -- '*.py')\nfiltered=()\nfor f in \"${python_files[@]}\"; do\n  [[ \"$f\"\
        \ == tests/conftest.py ]] && continue\n  filtered+=(\"$f\")\ndone\nif (( ${#filtered[@]}\
        \ == 0 )); then\n  echo \"No changed Python files for ty (after excludes)\"\
        \ >> $GITHUB_STEP_SUMMARY\n  exit 0\nfi\nuv run ty check \"${filtered[@]}\"\
        \ --error-on-warning\necho \"✅ Type check passed\"\
        \ >> $GITHUB_STEP_SUMMARY\n"
    - name: Architecture check (tach)
      if: steps.changed-python.outputs.has_python == 'true'
      run: 'uv run tach check

        echo "✅ Architecture boundaries validated" >> $GITHUB_STEP_SUMMARY

        '
    - name: Security scan (Bandit - high severity)
      if: steps.changed-python.outputs.has_python == 'true'
      run: 'uv run bandit -r src/ --severity-level high --confidence-level high --format json --output /tmp/quality-bandit-results.json
        || true

        BANDIT_HIGH=$(jq ''[.results // []] | length'' /tmp/quality-bandit-results.json
        || echo "0")

        echo "Bandit high-severity issues: $BANDIT_HIGH" >> $GITHUB_STEP_SUMMARY

        uv run bandit -r src/ --severity-level high --confidence-level high

        '
    - name: Install Semgrep (binary; project does not depend on semgrep package)
      if: steps.changed-python.outputs.has_python == 'true'
      run: pip install semgrep
    - name: Security scan (Semgrep - community rules)
      if: steps.changed-python.outputs.has_python == 'true'
      run: semgrep --config=p/security-audit src/
    - name: Security scan (Semgrep - project rules)
      if: steps.changed-python.outputs.has_python == 'true'
      run: "if [ -f .semgrep.yml ]; then\n  semgrep --config=.semgrep.yml src/\nelse\n\
        \  echo \"No .semgrep.yml found, skipping project-specific rules\"\nfi\n"
    - name: Docstring coverage
      if: steps.changed-python.outputs.has_python == 'true'
      run: 'uv run interrogate -vv --fail-under=85 src/

        echo "✅ Docstring coverage ≥85%" >> $GITHUB_STEP_SUMMARY

        '
    - name: Generate quality summary
      if: always()
      run: 'echo "## Quality Checks Summary (Python ${{ matrix.python-version }})"
        >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### Enforced Standards" >> $GITHUB_STEP_SUMMARY

        echo "- ✅ Ruff: McCabe complexity ≤7" >> $GITHUB_STEP_SUMMARY

        echo "- ✅ Ruff: max-args=5, max-branches=12, max-statements=50" >> $GITHUB_STEP_SUMMARY

        echo "- ✅ Ty: strict type checking enabled (error-on-warning)" >> $GITHUB_STEP_SUMMARY

        echo "- ✅ Bandit: security scanning (high severity)" >> $GITHUB_STEP_SUMMARY

        echo "- ✅ Tach: architecture boundary enforcement" >> $GITHUB_STEP_SUMMARY

        '
    - name: Upload quality report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: quality-report-${{ matrix.python-version }}
        path: '.ruff_cache/

          /tmp/quality-ruff-results.json

          /tmp/quality-bandit-results.json

          '
        retention-days: 90
    timeout-minutes: 30
