name: cargo-mutants

on:
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Use baseline mode (only test changed files)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutants:
    name: mutation-testing
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mutants-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: mutants-${{ runner.os }}-

      - name: Install cargo-mutants
        # Pin the tool: v27 renamed `--test-timeout` to `--minimum-test-timeout`
        # and started creating the `--output` directory, so an unpinned `cargo
        # install cargo-mutants` silently changes the CLI contract under us.
        run: cargo install cargo-mutants --version 27.1.0 --locked

      - name: Run mutants (baseline enabled)
        if: github.event.inputs.baseline != 'false'
        run: |
          set -euo pipefail
          cargo mutants --baseline=run \
            --timeout 120 \
            --minimum-test-timeout 60 \
            --jobs 2 \
            --output mutants.out \
            --no-shuffle 2>&1 | tee mutants.log

      - name: Run mutants (full sweep)
        if: github.event.inputs.baseline == 'false'
        run: |
          set -euo pipefail
          cargo mutants \
            --timeout 120 \
            --minimum-test-timeout 60 \
            --jobs 2 \
            --output mutants.out \
            --no-shuffle 2>&1 | tee mutants.log

      - name: Summarise results
        if: always()
        run: |
          if [ -f mutants.out/mutants.json ]; then
            {
              echo "## Mutation Testing Results"
              echo '```'
              python3 -c "
          import json
          from collections import Counter
          with open('mutants.out/mutants.json') as f:
              data = json.load(f)
          outcomes = data.get('outcomes', []) if isinstance(data, dict) else []
          counts = Counter(o.get('summary') for o in outcomes)
          total = len(outcomes)
          caught = counts.get('Caught', 0)
          unviable = counts.get('Unviable', 0)
          missed = counts.get('Missed', 0)
          timed_out = counts.get('Timeout', 0)
          print(f'Total mutants: {total}')
          print(f'Caught:         {caught}')
          print(f'Unviable:       {unviable}')
          print(f'Timeout:        {timed_out}')
          print(f'Missed:         {missed}')
          if total - unviable > 0:
              rate = caught / (total - unviable) * 100
              print(f'Score:          {rate:.1f}%')
          "
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: |
            mutants.out/
            mutants.log
          retention-days: 30
