name: Comprehensive Test Validation
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
"on":
  push:
    branches:
    - main
    - develop
    paths:
    - backend/**
    - frontend/**
    - Makefile
    - package.json
    - bun.lock
    - uv.lock
  pull_request:
    branches:
    - main
    - develop
    paths:
    - backend/**
    - frontend/**
    - Makefile
    - package.json
    - bun.lock
    - uv.lock
permissions:
  contents: read
jobs:
  setup-test-users:
    runs-on: ubuntu-latest
    name: Setup test users and credentials
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65
      with:
        cache: npm
        node-version: '20'
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: 1.25.7
    - name: Setup test credentials
      env:
        WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      run: 'make test-setup

        '
    timeout-minutes: 30
  test-frontend-e2e:
    needs: setup-test-users
    runs-on: ubuntu-latest
    name: Frontend E2E Tests (Playwright)
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65
      with:
        cache: npm
        node-version: '20'
    - name: Install bun
      uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
      with:
        bun-version: latest
    - name: Install dependencies
      run: 'cd frontend/apps/web

        bun install

        '
    - name: Run Playwright WebSocket validation
      run: 'cd frontend/apps/web

        bun run test:e2e -- websocket-validation.spec.ts

        '
    - name: Run Playwright route validation
      run: 'cd frontend/apps/web

        bun run test:e2e -- route-validation.spec.ts

        '
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: playwright-report
        path: frontend/apps/web/playwright-report/
        retention-days: 30
    timeout-minutes: 30
  test-frontend-api:
    needs: setup-test-users
    runs-on: ubuntu-latest
    name: Frontend API Tests (Vitest)
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65
      with:
        cache: npm
        node-version: '20'
    - name: Install bun
      uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
      with:
        bun-version: latest
    - name: Install dependencies
      run: 'cd frontend/apps/web

        bun install

        '
    - name: Run Vitest API validation
      run: 'cd frontend/apps/web

        bun run test -- src/__tests__/api/routes-validation.comprehensive.test.ts

        '
    - name: Upload Vitest report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: vitest-report
        path: frontend/apps/web/test-results/
        retention-days: 30
    timeout-minutes: 30
  test-backend-go:
    needs: setup-test-users
    runs-on: ubuntu-latest
    name: Backend Go Tests
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: 1.25.7
    - name: Run Go route validation
      run: 'cd backend

        go test -v ./internal/handlers -run TestAllRoutes -race

        '
    - name: Run Go WebSocket CORS validation
      run: 'cd backend

        go test -v ./internal/handlers -run TestWebSocketCORSHeaders -race

        '
    - name: Upload Go test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: go-test-results
        path: 'backend/coverage.out

          backend/test-results/

          '
        retention-days: 30
    timeout-minutes: 30
  test-backend-python:
    needs: setup-test-users
    runs-on: ubuntu-latest
    name: Backend Python Tests
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Install UV
      uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06
      with:
        version: latest
    - name: Install dependencies
      run: 'cd backend

        uv sync

        '
    - name: Run Python route validation
      run: 'cd backend

        uv run pytest tests/unit/api/test_routes_validation.py -v --tb=short

        '
    - name: Upload Python test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: python-test-results
        path: 'backend/test-results/

          backend/.pytest_cache/

          '
        retention-days: 30
    timeout-minutes: 30
  report:
    needs:
    - test-frontend-e2e
    - test-frontend-api
    - test-backend-go
    - test-backend-python
    runs-on: ubuntu-latest
    name: Generate Validation Report
    if: always()
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Download all artifacts
      uses: actions/download-artifact@d7aade707a79a3bc4130f2605987cbbf2ecfac6c
      with:
        path: validation-artifacts/
    - name: Generate consolidated report
      run: 'cat > VALIDATION_REPORT.md << ''EOF''

        # Comprehensive Test Validation Report


        - **Timestamp**: $(date -u +''%Y-%m-%dT%H:%M:%SZ'')

        - **Commit**: ${{ github.sha }}

        - **Branch**: ${{ github.ref_name }}


        ## Test Suite Results


        | Suite | Status |

        |-------|--------|

        | Frontend E2E (Playwright) | ${{ needs.test-frontend-e2e.result }} |

        | Frontend API (Vitest) | ${{ needs.test-frontend-api.result }} |

        | Backend Go | ${{ needs.test-backend-go.result }} |

        | Backend Python | ${{ needs.test-backend-python.result }} |


        ## Artifacts


        All test reports and coverage data are available as artifacts:

        - `playwright-report/` - Playwright E2E test results

        - `vitest-report/` - Vitest API test results

        - `go-test-results/` - Go backend test results

        - `python-test-results/` - Python backend test results


        ## Execution Metadata


        - **GitHub Actions Run**: [${{ github.run_number }}](${{ github.server_url
        }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

        - **Triggered by**: ${{ github.event_name }}


        EOF

        '
    - name: Comment PR with report
      if: github.event_name == 'pull_request'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: "const fs = require('fs');\nconst report = fs.readFileSync('VALIDATION_REPORT.md',\
          \ 'utf8');\ngithub.rest.issues.createComment({\n  issue_number: context.issue.number,\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  body: report\n\
          });\n"
    - name: Upload validation report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: validation-report
        path: VALIDATION_REPORT.md
        retention-days: 30
    timeout-minutes: 30
  validation-summary:
    needs:
    - report
    runs-on: ubuntu-latest
    name: Validation Summary
    if: always()
    steps:
    - name: Check validation status
      run: "{\n  echo \"## Validation Complete\"\n  echo \"\"\n  echo \"All test suites\
        \ have completed execution.\"\n  echo \"\"\n  echo \"View results:\"\n  echo\
        \ \"- [Run Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{\
        \ github.run_id }})\"\n} >> \"$GITHUB_STEP_SUMMARY\""
    timeout-minutes: 30
