name: nightly
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native server
        run: cargo build --release -p tracera-server
      - name: Smoke test endpoints
        run: |
          set -euo pipefail
          ./target/release/tracera-server >server.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/health; then
            echo "--- server.log ---"
            cat server.log || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/ready
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/coverage-matrix -H 'content-type: application/json' -d '{"links":[]}'
          kill $SRV || true
        env:
          DATABASE_URL: sqlite::memory:
