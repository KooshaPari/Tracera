name: nightly
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native server
        run: cargo build --release -p tracera-server
      - name: Smoke test endpoints
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          DATABASE_URL="sqlite://${tmp_dir}/tracera.db?mode=rwc" \
          TRACERA_BIND_ADDR="127.0.0.1:18080" \
          TRACERA_ALLOWED_ORIGINS="http://127.0.0.1:18080" \
          RUST_LOG=tracera_server=warn \
            ./target/release/tracera-server >/tmp/tracera-nightly.log 2>&1 &
          SRV=$!
          cleanup() {
            echo "=== Server log ==="
            cat /tmp/tracera-nightly.log || true
            echo "=== End server log ==="
            kill "${SRV}" 2>/dev/null || true
            wait "${SRV}" 2>/dev/null || true
            rm -rf "${tmp_dir}"
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            if ! kill -0 "${SRV}" 2>/dev/null; then
              echo "ERROR: Server process died during startup"
              cat /tmp/tracera-nightly.log
              exit 1
            fi
            curl --silent --fail http://127.0.0.1:18080/health >/dev/null && break
            sleep 0.1
          done
          curl --silent --fail http://127.0.0.1:18080/health
          curl --silent --fail http://127.0.0.1:18080/ready
          # This POST sits behind CSRF protection, which rejects a request without a
          # canonical Origin or Referer. curl --fail turned that 403 into exit 22 and
          # failed the run, which says nothing about whether the route exists. Send the
          # origin the server is configured to accept, and treat 401/403 as "present and
          # guarded" so the smoke test fails only when a route is missing or broken.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://127.0.0.1:18080/api/v1/coverage-matrix \
            -H "Origin: http://127.0.0.1:18080" \
            -H 'content-type: application/json' -d '{"links":[]}')
          echo "POST /api/v1/coverage-matrix -> HTTP ${code}"
          case "${code}" in
            2??) echo "PASS: coverage-matrix answered" ;;
            401|403) echo "PASS: coverage-matrix is present and guarded" ;;
            *) echo "::error::coverage-matrix returned HTTP ${code}"; exit 1 ;;
          esac
