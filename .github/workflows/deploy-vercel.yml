name: Deploy Tracera to Vercel

# Environment delineation: docs/04-guides/ENVIRONMENTS.md
#
# A push to main is a `dev` deploy, never production. Production happens only on
# a v* tag, or on an explicit workflow_dispatch with environment: prod.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        default: dev
        options: [dev, preview, prod]
  workflow_call:
    inputs:
      environment:
        description: Target environment; empty derives it from the caller's event
        required: false
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  # The one place the target environment is derived, so no step has to repeat
  # the logic and no trigger can quietly mean "production".
  plan:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      env: ${{ steps.derive.outputs.env }}
    steps:
      - id: derive
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            target=preview
          elif [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            # A release tag is always production; an input must not downgrade it.
            target=prod
          elif [ -n "${{ inputs.environment }}" ]; then
            target="${{ inputs.environment }}"
          else
            target=dev
          fi
          case "$target" in
            dev|preview|prod) ;;
            *) echo "::error::unsupported environment '$target'"; exit 1 ;;
          esac
          echo "env=$target" >> "$GITHUB_OUTPUT"
          echo "Target environment: $target"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Give the *-production environments required reviewers in repository
    # settings; dev and preview intentionally carry no gate.
    environment:
      name: vercel-${{ needs.plan.outputs.env }}
    concurrency:
      group: vercel-${{ needs.plan.outputs.env }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ needs.plan.outputs.env }}
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      HAS_VERCEL_ORG: ${{ vars.VERCEL_ORG_ID }}
      HAS_VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT_ID }}
      # Every Vercel deployment uses the same-origin catch-all API gateway.
      # A loopback URL in a public preview resolves on the visitor's machine.
      VITE_API_URL: /api
    steps:
      # Production fails closed: a missing credential must be loud, not a silent
      # success. This step name is part of the contract enforced by
      # scripts/verify-workflow-security.sh.
      - name: Fail production deployment when Vercel secrets are unavailable
        if: ${{ needs.plan.outputs.env == 'prod' && (env.HAS_VERCEL_TOKEN == '' || env.HAS_VERCEL_ORG == '' || env.HAS_VERCEL_PROJECT == '') }}
        run: |
          echo "::error title='Vercel production deploy blocked'::VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID is missing."
          echo "Add them in https://github.com/KooshaPari/Tracera/settings/secrets/actions"
          echo "Get a token at https://vercel.com/account/tokens"
          exit 1

      - name: Skip non-production when Vercel credentials are unavailable
        if: ${{ needs.plan.outputs.env != 'prod' && (env.HAS_VERCEL_TOKEN == '' || env.HAS_VERCEL_ORG == '' || env.HAS_VERCEL_PROJECT == '') }}
        run: |
          echo "::notice title='Vercel deploy skipped'::VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID is missing; the $DEPLOY_ENV deploy was skipped."

      - uses: actions/checkout@v4
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' && env.HAS_VERCEL_PROJECT != '' }}

      - uses: oven-sh/setup-bun@v1
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' && env.HAS_VERCEL_PROJECT != '' }}
        with:
          bun-version: latest

      - name: Validate the Vercel API base
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' && env.HAS_VERCEL_PROJECT != '' }}
        run: |
          test -n "$VITE_API_URL" || {
            echo "The configured API URL repository variable is required for Vercel builds." >&2
            exit 1
          }
          node frontend/scripts/validate-vercel-api-base.mjs

      - name: Deploy to Vercel
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' && env.HAS_VERCEL_PROJECT != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # --prod only for the prod environment: dev and preview produce an
          # immutable preview deployment instead of promoting the production alias.
          if [ "$DEPLOY_ENV" = "prod" ]; then
            prod_flag="--prod"
          else
            prod_flag=""
          fi
          # shellcheck disable=SC2086  # deliberate word splitting: empty or --prod
          url=$(npx vercel@59.19.0 deploy $prod_flag --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" \
            --build-env "VITE_API_URL=$VITE_API_URL" \
            --env "VITE_API_URL=$VITE_API_URL" | tail -n 1)
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"
          echo "Deployed: $url"

      - name: Test deployment verification contract
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' && env.HAS_VERCEL_PROJECT != '' }}
        run: node --test scripts/test-deployed-app.mjs

      - name: Verify the deployment serves the app
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' && env.HAS_VERCEL_PROJECT != '' && env.DEPLOY_URL != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          # Reuse an existing automation secret when configured; otherwise use
          # the deployment owner's Vercel CLI authorization. Protection stays on.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          body_path=$(mktemp)
          trap 'rm -f "$body_path"' EXIT
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            status=$(curl --silent --show-error --location --max-time 30 \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              --output "$body_path" --write-out '%{http_code}' "$DEPLOY_URL")
          else
            status=$(npx vercel@59.19.0 curl "$DEPLOY_URL" \
              --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" --non-interactive -- \
              --silent --show-error --location --max-time 30 \
              --output "$body_path" --write-out '%{http_code}')
          fi
          node scripts/verify-deployed-app.mjs "$status" "$body_path"
