name: Deploy Tracera to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure these environments in repository settings with required
    # reviewers/branch protections.  The workflow keeps preview and production
    # approvals separate while preventing overlapping deploy races.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'vercel-preview' || 'vercel-production' }}
    concurrency:
      group: vercel-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      HAS_VERCEL_ORG: ${{ secrets.VERCEL_ORG_ID }}
      HAS_VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_URL: ${{ vars.TRACERA_API_BASE }}
    steps:
      - name: Skip when Vercel secrets are unavailable
        if: ${{ github.event_name == 'pull_request' && (env.HAS_VERCEL_TOKEN == '' || env.HAS_VERCEL_ORG == '' || env.HAS_VERCEL_PROJECT == '') }}
        run: echo "Vercel secrets unavailable on pull request; deployment skipped."

      - name: Fail production deployment when Vercel secrets are unavailable
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (env.HAS_VERCEL_TOKEN == '' || env.HAS_VERCEL_ORG == '' || env.HAS_VERCEL_PROJECT == '') }}
        run: |
          echo "Vercel secrets are required for production deployment on main." >&2
          exit 1

      - name: Validate Vercel project configuration
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' && env.HAS_VERCEL_PROJECT != '' }}
        run: test -n "$HAS_VERCEL_TOKEN" && test -n "$HAS_VERCEL_ORG" && test -n "$HAS_VERCEL_PROJECT"

      - uses: actions/checkout@v4
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' && env.HAS_VERCEL_PROJECT != '' }}

      - uses: oven-sh/setup-bun@v1
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' && env.HAS_VERCEL_PROJECT != '' }}
        with:
          bun-version: latest

      - name: Validate and stage API base for Vercel build
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' && env.HAS_VERCEL_PROJECT != '' }}
        run: |
          test -n "$VITE_API_URL" || {
            echo "The configured API URL repository variable is required for Vercel builds." >&2
            exit 1
          }
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PRODUCTION_DEPLOY=1 npm --prefix frontend run test:api-base
          fi

      - name: Deploy to Vercel (preview on PR, production on main)
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' && env.HAS_VERCEL_PROJECT != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            bunx vercel@41.7.2 deploy --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" \
              --build-env "VITE_API_URL=$VITE_API_URL" \
              --env "VITE_API_URL=$VITE_API_URL"
          else
            bunx vercel@41.7.2 deploy --prod --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" \
              --build-env "VITE_API_URL=$VITE_API_URL" \
              --env "VITE_API_URL=$VITE_API_URL"
          fi
