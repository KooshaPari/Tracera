name: Deploy Tracera to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      HAS_VERCEL_ORG: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - name: Skip when Vercel secrets are unavailable
        if: ${{ env.HAS_VERCEL_TOKEN == '' || env.HAS_VERCEL_ORG == '' }}
        run: echo "Vercel secrets unavailable; deployment skipped."

      - uses: actions/checkout@v4
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' }}

      - uses: oven-sh/setup-bun@v1
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' }}
        with:
          bun-version: latest

      - name: Deploy to Vercel (preview on PR, production on main)
        if: ${{ env.HAS_VERCEL_TOKEN != '' && env.HAS_VERCEL_ORG != '' }}
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || '' }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            bunx vercel deploy --token "$VERCEL_TOKEN"
          else
            bunx vercel deploy --prod --token "$VERCEL_TOKEN"
          fi
