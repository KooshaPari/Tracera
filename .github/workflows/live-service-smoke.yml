name: Live service smoke

# Independently verifies the deployed frontend and the Access-protected
# self-hosted tunnel. A healthy Vercel fallback MUST NOT satisfy the tunnel gate.

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Which surface to probe
        required: false
        default: all
        type: choice
        options: [all, prod, frontend, tunnel]

permissions:
  contents: read

jobs:
  smoke:
    name: ping-live-services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 2026-10-13 live topology: t.tracera.pheno.studio is the direct
      # Access-protected Tracera origin route on the shared tracera-local tunnel.
      TUNNEL_API: https://t.tracera.pheno.studio
      PROD_FRONTEND: https://tracera-kappa.vercel.app
      CURL_TIMEOUT: "60"
      SMOKE_TARGET: ${{ github.event_name == 'schedule' && 'all' || inputs.target }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Probe Vercel same-origin API
        if: ${{ env.SMOKE_TARGET == 'all' || env.SMOKE_TARGET == 'prod' || env.SMOKE_TARGET == 'frontend' }}
        run: |
          set -euo pipefail
          body=$(curl --silent --show-error --fail-with-body             --max-time "$CURL_TIMEOUT"             "$PROD_FRONTEND/api/healthz")
          printf '%s' "$body" | grep -q '"status":"ok"' || {
            echo "::error::Vercel same-origin API did not report status:ok"
            exit 1
          }
          echo "PASS: Vercel same-origin API"

      - name: Require Cloudflare Access machine credentials
        if: ${{ env.SMOKE_TARGET == 'all' || env.SMOKE_TARGET == 'prod' || env.SMOKE_TARGET == 'tunnel' }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_ACCESS_CLIENT_ID:-}" || -z "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            echo "::error::CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET are required for the production tunnel smoke"
            echo "::error::A Vercel success is not evidence that the Access-protected self-hosted origin is reachable."
            exit 1
          fi

      - name: Probe authenticated self-hosted tunnel
        if: ${{ env.SMOKE_TARGET == 'all' || env.SMOKE_TARGET == 'prod' || env.SMOKE_TARGET == 'tunnel' }}
        run: |
          set -euo pipefail
          curl_args=(
            --silent --show-error --fail-with-body
            --max-time "$CURL_TIMEOUT"
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          )

          ok=0
          for path in /healthz /api/v1/health; do
            if body=$(curl "${curl_args[@]}" "$TUNNEL_API$path" 2>/dev/null); then
              if printf '%s' "$body" | grep -q '"status":"ok"'; then
                echo "PASS: authenticated tunnel $path"
                ok=1
                break
              fi
            fi
          done

          if [[ "$ok" -ne 1 ]]; then
            echo "::error::Access-authenticated Tracera tunnel did not report status:ok"
            exit 1
          fi

      - name: Probe tunnel CORS for deployed frontend
        if: ${{ env.SMOKE_TARGET == 'all' || env.SMOKE_TARGET == 'prod' || env.SMOKE_TARGET == 'tunnel' }}
        run: |
          set -euo pipefail
          headers=$(curl --silent --show-error --dump-header - --output /dev/null             --max-time "$CURL_TIMEOUT"             -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"             -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"             -H "Origin: $PROD_FRONTEND"             "$TUNNEL_API/ready")

          allowed=$(printf '%s' "$headers"             | tr -d '\r'             | awk 'tolower($1) == "access-control-allow-origin:" { print $2 }')

          if [[ "$allowed" != "$PROD_FRONTEND" && "$allowed" != "*" ]]; then
            echo "::error::tunnel answered Origin $PROD_FRONTEND with ACAO '${allowed:-<absent>}'"
            exit 1
          fi
          echo "PASS: tunnel CORS allows deployed frontend"

      - name: Probe prod frontend
        if: ${{ env.SMOKE_TARGET == 'all' || env.SMOKE_TARGET == 'frontend' || env.SMOKE_TARGET == 'prod' }}
        run: |
          set -euo pipefail
          code=$(curl --silent --output /tmp/prod_frontend.html             --write-out '%{http_code}'             --max-time "$CURL_TIMEOUT" "$PROD_FRONTEND/")
          echo "prod frontend -> HTTP $code"
          case "$code" in
            2??) ;;
            *) echo "::error::prod frontend returned HTTP $code"; exit 1 ;;
          esac
          if grep -qi 'scaffolding coming soon' /tmp/prod_frontend.html; then
            echo "::error::prod frontend is serving the placeholder, not the SPA"
            exit 1
          fi
          if ! grep -q 'id="root"' /tmp/prod_frontend.html             && ! grep -q 'data-server-rendered' /tmp/prod_frontend.html; then
            echo "::error::prod frontend body does not look like the SPA build"
            exit 1
          fi
          echo "PASS: prod frontend serves the SPA build."
