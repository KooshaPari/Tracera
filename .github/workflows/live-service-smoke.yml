name: Live service smoke

# Pings every publicly reachable Tracera surface once a day so a stale Vercel
# alias, a down self-hosted tunnel, or a Cloudflare worker failure shows up here
# instead of surprising the next person who loads the app. The local nightly
# workflow exercises the binary itself; this one exercises the deploys.

on:
  schedule:
    # Stagger from nightly.yml (06:17 UTC) so the two cron jobs don't collide
    # on the same runner pool and starve each other.
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Which surface to probe
        required: false
        default: all
        type: choice
        options: [all, prod, dev, frontend]

permissions:
  contents: read

jobs:
  smoke:
    name: ping-live-services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Prefer the dedicated API hostname once tunnel DNS exists; fall back to the
      # path-prefixed ingress on the Access-protected parent domain.
      PROD_API: https://api.tracera.pheno.studio
      PROD_API_FALLBACK: https://tracera.pheno.studio/api
      PROD_FRONTEND: https://tracera-kappa.vercel.app
      CURL_TIMEOUT: "60"
      # Scheduled runs have no workflow_dispatch input; treat them as `all`.
      SMOKE_TARGET: ${{ github.event_name == 'schedule' && 'all' || inputs.target }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Probe prod API
        if: ${{ env.SMOKE_TARGET == 'all' || env.SMOKE_TARGET == 'prod' || env.SMOKE_TARGET == 'dev' }}
        run: |
          set -euo pipefail
          curl_args=(--silent --show-error --fail-with-body --max-time "${CURL_TIMEOUT}")
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            curl_args+=(-H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}")
            curl_args+=(-H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")
          fi

          probe_health() {
            base="$1"
            for path in /healthz /api/v1/health; do
              if body=$(curl "${curl_args[@]}" "${base}${path}" 2>/dev/null); then
                echo "prod ${path} @ ${base} -> ${body}"
                printf %s "${body}" | grep -q '"status":"ok"' && return 0
              fi
            done
            return 1
          }

          if probe_health "${PROD_API}"; then
            exit 0
          fi
          if probe_health "${PROD_API_FALLBACK}"; then
            echo "::notice::api.tracera.pheno.studio unreachable; fell back to ${PROD_API_FALLBACK}"
            exit 0
          fi
          echo "::error::prod API did not report status:ok on ${PROD_API} or ${PROD_API_FALLBACK}"
          exit 1

      - name: Probe CORS for the deployed frontend origin
        if: ${{ env.SMOKE_TARGET == 'all' || env.SMOKE_TARGET == 'prod' || env.SMOKE_TARGET == 'dev' }}
        run: |
          set -euo pipefail
          # A browser accepts a cross-origin response only when
          # Access-Control-Allow-Origin equals the requesting origin. The
          # production service once answered with a fixed local origin for every
          # request, so it looked healthy to curl while blocking every deployed
          # frontend - the app reported a generic "service down". Assert the echo,
          # not the header's presence.
          curl_args=(--silent --show-error --dump-header - --output /dev/null \
            --max-time "${CURL_TIMEOUT}")
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            curl_args+=(-H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}")
            curl_args+=(-H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")
          fi

          check_origin() {
            host="$1"
            origin="$2"
            headers=$(curl "${curl_args[@]}" -H "Origin: ${origin}" "${host}/ready")
            allowed=$(printf '%s' "${headers}" \
              | tr -d '\r' \
              | awk 'tolower($1) == "access-control-allow-origin:" { print $2 }')
            if [ "${allowed}" != "${origin}" ] && [ "${allowed}" != "*" ]; then
              echo "::error::${host} answered Origin ${origin} with ACAO '${allowed:-<absent>}'; the browser will block this call"
              return 1
            fi
            echo "PASS: ${host} allows ${origin}"
          }

          if check_origin "${PROD_API}" "https://tracera-kappa.vercel.app"; then
            exit 0
          fi
          check_origin "${PROD_API_FALLBACK}" "https://tracera-kappa.vercel.app"

      - name: Probe prod frontend
        if: ${{ env.SMOKE_TARGET == 'all' || env.SMOKE_TARGET == 'frontend' }}
        run: |
          set -euo pipefail
          # A 200 proves nothing on its own: the SPA may be missing while the
          # Vercel placeholder answers 200. Read the body and check for the
          # retired "scaffolding coming soon" stub and the SPA's root element.
          code=$(curl --silent --output /tmp/prod_frontend.html \
            --write-out '%{http_code}' \
            --max-time "${CURL_TIMEOUT}" "${PROD_FRONTEND}/")
          echo "prod frontend -> HTTP ${code}"
          case "${code}" in
            2??) ;;
            *) echo "::error::prod frontend returned HTTP ${code}"; exit 1 ;;
          esac
          if grep -qi 'scaffolding coming soon' /tmp/prod_frontend.html; then
            echo "::error::prod frontend is serving the placeholder, not the SPA"
            exit 1
          fi
          if ! grep -q 'id="root"' /tmp/prod_frontend.html \
            && ! grep -q 'data-server-rendered' /tmp/prod_frontend.html; then
            echo "::error::prod frontend body does not look like the SPA build"
            exit 1
          fi
          echo "PASS: prod frontend serves the SPA build."
