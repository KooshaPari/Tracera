name: Setup Cloudflare Access

on:
  workflow_dispatch:
    inputs:
      access_hostname:
        description: Hostname protected by the Access application
        required: false
        type: string
        default: t.tracera.pheno.studio
      public_bypass:
        description: Add a Bypass/everyone policy (public, no login)
        required: false
        type: boolean
        default: false
      operator_email:
        description: Optional email to add to an Allow policy (human login)
        required: false
        type: string

permissions:
  contents: read

jobs:
  setup:
    name: Configure Access for ${{ inputs.access_hostname }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_HOSTNAME: ${{ inputs.access_hostname }}
      PUBLIC_BYPASS: ${{ inputs.public_bypass && '1' || '0' }}
      OPERATOR_EMAIL: ${{ inputs.operator_email }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify Cloudflare token
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set"
            exit 1
          fi
          code=$(curl -sS -o /tmp/cf_verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [[ "$code" != "200" ]]; then
            echo "::error::Cloudflare token verify failed (HTTP $code)"
            exit 1
          fi

      - name: List Access applications (inspect)
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=100" \
            | python3 -c "import json,sys; data=json.load(sys.stdin); print('Access applications:'); [print(f\"  - id={a.get('id')} domain={a.get('domain')} name={a.get('name')}\") for a in data.get('result', [])]"

      - name: Apply Access policy using existing service token
        if: ${{ !inputs.public_bypass }}
        run: |
          set -euo pipefail
          # Deliberately leave TOKEN_OUTPUT_FILE unset. CI is not allowed to mint
          # a one-time secret that it cannot securely persist; the script fails
          # closed if tracera-ci-smoke does not already exist.
          unset TOKEN_OUTPUT_FILE
          bash scripts/setup-cloudflare-access.sh

      - name: Apply public bypass policy
        if: ${{ inputs.public_bypass }}
        run: |
          set -euo pipefail
          bash scripts/setup-cloudflare-access.sh

      - name: Smoke public bypass
        if: ${{ inputs.public_bypass }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/smoke_body.txt -w '%{http_code}' -L --max-time 30 "https://${ACCESS_HOSTNAME}/")
          echo "curl https://${ACCESS_HOSTNAME}/ -> HTTP ${code}"
          if grep -Eiq 'cf-access|sign in|cloudflareaccess' /tmp/smoke_body.txt; then
            echo "::error::response still looks Access-gated"
            exit 1
          fi
          case "$code" in
            2??) ;;
            *) echo "::error::public bypass returned HTTP $code"; exit 1 ;;
          esac
