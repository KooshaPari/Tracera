name: Setup Cloudflare Access

on:
  workflow_dispatch:
    inputs:
      access_hostname:
        description: Hostname protected by the Access application
        required: false
        type: string
        default: tracera.pheno.studio
      public_bypass:
        description: Add a Bypass/everyone policy (public, no login)
        required: false
        type: boolean
        default: false
      operator_email:
        description: Optional email to add to an Allow policy (human login)
        required: false
        type: string
      rotate_service_token:
        description: Delete and recreate the CI service token (rotates secrets)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    name: Configure Access for ${{ inputs.access_hostname }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_HOSTNAME: ${{ inputs.access_hostname }}
      PUBLIC_BYPASS: ${{ inputs.public_bypass && '1' || '0' }}
      OPERATOR_EMAIL: ${{ inputs.operator_email }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare token
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set"
            exit 1
          fi
          code=$(curl -sS -o /tmp/cf_verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare token verify failed (HTTP $code)"
            cat /tmp/cf_verify.json
            exit 1
          fi

      - name: List Cloudflare Tunnels (inspect only)
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== Cloudflare Tunnels ==="
          npx wrangler tunnel list || true

      - name: List Access applications (inspect)
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=100" \
            | python3 -c "import json,sys; data=json.load(sys.stdin); print('Access applications:'); [print(f\"  - id={a.get('id')} domain={a.get('domain')} name={a.get('name')}\") for a in data.get('result', [])]"

      - name: Optionally rotate CI service token
        if: ${{ inputs.rotate_service_token && inputs.public_bypass != true }}
        run: |
          set -euo pipefail
          tokens=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/service_tokens?per_page=100")
          id=$(printf '%s' "$tokens" | python3 -c "import json,sys; print(next((t['id'] for t in json.load(sys.stdin).get('result', []) if t.get('name')=='tracera-ci-smoke'), ''))")
          if [ -n "$id" ]; then
            curl -fsS -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/service_tokens/$id"
            echo "Deleted existing tracera-ci-smoke token $id"
          fi

      - name: Apply Access policies and service token
        id: access
        run: |
          set -euo pipefail
          bash scripts/setup-cloudflare-access.sh | tee /tmp/access-setup.log

      - name: Smoke curl target hostname
        if: inputs.public_bypass
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/smoke_body.txt -w '%{http_code}' -L --max-time 30 "https://${ACCESS_HOSTNAME}/")
          echo "curl https://${ACCESS_HOSTNAME}/ -> HTTP ${code}"
          if grep -Eiq 'cf-access|sign in|cloudflareaccess' /tmp/smoke_body.txt; then
            echo "::error::response still looks Access-gated"
            head -c 500 /tmp/smoke_body.txt
            exit 1
          fi
          echo "PASS: no Access login markers in body"

      - name: Capture new service token credentials
        if: ${{ !inputs.public_bypass }}
        id: capture
        run: |
          set -euo pipefail
          if ! grep -q "gh secret set CF_ACCESS_CLIENT_ID" /tmp/access-setup.log; then
            echo "no_new_token=true" >> "$GITHUB_OUTPUT"
            echo "Reused existing service token; skipping secret rotation."
            exit 0
          fi
          echo "no_new_token=false" >> "$GITHUB_OUTPUT"
          python3 -c "import re; log=open('/tmp/access-setup.log').read(); cid=re.search(r\"CF_ACCESS_CLIENT_ID --repo .* --body '([^']+)'\", log); sec=re.search(r\"CF_ACCESS_CLIENT_SECRET --repo .* --body '([^']+)'\", log); assert cid and sec; open('/tmp/token.env','w').write(f\"CF_ACCESS_CLIENT_ID={cid.group(1)}\\nCF_ACCESS_CLIENT_SECRET={sec.group(1)}\\n\")"

      - name: Print new service token credentials (manual store)
        if: steps.capture.outputs.no_new_token == 'false'
        run: |
          set -euo pipefail
          echo "New service token created. Store manually as repo secrets:"
          echo "  CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET"
          echo "(values written to /tmp/token.env on this runner only)"
