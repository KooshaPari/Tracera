name: Audit Rust regression (isolated, zero-spend)
on:
  push:
    branches: [audit/rust-regressions-20261007]
permissions:
  contents: read
concurrency:
  group: audit-rust-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assessment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute actual Tracera regression tests
        run: cargo test --locked -p tracera-server --test assessment_unknown_stale_regression -- --nocapture
