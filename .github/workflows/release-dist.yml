name: release-dist

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-dist.yml"

permissions:
  contents: read

jobs:
  publish-release:
    name: Build and upload ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tracera-server-x86_64-linux.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tracera-server-x86_64-macos.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tracera-server-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tracera-server-x86_64-windows.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release -p tracera-server --target ${{ matrix.target }}
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.archive }} -C target/${{ matrix.target }}/release tracera-server
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          7z a dist/${{ matrix.archive }} target/${{ matrix.target }}/release/tracera-server.exe
      - name: Generate archive provenance manifest
        shell: bash
        env:
          TRACERA_RELEASE_ARTIFACTS: dist/${{ matrix.archive }}
        run: |
          node frontend/scripts/release-manifest.mjs dist/release-manifest-${{ matrix.target }}.json
          node frontend/scripts/verify-release-manifest.mjs dist/release-manifest-${{ matrix.target }}.json
      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ matrix.archive }}
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.archive }}
            dist/release-manifest-${{ matrix.target }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dry-run:
    name: Dry-run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dry-run build
        run: cargo build --locked --release -p tracera-server
