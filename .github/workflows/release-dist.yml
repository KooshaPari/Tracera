name: release-dist

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-dist.yml"

permissions:
  contents: write

jobs:
  publish-release:
    name: Build and upload ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tracera-server-x86_64-linux.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tracera-server-x86_64-macos.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tracera-server-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tracera-server-x86_64-windows.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        working-directory: crates/tracera-server
        run: cargo build --release
      - name: Find binary path
        id: binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "binary_path=crates/tracera-server/target/release/tracera-server.exe" >> $GITHUB_OUTPUT
          else
            echo "binary_path=crates/tracera-server/target/release/tracera-server" >> $GITHUB_OUTPUT
          fi
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cd crates/tracera-server/target/release
          tar -czf ../../../dist/${{ matrix.archive }} tracera-server
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cd crates/tracera-server/target/release
          7z a ../../../dist/${{ matrix.archive }} tracera-server.exe
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish tracera-server
        working-directory: crates/tracera-server
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
      - name: Publish tracertm-mcp
        working-directory: crates/tracertm-mcp
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  dry-run:
    name: Dry-run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dry-run tracera-server
        working-directory: crates/tracera-server
        run: cargo publish --dry-run --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
      - name: Dry-run tracertm-mcp
        working-directory: crates/tracertm-mcp
        run: cargo publish --dry-run --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
