name: release-dist

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-dist.yml"

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish release
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tracera-server-x86_64-linux.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tracera-server-x86_64-macos.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tracera-server-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tracera-server-x86_64-windows.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        working-directory: crates/tracera-server
        run: cargo build --release --target ${{ matrix.target }}
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd crates/tracera-server/target/${{ matrix.target }}/release
          tar -czf ${{ github.workspace }}/${{ matrix.archive }} tracera-server
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd crates/tracera-server/target/${{ matrix.target }}/release
          7z a ${{ github.workspace }}/${{ matrix.archive }} tracera-server.exe
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish tracera-server
        working-directory: crates/tracera-server
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
      - name: Publish tracertm-mcp
        working-directory: crates/tracertm-mcp
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  dry-run:
    name: Dry-run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dry-run tracera-server
        working-directory: crates/tracera-server
        run: cargo publish --dry-run --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
      - name: Dry-run tracertm-mcp
        working-directory: crates/tracertm-mcp
        run: cargo publish --dry-run --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
