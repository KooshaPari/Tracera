name: Dependency audit

on:
  push:
    paths:
      - Cargo.lock
      - frontend/bun.lock
      - uv.lock
      - sidecar/go/go.mod
      - .github/workflows/dependency-audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - frontend/bun.lock
      - uv.lock
      - sidecar/go/go.mod
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        continue-on-error: true
        with:
          scan-args: |-
            scan source -r .
