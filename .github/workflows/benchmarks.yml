name: Performance Benchmarks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  go-benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4@11bd71901bbe5b1630ceea73d27597364c9af683@v4
      - uses: actions/setup-go@v5@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.7'
          cache-dependency-path: backend/go.sum
      - name: Run benchmarks
        working-directory: backend
        run: go test ./benchmarks/... -bench=. -benchmem -count=3 -timeout=5m | tee benchmark-results.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-benchmark-results
          path: backend/benchmark-results.txt
          retention-days: 90