name: Secret provenance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tracked-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan tracked source for high-confidence credentials
        run: ./scripts/verify-secret-provenance.sh
