name: Go sidecar bootstrap checks

on:
  push:
    paths:
      - 'sidecar/go/**'
      - '.github/workflows/sidecar-bootstrap-checks.yml'
      - 'docs/operations/*polyglot*'
  pull_request:
    paths:
      - 'sidecar/go/**'
      - 'docs/operations/*polyglot*'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.10'

      - name: Run Go sidecar tests
        working-directory: sidecar/go
        run: go test ./...

      - name: Run Go sidecar race detector
        working-directory: sidecar/go
        run: go test -race ./...

      - name: Build Go sidecar binary
        working-directory: sidecar/go
        run: go build ./cmd/tracera-sidecar
