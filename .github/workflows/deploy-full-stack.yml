name: Deploy Full Stack (Frontend + Edge)

# Environment delineation: docs/04-guides/ENVIRONMENTS.md
#
# This orchestrator passes the target environment down to the frontend and edge
# deploy workflows. On a v* tag the environment is prod; on a push to main it is
# dev; a manual run chooses explicitly.
#
# The Rust backend is self-hosted (Cloudflare Tunnel to the operator box); see
# deploy/selfhost/README.md. CI builds and pushes the container image via
# build-push-image.yml but does not deploy the backend here.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options: [dev, preview, prod]
      skip_tests:
        description: "Skip test suite"
        required: false
        default: "false"
        type: boolean
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crates/**"
      - "frontend/**"
      - "Dockerfile.rust"
      - "wrangler.toml"
      - "vercel.json"
      # Include this workflow itself, as the sibling deploy workflows do, so a
      # change to the orchestrator is exercised rather than merged untested.
      - ".github/workflows/deploy-full-stack.yml"
permissions:
  contents: read
jobs:
  test:
    name: Run tests
    # `skip_tests` is declared `type: boolean`, so the inputs context yields a
    # boolean. Comparing it to the string 'true' coerces to a number, making
    # `true != 'true'` evaluate true and run the tests that were meant to be
    # skipped. Negate the value directly instead.
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test
        run: cargo test -p tracera-server
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Frontend build, then typecheck
        working-directory: frontend
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          # The typecheck contract checks composite project references, so the
          # packages they point at must be built first or tsc fails with TS6305
          # ("output file has not been built from source"). frontend-contract-checks.yml
          # builds before typechecking for the same reason.
          bun run build
          bun run typecheck

      - name: Assert the frontend build produced the SPA
        working-directory: frontend
        run: |
          set -euo pipefail
          # A placeholder page is committed at the repo root, and Vercel serves it
          # whenever a deployment has no build output, so a broken build can still
          # look like a successful deploy. Assert the build produced the real app.
          test -f dist/index.html || {
            echo "::error::dist/index.html is missing: the frontend build produced no output"
            exit 1
          }
          if grep -qi "scaffolding coming soon" dist/index.html; then
            echo "::error::the build output is the placeholder page, not the SPA"
            exit 1
          fi
          grep -q 'id="root"' dist/index.html || {
            echo "::error::the build output has no #root element"
            exit 1
          }
          echo "PASS: the build produced the SPA ($(wc -c < dist/index.html) bytes)"

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: [test]
    if: inputs.skip_tests == 'true' || needs.test.result == 'success'
    uses: ./.github/workflows/deploy-vercel.yml
    # Without this the reusable workflow received an empty workflow_call input,
    # saw workflow_dispatch, and fell through to dev, so a dispatch asking for
    # prod deployed the frontend as dev.
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
    permissions:
      contents: read

  deploy-edge:
    name: Deploy Edge (Cloudflare)
    needs: [test]
    if: ${{ inputs.skip_tests || needs.test.result == 'success' }}
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
    permissions:
      contents: read

  publish-fleet-state:
    name: Publish fleet desired-state
    needs: [test, deploy-frontend, deploy-edge]
    if: ${{ always() && needs.test.result == 'success' && needs.deploy-edge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Push desired state to the fleet control plane
        env:
          # Base URL of the deployed edge worker (tracera-edge or
          # tracera-edge-dev / -preview depending on the target environment).
          FLEET_BASE_URL: ${{ vars.FLEET_BASE_URL }}
          FLEET_ENROLL_TOKEN: ${{ secrets.FLEET_ENROLL_TOKEN }}
          TRACERA_IMAGE: ghcr.io/kooshapari/tracera-server:${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$FLEET_BASE_URL" ] || [ -z "$FLEET_ENROLL_TOKEN" ]; then
            echo "::notice::FLEET_BASE_URL or FLEET_ENROLL_TOKEN not set; no enrolled nodes to notify."
            exit 0
          fi
          # Desired state: every node that has services declared gets the
          # newly built image for the canonical service name. Phase 1 keeps
          # the assignment flat (all nodes get the same image); per-node
          # overrides arrive when the control plane grows an assignment UI.
          body=$(printf '{"services":{"tracera-server":"%s"}}' "$TRACERA_IMAGE")
          # Bump the generation by POSTing the same desired state; the
          # control plane increments generation per PUT.
          http_code=$(curl -sS -o /tmp/fleet.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer $FLEET_ENROLL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body" \
            "$FLEET_BASE_URL/fleet/desired/all")
          if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
            echo "Fleet desired state published (HTTP $http_code)."
          elif [ "$http_code" = "404" ]; then
            echo "::notice::No fleet endpoint yet at $FLEET_BASE_URL; skipping (404)."
            exit 0
          else
            echo "::warning::Fleet publish returned HTTP $http_code; continuing without failing the deploy."
          fi
          exit 0

  post-deploy:
    name: Post-deploy verification
    needs: [deploy-frontend, deploy-edge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Follow the environment that was actually deployed. Probing the production
      # hosts unconditionally meant a dev run reported on services it had not
      # touched, and the previous edge URL was built from the worker name rather
      # than a real workers.dev hostname, so it could never have passed.
      TARGET_ENV: ${{ github.event_name == 'pull_request' && 'preview' || (startsWith(github.ref, 'refs/tags/') && 'prod' || (inputs.environment != '' && inputs.environment || 'dev')) }}
    steps:
      - name: Verify all services
        run: |
          set -uo pipefail
          case "$TARGET_ENV" in
            prod)
              backend="https://api.tracera.pheno.studio/healthz"
              frontend="https://tracera.pheno.studio"
              ;;
            *)
              backend="https://api.tracera.pheno.studio/healthz"
              frontend="https://tracera-kappa.vercel.app"
              ;;
          esac
          echo "Target environment: $TARGET_ENV"

          echo "=== Backend (self-hosted via Cloudflare Tunnel) ==="
          curl -sf "$backend" || echo "BACKEND: pending or behind Access"

          echo "=== Frontend ==="
          curl -sf -o /dev/null "$frontend" || echo "FRONTEND: pending"

          echo "=== Edge ==="
          echo "The edge worker is environment-scoped; deploy-edge above verifies it."

          echo "=== All deployments triggered ==="

      - name: Summary
        run: |
          {
            echo "## Deployment Summary"
            echo "| Service | Platform | Status |"
            echo "|---------|----------|--------|"
            echo "| Backend | Self-hosted (tunnel) | operator-managed |"
            echo "| Frontend | Vercel | ${{ needs.deploy-frontend.result }} |"
            echo "| Edge | Cloudflare | ${{ needs.deploy-edge.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
