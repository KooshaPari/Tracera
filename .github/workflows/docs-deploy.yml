name: Deploy Documentation Site
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
"on":
  push:
    branches:
    - main
    paths:
    - frontend/apps/docs/**
    - backend/**/*.go
    - .github/workflows/docs-deploy.yml
  pull_request:
    branches:
    - main
    paths:
    - frontend/apps/docs/**
    - backend/**/*.go
    - .github/workflows/docs-deploy.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: preview
        type: choice
        options:
        - preview
        - production
permissions:
  contents: read
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
  NODE_VERSION: '20'
jobs:
  generate-openapi:
    name: Generate OpenAPI Specification
    runs-on: ubuntu-latest
    outputs:
      spec-generated: ${{ steps.check-spec.outputs.generated || steps.scope.outputs.generated
        }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
    - name: Check docs app scope
      id: scope
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\nelif [[\
        \ -n \"${{ github.event.before }}\" ]]; then\n  base=\"${{ github.event.before\
        \ }}\"\nelse\n  base=\"HEAD~1\"\nfi\nchanged=\"$(git diff --name-only \"$base\"\
        ...HEAD || true)\"\nif echo \"$changed\" | grep -Eq '^(backend/|frontend/apps/docs/)';\
        \ then\n  echo \"run=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"run=false\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"generated=false\" >> \"$GITHUB_OUTPUT\"\n\
        fi\n"
    - name: Set up Go
      if: steps.scope.outputs.run == 'true'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: '1.23'
        cache: true
        cache-dependency-path: backend/go.sum
    - name: Install swag
      if: steps.scope.outputs.run == 'true'
      run: go install github.com/swaggo/swag/cmd/swag@latest
    - name: Generate OpenAPI spec
      if: steps.scope.outputs.run == 'true'
      working-directory: backend
      run: "swag init \\\n  --generalInfo main.go \\\n  --dir ./ \\\n  --output ./docs\
        \ \\\n  --parseDependency \\\n  --parseInternal \\\n  --parseDepth 2 \\\n\
        \  --instanceName \"tracertm\"\n"
    - name: Validate OpenAPI spec
      if: steps.scope.outputs.run == 'true'
      run: 'npm install -g @apidevtools/swagger-cli

        swagger-cli validate backend/docs/tracertm_swagger.json

        '
    - name: Copy spec to docs public directory
      if: steps.scope.outputs.run == 'true'
      run: 'mkdir -p frontend/apps/docs/public/api

        cp backend/docs/tracertm_swagger.json frontend/apps/docs/public/api/openapi.json

        cp backend/docs/tracertm_swagger.yaml frontend/apps/docs/public/api/openapi.yaml

        '
    - name: Check if spec changed
      id: check-spec
      if: steps.scope.outputs.run == 'true'
      run: "if git diff --quiet HEAD -- frontend/apps/docs/public/api/; then\n  echo\
        \ \"generated=false\" >> $GITHUB_OUTPUT\nelse\n  echo \"generated=true\" >>\
        \ $GITHUB_OUTPUT\nfi\n"
    - name: Upload OpenAPI spec
      if: steps.scope.outputs.run == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: openapi-spec
        path: 'frontend/apps/docs/public/api/openapi.json

          frontend/apps/docs/public/api/openapi.yaml

          '
        retention-days: 7
    timeout-minutes: 30
  build-docs:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    needs: generate-openapi
    if: needs.generate-openapi.outputs.spec-generated == 'true'
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Setup Bun
      uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
      with:
        bun-version: latest
    - name: Download OpenAPI spec
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: openapi-spec
        path: frontend/apps/docs/public/api
    - name: Install dependencies
      working-directory: frontend
      run: bun install --frozen-lockfile
    - name: Generate TypeScript types from OpenAPI
      working-directory: frontend/apps/docs
      run: "if [ -f \"scripts/generate-types.ts\" ]; then\n  bun run scripts/generate-types.ts\n\
        fi\n"
    - name: Build documentation site
      working-directory: frontend/apps/docs
      run: bun run build
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.tracertm.com'
          }}
        NEXT_PUBLIC_DOCS_URL: ${{ secrets.NEXT_PUBLIC_DOCS_URL || 'https://docs.tracertm.com'
          }}
    - name: Run type check
      working-directory: frontend/apps/docs
      run: bun run typecheck
    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: docs-build
        path: frontend/apps/docs/.next
        retention-days: 7
    timeout-minutes: 30
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs:
    - generate-openapi
    - build-docs
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.environment == 'preview')
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Setup Bun
      uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
      with:
        bun-version: latest
    - name: Download OpenAPI spec
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: openapi-spec
        path: frontend/apps/docs/public/api
    - name: Install Vercel CLI
      run: bun install --global vercel@latest
    - name: Pull Vercel Environment Information
      working-directory: frontend/apps/docs
      run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN
        }}
    - name: Build Project Artifacts
      working-directory: frontend/apps/docs
      run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.tracertm.com'
          }}
    - name: Deploy to Vercel Preview
      id: deploy
      working-directory: frontend/apps/docs
      run: 'DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN
        }})

        echo "preview-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

        echo "Deployed to: $DEPLOYMENT_URL"

        '
    - name: Comment PR with Preview URL
      if: github.event_name == 'pull_request'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: "const previewUrl = '${{ steps.deploy.outputs.preview-url }}';\nconst\
          \ comment = `## \U0001F4DA Documentation Preview Deployed!\n\nPreview URL:\
          \ ${previewUrl}\n\n### What's included:\n- ✅ Updated OpenAPI specification\n\
          - ✅ API reference documentation\n- ✅ User guides and tutorials\n\nThis preview\
          \ will be available until the PR is closed.`;\n\ngithub.rest.issues.createComment({\n\
          \  issue_number: context.issue.number,\n  owner: context.repo.owner,\n \
          \ repo: context.repo.repo,\n  body: comment\n});\n"
    timeout-minutes: 30
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs:
    - generate-openapi
    - build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name
      == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://docs.tracertm.com
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Setup Bun
      uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
      with:
        bun-version: latest
    - name: Download OpenAPI spec
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: openapi-spec
        path: frontend/apps/docs/public/api
    - name: Install Vercel CLI
      run: bun install --global vercel@latest
    - name: Pull Vercel Environment Information
      working-directory: frontend/apps/docs
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN
        }}
    - name: Build Project Artifacts
      working-directory: frontend/apps/docs
      run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.tracertm.com'
          }}
        NEXT_PUBLIC_DOCS_URL: https://docs.tracertm.com
    - name: Deploy to Vercel Production
      id: deploy
      working-directory: frontend/apps/docs
      run: 'DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN
        }})

        echo "production-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

        echo "Deployed to: $DEPLOYMENT_URL"

        '
    - name: Create deployment summary
      run: 'echo "# 🚀 Documentation Deployed to Production" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "**Deployment URL:** https://docs.tracertm.com" >> $GITHUB_STEP_SUMMARY

        echo "**Vercel URL:** ${{ steps.deploy.outputs.production-url }}" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### Deployed Components:" >> $GITHUB_STEP_SUMMARY

        echo "- OpenAPI Specification (updated: ${{ needs.generate-openapi.outputs.spec-generated
        }})" >> $GITHUB_STEP_SUMMARY

        echo "- API Reference Documentation" >> $GITHUB_STEP_SUMMARY

        echo "- User Guides" >> $GITHUB_STEP_SUMMARY

        echo "- Getting Started Guides" >> $GITHUB_STEP_SUMMARY

        '
    timeout-minutes: 30
  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Wait for deployment to propagate
      run: sleep 30
    - name: Check site accessibility
      run: "response=$(curl -s -o /dev/null -w \"%{http_code}\" https://docs.tracertm.com)\n\
        if [ \"$response\" != \"200\" ]; then\n  echo \"Site returned HTTP $response\"\
        \n  exit 1\nfi\necho \"Site is accessible (HTTP $response)\"\n"
    - name: Verify OpenAPI spec availability
      run: "response=$(curl -s -o /dev/null -w \"%{http_code}\" https://docs.tracertm.com/api/openapi.json)\n\
        if [ \"$response\" != \"200\" ]; then\n  echo \"OpenAPI spec not accessible\
        \ (HTTP $response)\"\n  exit 1\nfi\necho \"OpenAPI spec is accessible (HTTP\
        \ $response)\"\n"
    - name: Check critical pages
      run: "pages=(\n  \"/\"\n  \"/docs\"\n  \"/api-reference\"\n)\n\nfor page in\
        \ \"${pages[@]}\"; do\n  response=$(curl -s -o /dev/null -w \"%{http_code}\"\
        \ \"https://docs.tracertm.com$page\")\n  if [ \"$response\" != \"200\" ] &&\
        \ [ \"$response\" != \"308\" ]; then\n    echo \"Page $page returned HTTP\
        \ $response\"\n    exit 1\n  fi\n  echo \"Page $page is accessible (HTTP $response)\"\
        \ndone\n"
    - name: Validate deployment summary
      run: 'echo "# ✅ Deployment Validation Complete" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "All checks passed successfully!" >> $GITHUB_STEP_SUMMARY'
    timeout-minutes: 30
