<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Tracera brand icon">
  <title>Tracera</title>
  <desc>Hexagonal trace-link matrix with central requirement diamond. Keycap palette midnight + teal with indigo accent.</desc>
  <defs>
    <linearGradient id="tracera-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ebab5"/>
      <stop offset="55%" stop-color="#5a9aa6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="tracera-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ebab5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="tracera-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7ebab5" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090a0c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tracera-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#a5b4fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="tracera-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tracera-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <pattern id="tracera-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7ebab5" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Midnight background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#090a0c"/>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#tracera-grid)"/>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#tracera-glow)"/>

  <!-- Subtle grid behind, very low opacity -->
  <g opacity="0.18" stroke="#7ebab5" stroke-width="0.6" fill="none">
    <line x1="80" y1="80" x2="432" y2="80"/>
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="352" x2="432" y2="352"/>
    <line x1="80" y1="432" x2="432" y2="432"/>
    <line x1="80" y1="80" x2="80" y2="432"/>
    <line x1="160" y1="80" x2="160" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="352" y1="80" x2="352" y2="432"/>
    <line x1="432" y1="80" x2="432" y2="432"/>
  </g>

  <!-- Outer hexagon, glassy gradient, low opacity -->
  <g filter="url(#tracera-shadow)">
    <polygon points="256,64 416,160 416,352 256,448 96,352 96,160"
             fill="url(#tracera-grad)" fill-opacity="0.25"
             stroke="url(#tracera-edge)" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Inner hexagon, slightly smaller, more opaque -->
  <polygon points="256,120 376,192 376,320 256,392 136,320 136,192"
           fill="#0f1418" fill-opacity="0.55"
           stroke="#7ebab5" stroke-width="1.5" stroke-opacity="0.6" stroke-linejoin="round"/>

  <!-- 6 trace node circles at hexagon vertices -->
  <g fill="#7ebab5">
    <circle cx="256" cy="64"  r="10"/>
    <circle cx="416" cy="160" r="10"/>
    <circle cx="416" cy="352" r="10"/>
    <circle cx="256" cy="448" r="10"/>
    <circle cx="96"  cy="352" r="10"/>
    <circle cx="96"  cy="160" r="10"/>
  </g>
  <g fill="#090a0c">
    <circle cx="256" cy="64"  r="4"/>
    <circle cx="416" cy="160" r="4"/>
    <circle cx="416" cy="352" r="4"/>
    <circle cx="256" cy="448" r="4"/>
    <circle cx="96"  cy="352" r="4"/>
    <circle cx="96"  cy="160" r="4"/>
  </g>

  <!-- 3 connecting dashed lines forming a triangle (trace links) -->
  <g stroke="#7ebab5" stroke-width="2.2" stroke-dasharray="6 5" fill="none" opacity="0.7" stroke-linecap="round">
    <line x1="256" y1="64"  x2="416" y2="352"/>
    <line x1="416" y1="352" x2="96"  y2="352"/>
    <line x1="96"  y1="352" x2="256" y2="64"/>
  </g>

  <!-- Faint secondary links -->
  <g stroke="#6366f1" stroke-width="1.4" stroke-dasharray="3 4" fill="none" opacity="0.55" stroke-linecap="round">
    <line x1="416" y1="160" x2="96"  y2="160"/>
    <line x1="416" y1="160" x2="256" y2="448"/>
    <line x1="96"  y1="160" x2="256" y2="448"/>
  </g>

  <!-- Center diamond (rotated square) = the core requirement -->
  <g filter="url(#tracera-shadow)">
    <polygon points="256,176 336,256 256,336 176,256"
             fill="#6366f1" fill-opacity="0.92"
             stroke="#a5b4fc" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Inner glassy diamond -->
  <polygon points="256,200 312,256 256,312 200,256"
           fill="#0f1418" fill-opacity="0.55"
           stroke="#c7d2fe" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Center glow + dot -->
  <circle cx="256" cy="256" r="36" fill="url(#tracera-core)" opacity="0.85"/>
  <circle cx="256" cy="256" r="8"  fill="#ffffff"/>

  <!-- Tiny corner accents (keycap feel) -->
  <g fill="#7ebab5" opacity="0.55">
    <rect x="40"  y="40"  width="14" height="3"  rx="1.5"/>
    <rect x="40"  y="40"  width="3"  height="14" rx="1.5"/>
    <rect x="458" y="40"  width="14" height="3"  rx="1.5"/>
    <rect x="469" y="40"  width="3"  height="14" rx="1.5"/>
    <rect x="40"  y="469" width="14" height="3"  rx="1.5"/>
    <rect x="40"  y="458" width="3"  height="14" rx="1.5"/>
    <rect x="458" y="469" width="14" height="3"  rx="1.5"/>
    <rect x="469" y="458" width="3"  height="14" rx="1.5"/>
  </g>
</svg>
