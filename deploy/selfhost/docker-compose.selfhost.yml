services:
  postgres:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_USER: ${TRACERA_POSTGRES_USER:-tracera}
      POSTGRES_PASSWORD: ${TRACERA_POSTGRES_PASSWORD:?TRACERA_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${TRACERA_POSTGRES_DB:-tracera}
    volumes:
      - tracera-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - database
    restart: unless-stopped

  tracera-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      TRACERA_BIND_ADDR: 0.0.0.0:8080
      TRACERA_CORS_ORIGINS: ${TRACERA_CORS_ORIGINS:?TRACERA_CORS_ORIGINS is required}
      DATABASE_URL: ${TRACERA_DATABASE_URL:?TRACERA_DATABASE_URL is required}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app
      - database
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      tracera-server:
        condition: service_healthy
    environment:
      TRACERA_PUBLIC_HOSTNAME: ${TRACERA_PUBLIC_HOSTNAME:-tracera.pheno.studio}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider --header="Host: $${TRACERA_PUBLIC_HOSTNAME}" http://127.0.0.1/healthz
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - app
      - edge
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.7.1
    depends_on:
      caddy:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN is required}
    environment:
      CF_TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  tracera-postgres-data:

networks:
  app:
  database:
    internal: true
  edge:
