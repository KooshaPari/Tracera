services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${TRACERA_POSTGRES_USER:-tracera}
      POSTGRES_PASSWORD: ${TRACERA_POSTGRES_PASSWORD:?TRACERA_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${TRACERA_POSTGRES_DB:-tracera}
    volumes:
      - tracera-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  tracera-server:
    image: rust:1.82-bookworm
    working_dir: /workspace
    command: sh -lc "cargo run --release -p tracera-server"
    environment:
      TRACERA_BIND_ADDR: 0.0.0.0:8080
      TRACERA_CORS_ORIGINS: ${TRACERA_CORS_ORIGINS:-}
      DATABASE_URL: postgres://${TRACERA_POSTGRES_USER:-tracera}:${TRACERA_POSTGRES_PASSWORD:?TRACERA_POSTGRES_PASSWORD is required}@postgres:5432/${TRACERA_POSTGRES_DB:-tracera}
    volumes:
      - ../..:/workspace
      - tracera-cargo-cache:/usr/local/cargo/registry
      - tracera-target-cache:/workspace/target
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - tracera-server
    environment:
      TRACERA_PUBLIC_HOSTNAME: ${TRACERA_PUBLIC_HOSTNAME:-tracera.pheno.studio}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      - caddy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN is required}
    environment:
      CF_TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  tracera-cargo-cache:
  tracera-target-cache:
  tracera-postgres-data:
