version: '3.8'

services:
  tracera-server:
    image: tracera:latest
    container_name: tracera-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Tracera server configuration
      PORT: "8080"
      LOG_LEVEL: "info"

      # Database connection
      DATABASE_URL: ${DATABASE_URL:-}

      # Authentication (WorkOS)
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}

      # Optional: API keys and service integrations
      # SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      # GITHUB_PAT: ${GITHUB_PAT:-}
    volumes:
      - tracera-data:/data
    networks:
      - tracera-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:latest
    container_name: tracera-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    environment:
      HOSTNAME: ${HOSTNAME:-tracera.pheno.studio}
      TRACERA_SERVER: tracera-server:8080
    networks:
      - tracera-net
    depends_on:
      - tracera-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tracera-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    networks:
      - tracera-net
    depends_on:
      - caddy
    profiles:
      - cloudflare

volumes:
  tracera-data:
  caddy-data:
  caddy-config:

networks:
  tracera-net:
    driver: bridge
