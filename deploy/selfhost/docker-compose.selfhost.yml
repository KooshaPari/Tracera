services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: tracera
    expose:
      - "5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracera -d tracera"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  tracera-server:
    build:
      context: ../..
      dockerfile: Dockerfile.rust
    environment:
      TRACERA_BIND_ADDR: 0.0.0.0:8080
      TRACERA_PUBLIC_BIND_MODE: ${TRACERA_PUBLIC_BIND_MODE:?TRACERA_PUBLIC_BIND_MODE=authenticated-proxy is required}
      TRACERA_AUTH_TOKEN: ${TRACERA_AUTH_TOKEN:?TRACERA_AUTH_TOKEN is required for in-process API protection}
      DATABASE_URL: postgres://tracera:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/tracera
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - tracera-server
    environment:
      TRACERA_PUBLIC_HOSTNAME: ${TRACERA_PUBLIC_HOSTNAME:-tracera.pheno.studio}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      - caddy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN is required}
    environment:
      CF_TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    restart: unless-stopped

volumes:
  pg-data:
  caddy-data:
  caddy-config:
