# -- Tracera Helm values (default; override per environment) --

tracera:
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    repository: ghcr.io/kooshapari/tracera
    pullPolicy: IfNotPresent
    tag: "v0.1.0-native-exe"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

persistence:
  data:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

# Reference a provisioned secret; chart never emits placeholder credentials.
secrets:
  existingSecret: ""
