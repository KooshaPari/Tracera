apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "phase-finish-stack.fullname" . }}-data
  labels:
    app.kubernetes.io/part-of: phase-finish-stack
spec:
spec:
  accessModes:
    - {{ default "ReadWriteOnce" .Values.persistence.accessModes | quote }}
  resources:
    requests:
      storage: {{ default "10Gi" .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
    requests:
      storage: {{ .Values.persistence.size | default "50Gi" }}
