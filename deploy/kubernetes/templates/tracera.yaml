{{- /*
Tracera deployment — Rust/axum native server.
Runs as a single replica unless replicas > 1 in values.yaml.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phase-finish-stack.fullname" . }}-tracera
  labels:
    app.kubernetes.io/name: tracera
    app.kubernetes.io/part-of: phase-finish-stack
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.tracera.autoscaling.enabled }}
  replicas: {{ .Values.tracera.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tracera
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracera
        app.kubernetes.io/part-of: phase-finish-stack
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tracera-server
          image: "{{ .Values.tracera.image.repository }}:{{ .Values.tracera.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.tracera.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
              ephemeral-storage: 512Mi
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "phase-finish-stack.fullname" . }}-env
                  key: RUST_LOG
            - name: TRACE_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "phase-finish-stack.fullname" . }}-env
                  key: TRACE_LOG_LEVEL
            - name: TRACERA_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "phase-finish-stack.fullname" . }}-env
                  key: TRACERA_BACKEND_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "phase-finish-stack.fullname" . }}-env
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          {{- with .Values.secrets.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.tracera.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.tracera.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "phase-finish-stack.fullname" . }}-tracera
  labels:
    app.kubernetes.io/name: tracera
    app.kubernetes.io/part-of: phase-finish-stack
spec:
  type: {{ .Values.tracera.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.tracera.service.port | default 8080 }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: tracera
