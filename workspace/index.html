<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tracera</title>
    <meta name="description" content="Distributed trace workbench — replay, tail, and route telemetry from one polyglot surface." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" href="/icons/tracera-icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/tracera-icon-192.png" />
    <!-- Inline minimal shell so the SW caches something meaningful even before the SPA bundle loads -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; background: #0b1020; color: #e6eaf2; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 880px; margin: 0 auto; padding: 48px 24px; }
      h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { color: #a0a8ba; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
      a.btn { padding: 10px 14px; border: 1px solid #2a3350; border-radius: 8px; color: #e6eaf2; text-decoration: none; }
      a.btn:hover { background: #1a2238; }
      code { background: #13203a; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tracera</h1>
      <p>Polyglot trace workbench. The PWA shell loads before the SPA bundle so you can install + open offline-home, and the Rust <code>tracera-server</code> handles auth-gated routing separately.</p>
      <nav class="row">
        <a class="btn" href="/replay">Open Replay</a>
        <a class="btn" href="/live">Live Tail</a>
        <a class="btn" href="/dashboard">Dashboard</a>
        <a class="btn" href="/v1/models">API Models</a>
      </nav>
    </main>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((e) => console.warn('SW failed:', e));
        });
      }
    </script>
  </body>
</html>
